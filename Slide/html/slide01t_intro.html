<header>1.1 技術演進脈絡</header>
<h2 id="11-%E5%9B%9B%E5%A4%A7%E5%B7%A5%E6%A5%AD%E9%9D%A9%E5%91%BD%E6%99%82%E4%BB%A3">1.1 四大工業革命時代</h2>
<ul>
<li data-marpit-fragment="1"><strong>工業 1.0 — 機械化時代（18 世紀末至 19 世紀中葉）：</strong>
<ul>
<li data-marpit-fragment="2">蒸汽與水力動力取代人體肌肉；工廠制度應運而生。</li>
<li data-marpit-fragment="3"><em>軟體角色：</em> 無。純物理機械範疇。</li>
</ul>
</li>
<li data-marpit-fragment="4"><strong>工業 2.0 — 大規模量產時代（19 世紀末至 20 世紀初）：</strong>
<ul>
<li data-marpit-fragment="5">電力、流水線裝配作業，推動標準化大規模生產。</li>
<li data-marpit-fragment="6"><em>軟體角色：</em> 無。控制邏輯由物理電路硬焊決定。</li>
</ul>
</li>
<li data-marpit-fragment="7"><strong>工業 3.0 — 數位革命時代（20 世紀中葉至末期）：</strong>
<ul>
<li data-marpit-fragment="8">半導體、微處理器、PLC 與 PC 普及。</li>
<li data-marpit-fragment="9"><em>軟體角色：</em> <strong>獨立成為一門專業領域</strong>，用於控制硬體與處理資料。</li>
</ul>
</li>
<li data-marpit-fragment="10"><strong>工業 4.0 — 互聯、雲端與 AI 時代（21 世紀至今）：</strong>
<ul>
<li data-marpit-fragment="11">虛實整合系統 (CPS)、物聯網 (IoT)、雲端與自適應 AI。</li>
<li data-marpit-fragment="12"><em>軟體角色：</em> <strong>支撐現代社會運轉的中樞神經與核心基礎建設</strong>。</li>
</ul>
</li>
</ul>

<h2 id="12-1960-%E5%B9%B4%E4%BB%A3%E5%BE%8C%E6%9C%9F%E7%9A%84%E8%BB%9F%E9%AB%94%E5%8D%B1%E6%A9%9F">1.2 1960 年代後期的軟體危機</h2>
<div class="split55">

<ul>
<li data-marpit-fragment="1">隨著硬體成本急劇下降，軟體需求與複雜度呈爆炸性增長。</li>
<li data-marpit-fragment="2"><strong>軟體危機的病徵：</strong>
<ul>
<li data-marpit-fragment="3">專案時程嚴重延宕，甚至完成前即遭廢棄。</li>
<li data-marpit-fragment="4">預算超支嚴重（常達最初預算的 3~4 倍）。</li>
<li data-marpit-fragment="5">系統品質低劣、頻繁崩潰且極難維護。</li>
</ul>
</li>
<li data-marpit-fragment="6"><strong>根本根源：</strong> 將軟體開發視為孤立的手工藝做法，無法因應大型複雜系統。</li>
</ul>

<h2 id="12-1968-%E5%B9%B4-nato-garmisch-%E6%9C%83%E8%AD%B0">1.2 1968 年 NATO Garmisch 會議</h2>
<ul>
<li data-marpit-fragment="1"><strong>1968 年 10 月於德國加米施 (Garmisch) 召開：</strong>
<ul>
<li data-marpit-fragment="2">50 位頂尖電腦科學家、業界主管與學者匯聚。</li>
<li data-marpit-fragment="3">正式確立了 <strong>「軟體工程 (Software Engineering)」</strong> 一詞。</li>
</ul>
</li>
<li data-marpit-fragment="4"><strong>歷史使命：</strong>
<ul>
<li data-marpit-fragment="5">引導軟體開發從隨意無序的手工編程，轉型為<strong>具備嚴謹紀律的工程學科</strong>。</li>
<li data-marpit-fragment="6">引進結構化方法論、形式化規格、成本估算、嚴格驗證與專案管理。</li>
</ul>
</li>
</ul>

<header>1.2 軟體工程起源與軟體危機</header>
<h2 id="%E8%A7%80%E5%BF%B5%E6%AA%A2%E9%A9%97%E8%BB%9F%E9%AB%94%E5%8D%B1%E6%A9%9F%E7%9A%84%E6%9C%AC%E8%B3%AA-ccq-2">觀念檢驗：軟體危機的本質 (CCQ 2)</h2>
<div class="ccq-columns">
  <div class="ccq-text">
<p><strong>為何 1968 年的軟體危機無法僅透過採購運算速度更快的超級電腦或擴充硬體記憶體來解決？</strong></p>
<ul>
<li data-marpit-fragment="1">
<p><strong>A.</strong> 危機是由 1960 年代後期的硬體製造延遲與矽晶片短缺所導致的。</p>
</li>
<li data-marpit-fragment="2">
<p><strong>B.</strong> 危機是管理系統複雜度的認知與組織失敗，更快的硬體只會放大這個問題。</p>
</li>
<li data-marpit-fragment="3">
<p><strong>C.</strong> 危機源於早期的程式語言缺乏基本的數學與計算功能。</p>
</li>
<li data-marpit-fragment="4">
<p><strong>D.</strong> 危機發生是因為早期大型主機與現代的分散式雲端架構不相容。</p>
</div>

</div>
</li>
</ul>

<h2 id="13-%E8%BB%9F%E9%AB%94%E5%86%B0%E5%B1%B1%E8%B6%85%E8%B6%8A%E5%8E%9F%E5%A7%8B%E7%A2%BC%E7%9A%84%E5%9B%9B%E5%A4%A7%E6%94%AF%E6%9F%B1">1.3 軟體冰山：超越原始碼的四大支柱</h2>
<blockquote>
<p><strong>軟體 (IEEE 標準定義)：</strong> 與計算機系統運作相關的電腦程式、程序、以及可能伴隨的相關文件與資料。</p>
</blockquote>
<ul>
<li data-marpit-fragment="1"><strong>1. 程式 (Programs)：</strong> 可執行的機器碼與原始程式碼檔案（邏輯核心）。</li>
<li data-marpit-fragment="2"><strong>2. 資料 (Data &amp; Schemas)：</strong> 資料庫綱要、設定檔、AI 模型權重（如 Knight Capital 設定檔出錯釀 4.4 億美元損失）。</li>
<li data-marpit-fragment="3"><strong>3. 程序 (Procedures)：</strong> 部署腳本、CI/CD 管線、災難備援 SOP（如 GitLab 刪庫且備份程序失效事件）。</li>
<li data-marpit-fragment="4"><strong>4. 文檔 (Documentation)：</strong> 架構設計 ADD、API OpenAPI 規格、使用者手冊（如 Therac-25 程式碼重用且無文件說明導致過載致死）。</li>
</ul>

<li data-marpit-fragment="1">許多軟體專案之所以失敗，是因為開發人員與專案經理掉入了只關注軟體冰山頂端——<strong>程式原始碼</strong>的陷阱中。</li>
<li data-marpit-fragment="2">他們僅以寫了多少行程式碼或交付了多少功能來衡量進度，卻忽略了資料庫遷移（資料）、CI/CD 部署管線與復原守則（程序）、以及系統設計與 API 規格（文檔）。</li>
<li data-marpit-fragment="3">缺乏這四大支柱中的任何一項，系統就稱不上是「專業軟體」，而只是一個無法順暢部署、難以維護且運作危險的脆弱程式。</li>
</ul>
<footer>Ch 01 · 軟體工程導論</footer>

<header>1.3 軟體本質剖析</header>
<h2 id="%E8%A7%80%E5%BF%B5%E6%AA%A2%E9%A9%97ieee-%E8%BB%9F%E9%AB%94%E6%A8%99%E6%BA%96%E5%AE%9A%E7%BE%A9-ccq-3">觀念檢驗：IEEE 軟體標準定義 (CCQ 3)</h2>
<div class="ccq-columns">
  <div class="ccq-text">
<p><strong>根據 IEEE 標準對軟體的正式定義，以下哪一項不被視為軟體的組成部分？</strong></p>
<ul>
<li data-marpit-fragment="1">
<p><strong>A.</strong> 可執行的電腦程式與原始程式碼檔案。</p>
</li>
<li data-marpit-fragment="2">
<p><strong>B.</strong> 系統資料庫綱要與組態設定檔案。</p>
</li>
<li data-marpit-fragment="3">
<p><strong>C.</strong> CPU 處理器硬體與物理記憶體單元。</p>
</li>
<li data-marpit-fragment="4">
<p><strong>D.</strong> 軟體的安裝說明與系統部署程序。</p>
</div>
<div class="ccq-logo">
  <img src="../../img/ch01/question_icon.svg" alt="Question" />
</div>
</li>
</ul>
</div>

<header>1.4 ISO 9126 品質模型</header>
<h2 id="14-%E5%93%81%E8%B3%AA%E5%AD%90%E5%B1%AC%E6%80%A7%E5%AF%A6%E5%8B%99%E6%A1%88%E4%BE%8B">1.4 品質子屬性實務案例</h2>
<ul>
<li data-marpit-fragment="1"><strong>容錯性 (Reliability)：</strong> 主要支付閘道故障時，系統自動捕捉異常並改走備用閘道重試，使用者無感。</li>
<li data-marpit-fragment="2"><strong>易回復性 (Reliability)：</strong> 資料庫系統意外斷電重啟後，在 30 秒內透過預寫式日誌 (WAL) 自動恢復一致性。</li>
<li data-marpit-fragment="3"><strong>時間特性 (Efficiency)：</strong> 搜尋 API 的回應延遲，在 99% 的情況下皆小於 80 毫秒（p99 延遲 &lt; 80ms）。</li>
<li data-marpit-fragment="4"><strong>可測試性 (Maintainability)：</strong> 程式碼採用相依性注入設計，讓單元測試時能輕鬆 Mock 資料庫與外部 API。</li>
<li data-marpit-fragment="5"><strong>易安裝性 (Portability)：</strong> 本地開發環境能透過 <code>docker compose up</code> 在 60 秒內自動建構完成。</li>
</ul>

<h2 id="%E8%A7%80%E5%BF%B5%E6%AA%A2%E9%A9%97%E5%AF%A6%E5%8B%99%E5%95%8F%E9%A1%8C%E8%88%87%E5%93%81%E8%B3%AA%E5%9B%A0%E7%B4%A0%E5%B0%8D%E6%87%89-ccq-5">觀念檢驗：實務問題與品質因素對應 (CCQ 5)</h2>
<div class="ccq-columns">
  <div class="ccq-text">
<p><strong>以下哪一個選項正確將真實世界的軟體問題與其對應的 ISO 9126 品質特徵進行了配對？</strong></p>
<ul>
<li data-marpit-fragment="1">
<p><strong>A.</strong> 資料庫查詢需要 15 秒才能回傳結果 <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> Maintainability (Testability)</p>
</li>
<li data-marpit-fragment="2">
<p><strong>B.</strong> 當第三方 API 斷線時，系統發生崩潰 <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> Reliability (Fault Tolerance)</p>
</li>
<li data-marpit-fragment="3">
<p><strong>C.</strong> 由於程式碼緊密耦合，開發人員難以撰寫單元測試 <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> Portability (Adaptability)</p>
</li>
<li data-marpit-fragment="4">
<p><strong>D.</strong> 應用程式無法在新版本的 macOS 上運行 <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> Usability (Operability)</p>

<header>1.5 現代軟體多元樣貌</header>
<h2 id="15-%E7%8F%BE%E4%BB%A3%E7%95%B0%E8%B3%AA%E7%B3%BB%E7%B5%B1%E4%BB%A5-youbike-%E7%82%BA%E4%BE%8B">1.5 現代異質系統：以 YouBike 為例</h2>
<ul>
<li data-marpit-fragment="1">現代的軟體系統很少是單一形態的程式，而是整合多領域的異質系統。</li>
<li data-marpit-fragment="2"><strong>YouBike 智慧單車系統</strong> 融合了多種軟體類別：
<ul>
<li data-marpit-fragment="3"><strong>嵌入式韌體：</strong> 自行車上的 IoT 車機、智慧鎖控制、智慧車柱（樁）。</li>
<li data-marpit-fragment="4"><strong>行動 App：</strong> 行動地圖查詢、車輛預約、掃碼扣款解鎖。</li>
<li data-marpit-fragment="5"><strong>網頁應用程式：</strong> 官方網站、會員帳戶管理、即時站點狀態查詢。</li>
<li data-marpit-fragment="6"><strong>企業後端系統：</strong> 資料庫交易處理、悠遊卡/信用卡支付後端、調度管理。</li>
</ul>
</li>
<li data-marpit-fragment="7">軟體工程的核心挑戰在於協調這些領域的軟體，平衡不同的約束與部署週期。</li>
</ul>

<ul>
<li data-marpit-fragment="1"><strong>Web &amp; SaaS 平台：</strong> 強調高可用性、彈性伸縮、微服務與不停機部署（如 Netflix）。</li>
<li data-marpit-fragment="2"><strong>行動 App：</strong> 考量電力消耗、觸控介面與不穩定行動網路（React Native/Flutter）。</li>
<li data-marpit-fragment="3"><strong>企業系統 (ERP/CRM)：</strong> 重視 ACID 交易、複雜商務邏輯與資料治理（SAP）。</li>
<li data-marpit-fragment="4"><strong>嵌入式韌體與 IoT：</strong> 即時性系統，記憶體資源受限，且不容許系統當機（醫材/車控）。</li>
<li data-marpit-fragment="5"><strong>AI &amp; 機器學習：</strong> 機器學習管線 (MLOps)、GPU 加速計算、向量資料庫與 LLM 推理。</li>
<li data-marpit-fragment="6"><strong>科學與 CAD 應用：</strong> 高運算效能模擬套件，極度要求浮點數運算精確度。</li>
</ul>

<header>1.6 何謂軟體工程？</header>
<h2 id="16-%E8%BB%9F%E9%AB%94%E5%B7%A5%E7%A8%8B%E7%9A%84%E6%A0%B8%E5%BF%83%E5%AE%9A%E7%BE%A9">1.6 軟體工程的核心定義</h2>
<blockquote>
<p><strong>軟體工程 (Software Engineering)</strong>：一門關於軟體生產所有階段的工程學科——從初始的需求規格書制定，直到系統上線後的維護與演進。</p>
</blockquote>
<ul>
<li data-marpit-fragment="1"><strong>1. 工程學科 (Engineering Discipline)：</strong> 工程並非不計代價追求完美，而是要在<strong>有限資源與嚴格約束條件下妥協出合適解決方案</strong>的科學。</li>
<li data-marpit-fragment="2"><strong>2. 軟體流程所有階段 (All Aspects of Production)：</strong> 軟體開發是由一整套系統化的<strong>軟體工程流程 (SE Process)</strong> 所引導，明確規範各活動、角色分工、產出物件與品質檢查點。</li>
</ul>
<footer>Ch 01 · 軟體工程導論</footer>

<header>1.6 何謂軟體工程？</header>
<h2 id="16-%E7%B4%84%E6%9D%9F%E7%AE%A1%E7%90%86%E8%88%87%E8%B3%87%E6%BA%90%E5%84%AA%E5%8C%96">1.6 約束管理與資源優化</h2>
<ul>
<li data-marpit-fragment="1"><strong>約束條件 (Constraints - 限制)：</strong>
<ul>
<li data-marpit-fragment="2"><strong>時間：</strong> 專案交付死線、市場搶灘時間窗。</li>
<li data-marpit-fragment="3"><strong>預算：</strong> 開發人員薪資、雲端託管費、第三方套件授權費。</li>
<li data-marpit-fragment="4"><strong>技術限制：</strong> 舊系統相容性、硬體 CPU/記憶體限制。</li>
<li data-marpit-fragment="5"><strong>法規標準：</strong> GDPR 隱私法、HIPAA 醫療法規、PCI-DSS 金融支付標準。</li>
</ul>
</li>
<li data-marpit-fragment="6"><strong>資源資產 (Resources)：</strong>
<ul>
<li data-marpit-fragment="7"><strong>人力資源：</strong> 開發人員技能、UI/UX 設計師、QA 團隊。</li>
<li data-marpit-fragment="8"><strong>技術資產：</strong> 雲端設施 (AWS)、CI/CD 自動化、成熟開源套件。</li>
<li data-marpit-fragment="9"><strong>領域知識：</strong> 對業務流程的理解與專案開發經驗。</li>
</ul>
</li>
</ul>

<header>1.6 何謂軟體工程？</header>
<h2 id="16-%E6%A1%88%E4%BE%8B%E7%A0%94%E7%A9%B6%E9%86%AB%E7%99%82%E6%96%B0%E5%89%B5%E5%85%AC%E5%8F%B8-mvp-%E4%B8%8A%E7%B7%9A">1.6 案例研究：醫療新創公司 MVP 上線</h2>
<ul>
<li data-marpit-fragment="1"><strong>挑戰：</strong> 6 個月內推出一款病患醫生視訊 App，且預算極為吃緊，僅有 8 萬美元。</li>
<li data-marpit-fragment="2"><strong>工程權衡方案：</strong>
<ol>
<li><strong>範疇優先級：</strong> MVP 僅專注核心視訊與掛號；將保險給付延至 Phase 2。</li>
<li><strong>跨平台開發：</strong> 使用 Flutter/React Native 單一程式碼庫，節省 40% 前端人力。</li>
<li><strong>託管式雲端：</strong> 採用 HIPAA 合規的安全託管服務 (Firebase)，避免自建伺服器。</li>
<li><strong>自動化 CI/CD：</strong> GitHub Actions 自動測試，降低 QA 測試人力。</li>
</ol>
</li>
<li data-marpit-fragment="3"><strong>為什麼不選擇技術上「完美」的方案？</strong>
<ul>
<li data-marpit-fragment="4">自建分散式微服務架構在技術上最完美，但因違反 8 萬美元與 6 個月的死線而被否決。</li>
<li data-marpit-fragment="5"><strong>滿意解 (Satisficing)</strong>：在所有約束內找出「足夠好」的妥協方案，這才是正確的工程決策。</li>
</ul>

<header>1.6 何謂軟體工程？</header>
<h2 id="16-%E8%BB%9F%E9%AB%94%E5%B7%A5%E7%A8%8B%E7%9A%84%E5%A4%9A%E5%85%83%E7%B6%AD%E5%BA%A6">1.6 軟體工程的多元維度</h2>
<ul>
<li data-marpit-fragment="1"><strong>專業紀律 (Disciplines):</strong> 開發前設計規格、API 優先設計、落實 Code Review、撰寫架構決策 ADR。</li>
<li data-marpit-fragment="2"><strong>基礎原則 (Foundational Principles):</strong> 軟體理論根基：模組化、抽象化、預測變更、開閉原則 (OCP)。</li>
<li data-marpit-fragment="3"><strong>流程方法論 (Process Methodologies):</strong> 引導團隊運作框架：Waterfall、敏捷 (Agile/Scrum)、DevOps 自動化交付。</li>
<li data-marpit-fragment="4"><strong>啟發式法則 (Heuristics):</strong> 前人實務經驗：SOLID 設計原則、Clean Code 乾淨程式碼、DRY、YAGNI 原則。</li>
</ul>

<header>1.6 何謂軟體工程？</header>
<h2 id="16-%E7%A0%B4%E8%A7%A3%E5%B8%B8%E8%A6%8B%E7%9A%84%E8%BB%9F%E9%AB%94%E8%BF%B7%E6%80%9D">1.6 破解常見的軟體迷思</h2>
<ul>
<li data-marpit-fragment="1"><strong>迷思 1：「專案進度落後了，招募新工程師進來就能解決。」</strong>
<ul>
<li data-marpit-fragment="2"><strong>現實 (Brooks's Law)</strong>：在落後的專案中加入人手，只會讓專案更落後（新人培訓成本與 <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.566ex;" xmlns="http://www.w3.org/2000/svg" width="5.832ex" height="2.452ex" role="img" focusable="false" viewBox="0 -833.9 2577.6 1083.9"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D442" d="M740 435Q740 320 676 213T511 42T304 -22Q207 -22 138 35T51 201Q50 209 50 244Q50 346 98 438T227 601Q351 704 476 704Q514 704 524 703Q621 689 680 617T740 435ZM637 476Q637 565 591 615T476 665Q396 665 322 605Q242 542 200 428T157 216Q157 126 200 73T314 19Q404 19 485 98T608 313Q637 408 637 476Z"></path></g><g data-mml-node="mo" transform="translate(763,0)"><path data-c="28" d="M94 250Q94 319 104 381T127 488T164 576T202 643T244 695T277 729T302 750H315H319Q333 750 333 741Q333 738 316 720T275 667T226 581T184 443T167 250T184 58T225 -81T274 -167T316 -220T333 -241Q333 -250 318 -250H315H302L274 -226Q180 -141 137 -14T94 250Z"></path></g><g data-mml-node="msup" transform="translate(1152,0)"><g data-mml-node="mi"><path data-c="1D45B" d="M21 287Q22 293 24 303T36 341T56 388T89 425T135 442Q171 442 195 424T225 390T231 369Q231 367 232 367L243 378Q304 442 382 442Q436 442 469 415T503 336T465 179T427 52Q427 26 444 26Q450 26 453 27Q482 32 505 65T540 145Q542 153 560 153Q580 153 580 145Q580 144 576 130Q568 101 554 73T508 17T439 -10Q392 -10 371 17T350 73Q350 92 386 193T423 345Q423 404 379 404H374Q288 404 229 303L222 291L189 157Q156 26 151 16Q138 -11 108 -11Q95 -11 87 -5T76 7T74 17Q74 30 112 180T152 343Q153 348 153 366Q153 405 129 405Q91 405 66 305Q60 285 60 284Q58 278 41 278H27Q21 284 21 287Z"></path></g><g data-mml-node="mn" transform="translate(633,363) scale(0.707)"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z"></path></g></g><g data-mml-node="mo" transform="translate(2188.6,0)"><path data-c="29" d="M60 749L64 750Q69 750 74 750H86L114 726Q208 641 251 514T294 250Q294 182 284 119T261 12T224 -76T186 -143T145 -194T113 -227T90 -246Q87 -249 86 -250H74Q66 -250 63 -250T58 -247T55 -238Q56 -237 66 -225Q221 -64 221 250T66 725Q56 737 55 738Q55 746 60 749Z"></path></g></g></g></svg></mjx-container> 溝通管道暴增）。</li>
</ul>
</li>
<li data-marpit-fragment="3"><strong>迷思 2：「軟體具有高度彈性，在後期修改需求很便宜。」</strong>
<ul>
<li data-marpit-fragment="4"><strong>現實</strong>：後期修改會迫使已完成的資料庫、API 與代碼打掉重練，修改成本常是前期的 100 倍。</li>
</ul>
</li>
<li data-marpit-fragment="5"><strong>迷思 3：「只要把程式外包，我們就不需要懂技術管理。」</strong>
<ul>
<li data-marpit-fragment="6"><strong>現實</strong>：外包專案若缺乏技術管理、持續整合與嚴格架構監督，最終交付的系統往往是一場災難。</li>
</ul>
</li>
</ul>

<header>1.6 何謂軟體工程？</header>
<h2 id="%E8%A7%80%E5%BF%B5%E6%AA%A2%E9%A9%97%E5%B8%83%E9%AD%AF%E5%85%8B%E6%96%AF%E6%B3%95%E5%89%87-ccq-7">觀念檢驗：布魯克斯法則 (CCQ 7)</h2>
<div class="ccq-columns">
  <div class="ccq-text">
<p><strong>專案目前落後進度 3 週，距離預定上線日僅剩 2 週。專案經理決定緊急招募 4 名新工程師來加速開發。根據布魯克斯法則（Brooks's Law），最可能發生的結果為何？</strong></p>
<ul>
<li data-marpit-fragment="1">
<p><strong>A.</strong> 專案將會提早 1 週順利上線。</p>
</li>
<li data-marpit-fragment="2">
<p><strong>B.</strong> 專案將會面臨更嚴重的延遲，因為資深開發人員必須停下工作來培訓與協調新進人員。</p>
</li>
<li data-marpit-fragment="3">
<p><strong>C.</strong> 新進人員的加入對專案時程完全沒有任何影響。</p>
</div>
<div class="ccq-logo">
  <img src="../../img/ch01/question_icon.svg" alt="Question" />
</div>
</li>
</ul>

<header>1.7 現代工具鏈與 AI 雙面刃</header>

<h2 id="17-%E7%8F%BE%E4%BB%A3%E5%B7%A5%E7%A8%8B%E8%87%AA%E5%8B%95%E5%8C%96%E5%B7%A5%E5%85%B7%E9%8F%88">1.7 現代工程自動化工具鏈</h2>
<ul>
<li data-marpit-fragment="1"><strong>Version Control (Git)：</strong> 分支管理策略，協作程式碼審查。</li>
<li data-marpit-fragment="2"><strong>現代 IDE（如 VS Code）：</strong> 即時語法錯誤檢查、重構輔助與除錯環境。</li>
<li data-marpit-fragment="3"><strong>CI/CD 自動化管線：</strong> 自動編譯、單元測試、弱點掃描並容器化部置 (GitHub Actions)。</li>
<li data-marpit-fragment="4"><strong>自動化測試：</strong> 單元測試（JUnit、PyTest）、整合測試與 E2E 測試。</li>
<li data-marpit-fragment="5"><strong>可觀測性與 APM：</strong> OpenTelemetry 鏈路追蹤、日誌整合與 Sentry APM。</li>
<li data-marpit-fragment="6"><strong>容器化編排：</strong> 隔離應用依賴（Docker 容器）與伺服器叢集編排（Kubernetes）。</li>
<li data-marpit-fragment="7"><strong>專案追蹤管理：</strong> Scrum 看板、缺陷與功能待辦追蹤（Jira、Linear）。</li>
<li data-marpit-fragment="8"><strong>靜態代碼分析：</strong> 不執行代碼下，掃描原始碼中的潛在臭蟲與 code smell (SonarQube)。</li>
<li data-marpit-fragment="9"><strong>API 開發協作：</strong> API 設計、Mock、測試與共享規格（Postman）。</li>
<li data-marpit-fragment="10"><strong>基礎設施即代碼 (IaC)：</strong> 透過版本控制的設定檔宣告雲端資源 (Terraform)。</li>
</ul>

<p><strong>「Vibe Coding」的現場投票與討論：</strong></p>
<ul>
<li data-marpit-fragment="1"><strong>投票：</strong> 當你使用 AI 程式助理（如 Copilot 或 ChatGPT）時，你在按下 Commit 提交前，有多少比例會逐行閱讀並完全理解它所產生的每一行程式碼？<br />
<em>(每次都逐行看懂 / 大部分時候會看 / 很少看 / 從來不看)</em></li>

</ul>

<header>1.8 專業倫理、社會責任與黑暗模式</header>
<h2 id="18-acmieee-%E5%80%AB%E7%90%86%E5%AE%88%E5%89%87-8-%E5%A4%A7%E6%A0%B8%E5%BF%83%E5%8E%9F%E5%89%87">1.8 ACM/IEEE 倫理守則 8 大核心原則</h2>
<ol>
<li><strong>Public（公眾）：</strong> 以公眾利益為最高指導原則，優先保障安全、健康與福祉。</li>
<li><strong>Client &amp; Employer：</strong> 在符合公眾利益的前提下，維護客戶與雇主的利益。</li>
<li><strong>Product（產品）：</strong> 確保交付的產品符合專業最高可靠度與安全標準。</li>
<li><strong>Judgment（判斷）：</strong> 保持專業評估的獨立自主性，拒絕對不實技術宣稱簽署背書。</li>
<li><strong>Management（管理）：</strong> 推動合乎道德的管理，不給予不實估算或強加不合理壓縮。</li>
<li><strong>Profession（專業）：</strong> 藉由同儕審查與分享知識，維護軟體工程的誠信與聲譽。</li>
<li><strong>Colleagues（同事）：</strong> 待同事公平客氣，營造互助與正面建設性回饋的氛圍。</li>
<li><strong>Self（自身）：</strong> 終身學習，精進技術，落實道德的開發實踐。</li>
</ol>

<header>1.8 專業倫理、社會責任與黑暗模式</header>
<h2 id="18-uiux-%E4%B8%AD%E7%9A%84%E6%AC%BA%E9%A8%99%E6%80%A7%E9%BB%91%E6%9A%97%E6%A8%A1%E5%BC%8F">1.8 UI/UX 中的欺騙性「黑暗模式」</h2>
<ul>
<li data-marpit-fragment="1"><strong>1. 蟑螂屋 (Roach Motel)：</strong>
<ul>
<li data-marpit-fragment="2">訂閱只需一鍵完成；取消訂閱卻需要打電話給客服或在隱密選單迷宮中摸索。</li>
</ul>
</li>
<li data-marpit-fragment="3"><strong>2. 誘導式確認 (Confirmshaming)：</strong>
<ul>
<li data-marpit-fragment="4">在拒絕按鈕上加上帶有道德羞辱性或傀疚感的字眼（如*「不，謝謝，我討厭省錢」*）。</li>
</ul>
</li>
<li data-marpit-fragment="5"><strong>3. 悄悄塞入購物車 (Sneak into Basket)：</strong>
<ul>
<li data-marpit-fragment="6">在最後結帳點自動預先勾選加購險、加購商品，利用粗心誘導使用者付錢。</li>
</ul>
</li>
<li data-marpit-fragment="7"><strong>4. 虛假緊急 (Fake Urgency)：</strong>
<ul>
<li data-marpit-fragment="8">製造虛假的搶購人數（<em>「34 人正在看此房」</em>）或虛假的特價倒數計時器逼迫下單。</li>
</ul>
</li>
</ul>

<h2 id="%E8%A7%80%E5%BF%B5%E6%AA%A2%E9%A9%97%E5%B7%A5%E7%A8%8B%E5%80%AB%E7%90%86%E5%AE%88%E5%89%87-ccq-5---%E7%BA%8C">觀念檢驗：工程倫理守則 (CCQ 5 - 續)</h2>
<div class="ccq-columns">
  <div class="ccq-text">
<p>** under the ACM/IEEE Code of Ethics, if an employer directs an engineer to implement an algorithm that falsifies safety compliance reports, what is the engineer's obligation?**</p>
<ul>
<li data-marpit-fragment="1">
<p><strong>A.</strong> 順從雇主，因為雇主支付工程師的薪水。</p>

<li data-marpit-fragment="2">
<p><strong>B.</strong> 拒絕並向上陳報，因為公眾利益的優先權高於對雇主的忠誠。</p>
</li>
<li data-marpit-fragment="3">
<p><strong>C.</strong> 實作程式碼，但不要寫任何系統文件。</p>
</li>
<li data-marpit-fragment="4">
<p><strong>D.</strong> 將此程式碼外包給外部廠商開發以規避責任。</p>
</div>
<div class="ccq-logo">

</div>
</li>
</ul>

<h2 id="19-%E8%BB%9F%E9%AB%94%E5%B7%A5%E7%A8%8B%E5%B8%B8%E8%A6%8B%E5%95%8F%E7%AD%94-faq">1.9 軟體工程常見問答 (FAQ)</h2>
<ul>
<li data-marpit-fragment="1"><strong>Q1：寫程式與軟體工程有何不同？</strong>
<ul>
<li data-marpit-fragment="2"><em>回答：</em> 寫程式是撰寫原始碼。軟體工程是融入時間軸的程式開發，包含多人協作、在時間與預算等限制下折衷出「滿意解」、維護品質特徵與規畫長期演進。</li>
</ul>
</li>
<li data-marpit-fragment="3"><strong>Q2：為何程式正確且測試 coverage 100% 仍會失敗？</strong>
<ul>
<li data-marpit-fragment="4"><em>回答：</em> 軟體有四大支柱。資料出錯、維運程序出包、或文檔缺失皆會失敗。且若需求規格 (Specification) 階段錯誤，就只會「正確地蓋出沒人要的產品」。</li>
</ul>
</li>
<li data-marpit-fragment="5"><strong>Q3：滿意解 (Satisficing) 與最優解 (Optimized) 有何差別？</strong>
<ul>
<li data-marpit-fragment="6"><em>回答：</em> 受限於預算與時程约束，技術上完美的「最優解」往往不可行。工程的核心在於找出符合所有限制且「足夠好」的「滿意解」。</li>
</ul>
</li>
<li data-marpit-fragment="7"><strong>Q4：AI 的 Vibe Coding 風險與防範？</strong>
<ul>
<li data-marpit-fragment="8"><em>回答：</em> 憑感覺盲目使用 AI 程式碼會引入安全性漏洞。防範之道在於落實 Code Review、寫程式前先寫測試案例，並將 AI 代碼視為需專業工程審查的初稿。</li>
</ul>
</li>
</ul>
