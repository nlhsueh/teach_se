<header>Advanced Software Engineering | Syllabus (115-1)</header>
<h2 id="course-overview--philosophy">Course Overview &amp; Philosophy</h2>
<ul>
<li data-marpit-fragment="1"><strong>Bridging Theory, Modern Toolchains, and AI:</strong>
<ul>
<li data-marpit-fragment="2">Software Engineering is evolving rapidly from manual implementation to <strong>AI-assisted &amp; spec-driven engineering</strong>.</li>
<li data-marpit-fragment="3">This course balances <strong>classical engineering rigor</strong> (processes, architecture, quality assurance) with <strong>modern paradigms</strong> (generative AI, automated pipelines, empirical analysis).</li>
</ul>
</li>
<li data-marpit-fragment="4"><strong>Key Course Attributes:</strong>
<ul>
<li data-marpit-fragment="5"><strong>Target Audience:</strong> Graduate students and motivated senior undergraduates.</li>
<li data-marpit-fragment="6"><strong>Language of Instruction:</strong> English-friendly / bilingual materials.</li>
<li data-marpit-fragment="7"><strong>Interactive Pedagogy:</strong> Concept Check Questions (CCQ) with real-time polling, architectural critiques, and collaborative discussions.</li>
</ul>
</li>
</ul>
<footer>Prof. Nien-Lin Hsueh · Feng Chia University</footer>
</section>

<header>Advanced Software Engineering | Syllabus (115-1)</header>
<h2 id="course-learning-objectives-clos">Course Learning Objectives (CLOs)</h2>
<ul>
<li data-marpit-fragment="1"><strong>1. Master Core SE Disciplines:</strong>
<ul>
<li data-marpit-fragment="2">Deeply understand software lifecycles, requirement engineering, object-oriented modeling, and architectural styles.</li>
</ul>
</li>
<li data-marpit-fragment="3"><strong>2. Quality-First &amp; Empirical Mindset:</strong>
<ul>
<li data-marpit-fragment="4">Internalize testing methodologies (black-box, white-box), CI/CD automation, and empirical experimentation.</li>
</ul>
</li>
<li data-marpit-fragment="5"><strong>3. Responsible &amp; Rigorous AI Integration:</strong>
<ul>
<li data-marpit-fragment="6">Learn how to effectively steer AI coding agents, validate AI-generated code, and mitigate hallucinations and technical debt.</li>
</ul>
</li>
<li data-marpit-fragment="7"><strong>4. Scholarly &amp; Professional Communication:</strong>
<ul>
<li data-marpit-fragment="8">Deconstruct peer-reviewed SE literature, run conference-style panels, and deliver production-ready software engineering post-mortems.</li>
</ul>
</li>
</ul>
<footer>Prof. Nien-Lin Hsueh · Feng Chia University</footer>

<header>Advanced Software Engineering | Syllabus (115-1)</header>
<h2 id="curriculum-roadmap-five-core-modules">Curriculum Roadmap: Five Core Modules</h2>
<ul>
<li data-marpit-fragment="1"><strong>Module 1: Foundations (Weeks 1)</strong>
<ul>
<li data-marpit-fragment="2">From the 1968 Software Crisis to Software Engineering; From Software to Qualified Software.</li>
</ul>
</li>
<li data-marpit-fragment="3"><strong>Module 2: Processes &amp; Requirements (Weeks 2–4)</strong>
<ul>
<li data-marpit-fragment="4">Agile Methodologies, Scrum, DevOps, Spec-Driven AI workflows.</li>
<li data-marpit-fragment="5">Requirements Engineering (Functional/Non-Functional Specs, AI Spec)</li>
</ul>
</li>
<li data-marpit-fragment="6"><strong>Module 3: Software Design &amp; Modeling (Weeks 5–9)</strong>
<ul>
<li data-marpit-fragment="7">Design Principles &amp; Patterns, UML Modeling, Software Architectures.</li>
<li data-marpit-fragment="8">Mid-term exam.</li>
</ul>
</li>
<li data-marpit-fragment="9"><strong>Module 4: Quality Assurance &amp; Testing (Weeks 10–13)</strong>
<ul>
<li data-marpit-fragment="10">Testing Fundamentals &amp; Practices: Black-box testing, white-box testing, coverage criteria.</li>
<li data-marpit-fragment="11">Quality Assurance Model &amp; Process Improvement Model</li>
</ul>
</li>
<li data-marpit-fragment="12"><strong>Module 5: Empirical Software Engineering &amp; Capstone Execution (Weeks 14–16)</strong>
<ul>
<li data-marpit-fragment="13">Controlled experiments, final capstone demos and panel debates.</li>
</ul>
</li>
</ul>
<p><strong>Week 3 (09/28) &amp; Week 7 (10/26): National Holiday</strong></p>

<header>Advanced Software Engineering | Syllabus (115-1)</header>
<h2 id="final-capstone-project-three-flexible-tracks">Final Capstone Project: Three Flexible Tracks</h2>
<ul>
<li data-marpit-fragment="1"><strong>Team-Based Project:</strong> Performed by teams of <strong>~4 members</strong>.</li>
<li data-marpit-fragment="2"><strong>Presentation Duration:</strong> Time period = <strong>25 min × number of members</strong> (e.g., ~100 min for 4 members).</li>
<li data-marpit-fragment="3"><strong>Track 1: Academic Paper Panel Discussion</strong>
<ul>
<li data-marpit-fragment="4">Conducted in a <strong>panel discussion style</strong> to present peer-reviewed papers (<em>ICSE, FSE, ASE, TSE, TOSEM</em>).</li>
<li data-marpit-fragment="5">The team acts as panelists (~4 persons) deconstructing papers, synthesizing trade-offs, and running Q&amp;A.</li>
</ul>
</li>
<li data-marpit-fragment="6"><strong>Track 2: Software System Prototype &amp; SE Post-Mortem</strong>
<ul>
<li data-marpit-fragment="7">Live demo + in-depth SE post-mortem focusing on a <strong>thin vertical slice</strong>.</li>
<li data-marpit-fragment="8">Architectural separation, AI-assisted workflow logs, CI/CD pipeline, and automated tests.</li>
</ul>
</li>
<li data-marpit-fragment="9"><strong>Track 3: Empirical Software Engineering Experiment</strong>
<ul>

<h2 id="track-1-academic-paper-panel--illustrative-themes">Track 1: Academic Paper Panel — Illustrative Themes</h2>
<ul>
<li data-marpit-fragment="1"><strong>Theme Example A: &quot;Security &amp; Trust in Generative AI Code Assistants&quot;</strong>
<ul>
<li data-marpit-fragment="2"><strong>Panelist 1 (<em>ICSE</em>):</strong> Prevalence and taxonomy of CWE security flaws in Copilot-generated code.</li>
<li data-marpit-fragment="3"><strong>Panelist 2 (<em>FSE</em>):</strong> Automated hallucination detection and differential testing for LLM unit tests.</li>
<li data-marpit-fragment="4"><strong>Panelist 3 (<em>ASE</em>):</strong> Developer over-reliance and cognitive bias during AI-assisted code reviews.</li>
<li data-marpit-fragment="5"><strong>Panelist 4 (<em>TOSEM</em>):</strong> Code licensing contamination and privacy leakages in training corpuses.</li>
<li data-marpit-fragment="6"><strong>Moderator Synthesis:</strong> Guiding the debate on enterprise AI governance and developer accountability.</li>
</ul>
</li>
<li data-marpit-fragment="7"><strong>Theme Example B: &quot;Microservices Resilience &amp; Modern DevOps Automation&quot;</strong>
<ul>
<li data-marpit-fragment="8"><strong>Panelists 1 &amp; 2 (<em>ICSE/FSE</em>):</strong> Automated fault injection, Chaos Engineering, and flaky test mitigation.</li>
<li data-marpit-fragment="9"><strong>Panelists 3 &amp; 4 (<em>ASE/TSE</em>):</strong> Machine learning for CI/CD test selection and architectural debt prediction.</li>
<li data-marpit-fragment="10"><strong>Moderator Synthesis:</strong> Balancing rapid continuous deployment velocity against architectural stability.</li>
</ul>
</li>
</ul>
<footer>Prof. Nien-Lin Hsueh · Feng Chia University</footer>

<h2 id="academic-integrity--generative-ai-policy">Academic Integrity &amp; Generative AI Policy</h2>
<ul>
<li data-marpit-fragment="1"><strong>Generative AI is Welcomed, but Must Be Steered Responsibly:</strong>
<ul>
<li data-marpit-fragment="2">You are encouraged to use AI tools (e.g., Claude, ChatGPT, GitHub Copilot, Cursor).</li>
<li data-marpit-fragment="3"><strong>Rule of Transparency:</strong> Document where and how AI was utilized (prompts, edits, test generation).</li>
</ul>
</li>
<li data-marpit-fragment="4"><strong>The &quot;Accountability&quot; Rule:</strong>
<ul>
<li data-marpit-fragment="5"><strong>You are 100% responsible</strong> for the correctness, security, and architectural integrity of your submissions. Blindly accepting hallucinated code or fabricated paper citations results in severe penalties.</li>
</ul>
</li>
<li data-marpit-fragment="6"><strong>Plagiarism &amp; Authorship:</strong>
<ul>
<li data-marpit-fragment="7">Uncredited copying of text, diagrams, or code from external repositories or human authors is strictly prohibited.</li>
</ul>
</li>
</ul>
<footer>Prof. Nien-Lin Hsueh · Feng Chia University</footer>
