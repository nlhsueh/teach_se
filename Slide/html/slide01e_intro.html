<ul>
<li data-marpit-fragment="5">Software projects grew rapidly in scale and complexity.</li>
<li data-marpit-fragment="6">Inherent difficulties led to project failures, budget overruns, and late deliveries.</li>
</ul>

<header>The Software Crisis</header>
<h2 id="software-failures-the-patriot-missile-1991">Software Failures: The Patriot Missile (1991)</h2>
<ul>
<li data-marpit-fragment="1"><strong>Fatal Defect: Millisecond-level Accumulation Error</strong>
<ul>
<li data-marpit-fragment="2">Patriot system clock used 24-bit floating-point registers, causing a tiny truncation error (0.000000095s per 0.1s tick).</li>
<li data-marpit-fragment="3">System operated continuously for over 100 hours without a reboot.</li>
</ul>
</li>
<li data-marpit-fragment="4"><strong>Consequence &amp; Result:</strong>
<ul>
<li data-marpit-fragment="5">Truncation error accumulated to <strong>0.33 seconds</strong>.</li>
<li data-marpit-fragment="6">At Mach 4.2 (Scud missile speed), 0.33s corresponds to a <strong>600-meter deviation</strong>.</li>
<li data-marpit-fragment="7">Radar failed to track Scud missile; hit US barracks, killing 28 soldiers.</li>
</ul>
</li>
<li data-marpit-fragment="8"><strong>QA Lesson:</strong> Importance of long-term stress &amp; reliability testing.</li>
</ul>
<footer>Software Engineering | Chapter 1: Introduction</footer>

<h2 id="software-failures-mars-climate-orbiter-1998">Software Failures: Mars Climate Orbiter (1998)</h2>
<div class="split55">
  <div class="left">
<ul>
<li data-marpit-fragment="1"><strong>Fatal Defect: Interface Contract Breakdown</strong>
<ul>
<li data-marpit-fragment="2">Ground control software (Lockheed Martin) output thrust impulse in <strong>Imperial units</strong> (pound-force seconds, <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.464ex;" xmlns="http://www.w3.org/2000/svg" width="5.585ex" height="2.059ex" role="img" focusable="false" viewBox="0 -705 2468.4 910"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D459" d="M117 59Q117 26 142 26Q179 26 205 131Q211 151 215 152Q217 153 225 153H229Q238 153 241 153T246 151T248 144Q247 138 245 128T234 90T214 43T183 6T137 -11Q101 -11 70 11T38 85Q38 97 39 102L104 360Q167 615 167 623Q167 626 166 628T162 632T157 634T149 635T141 636T132 637T122 637Q112 637 109 637T101 638T95 641T94 647Q94 649 96 661Q101 680 107 682T179 688Q194 689 213 690T243 693T254 694Q266 694 266 686Q266 675 193 386T118 83Q118 81 118 75T117 65V59Z"></path></g><g data-mml-node="mi" transform="translate(298,0)"><path data-c="1D44F" d="M73 647Q73 657 77 670T89 683Q90 683 161 688T234 694Q246 694 246 685T212 542Q204 508 195 472T180 418L176 399Q176 396 182 402Q231 442 283 442Q345 442 383 396T422 280Q422 169 343 79T173 -11Q123 -11 82 27T40 150V159Q40 180 48 217T97 414Q147 611 147 623T109 637Q104 637 101 637H96Q86 637 83 637T76 640T73 647ZM336 325V331Q336 405 275 405Q258 405 240 397T207 376T181 352T163 330L157 322L136 236Q114 150 114 114Q114 66 138 42Q154 26 178 26Q211 26 245 58Q270 81 285 114T318 219Q336 291 336 325Z"></path></g><g data-mml-node="mi" transform="translate(727,0)"><path data-c="1D453" d="M118 -162Q120 -162 124 -164T135 -167T147 -168Q160 -168 171 -155T187 -126Q197 -99 221 27T267 267T289 382V385H242Q195 385 192 387Q188 390 188 397L195 425Q197 430 203 430T250 431Q298 431 298 432Q298 434 307 482T319 540Q356 705 465 705Q502 703 526 683T550 630Q550 594 529 578T487 561Q443 561 443 603Q443 622 454 636T478 657L487 662Q471 668 457 668Q445 668 434 658T419 630Q412 601 403 552T387 469T380 433Q380 431 435 431Q480 431 487 430T498 424Q499 420 496 407T491 391Q489 386 482 386T428 385H372L349 263Q301 15 282 -47Q255 -132 212 -173Q175 -205 139 -205Q107 -205 81 -186T55 -132Q55 -95 76 -78T118 -61Q162 -61 162 -103Q162 -122 151 -136T127 -157L118 -162Z"></path></g><g data-mml-node="mo" transform="translate(1499.2,0)"><path data-c="22C5" d="M78 250Q78 274 95 292T138 310Q162 310 180 294T199 251Q199 226 182 208T139 190T96 207T78 250Z"></path></g><g data-mml-node="mi" transform="translate(1999.4,0)"><path data-c="1D460" d="M131 289Q131 321 147 354T203 415T300 442Q362 442 390 415T419 355Q419 323 402 308T364 292Q351 292 340 300T328 326Q328 342 337 354T354 372T367 378Q368 378 368 379Q368 382 361 388T336 399T297 405Q249 405 227 379T204 326Q204 301 223 291T278 274T330 259Q396 230 396 163Q396 135 385 107T352 51T289 7T195 -10Q118 -10 86 19T53 87Q53 126 74 143T118 160Q133 160 146 151T160 120Q160 94 142 76T111 58Q109 57 108 57T107 55Q108 52 115 47T146 34T201 27Q237 27 263 38T301 66T318 97T323 122Q323 150 302 164T254 181T195 196T148 231Q131 256 131 289Z"></path></g></g></g></svg></mjx-container>).</li>
<li data-marpit-fragment="3">Onboard navigation software (NASA JPL) expected <strong>Metric units</strong> (Newton-seconds, <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.023ex;" xmlns="http://www.w3.org/2000/svg" width="4.705ex" height="1.568ex" role="img" focusable="false" viewBox="0 -683 2079.4 693"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D441" d="M234 637Q231 637 226 637Q201 637 196 638T191 649Q191 676 202 682Q204 683 299 683Q376 683 387 683T401 677Q612 181 616 168L670 381Q723 592 723 606Q723 633 659 637Q635 637 635 648Q635 650 637 660Q641 676 643 679T653 683Q656 683 684 682T767 680Q817 680 843 681T873 682Q888 682 888 672Q888 650 880 642Q878 637 858 637Q787 633 769 597L620 7Q618 0 599 0Q585 0 582 2Q579 5 453 305L326 604L261 344Q196 88 196 79Q201 46 268 46H278Q284 41 284 38T282 19Q278 6 272 0H259Q228 2 151 2Q123 2 100 2T63 2T46 1Q31 1 31 10Q31 14 34 26T39 40Q41 46 62 46Q130 49 150 85Q154 91 221 362L289 634Q287 635 234 637Z"></path></g><g data-mml-node="mo" transform="translate(1110.2,0)"><path data-c="22C5" d="M78 250Q78 274 95 292T138 310Q162 310 180 294T199 251Q199 226 182 208T139 190T96 207T78 250Z"></path></g><g data-mml-node="mi" transform="translate(1610.4,0)"><path data-c="1D460" d="M131 289Q131 321 147 354T203 415T300 442Q362 442 390 415T419 355Q419 323 402 308T364 292Q351 292 340 300T328 326Q328 342 337 354T354 372T367 378Q368 378 368 379Q368 382 361 388T336 399T297 405Q249 405 227 379T204 326Q204 301 223 291T278 274T330 259Q396 230 396 163Q396 135 385 107T352 51T289 7T195 -10Q118 -10 86 19T53 87Q53 126 74 143T118 160Q133 160 146 151T160 120Q160 94 142 76T111 58Q109 57 108 57T107 55Q108 52 115 47T146 34T201 27Q237 27 263 38T301 66T318 97T323 122Q323 150 302 164T254 181T195 196T148 231Q131 256 131 289Z"></path></g></g></g></svg></mjx-container>).</li>
</ul>
</li>
<li data-marpit-fragment="4"><strong>Consequence &amp; Result:</strong>
<ul>
<li data-marpit-fragment="5"><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.05ex;" xmlns="http://www.w3.org/2000/svg" width="5.783ex" height="1.581ex" role="img" focusable="false" viewBox="0 -677 2556 699"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mn"><path data-c="34" d="M462 0Q444 3 333 3Q217 3 199 0H190V46H221Q241 46 248 46T265 48T279 53T286 61Q287 63 287 115V165H28V211L179 442Q332 674 334 675Q336 677 355 677H373L379 671V211H471V165H379V114Q379 73 379 66T385 54Q393 47 442 46H471V0H462ZM293 211V545L74 212L183 211H293Z"></path><path data-c="2E" d="M78 60Q78 84 95 102T138 120Q162 120 180 104T199 61Q199 36 182 18T139 0T96 17T78 60Z" transform="translate(500,0)"></path><path data-c="34" d="M462 0Q444 3 333 3Q217 3 199 0H190V46H221Q241 46 248 46T265 48T279 53T286 61Q287 63 287 115V165H28V211L179 442Q332 674 334 675Q336 677 355 677H373L379 671V211H471V165H379V114Q379 73 379 66T385 54Q393 47 442 46H471V0H462ZM293 211V545L74 212L183 211H293Z" transform="translate(778,0)"></path><path data-c="35" d="M164 157Q164 133 148 117T109 101H102Q148 22 224 22Q294 22 326 82Q345 115 345 210Q345 313 318 349Q292 382 260 382H254Q176 382 136 314Q132 307 129 306T114 304Q97 304 95 310Q93 314 93 485V614Q93 664 98 664Q100 666 102 666Q103 666 123 658T178 642T253 634Q324 634 389 662Q397 666 402 666Q410 666 410 648V635Q328 538 205 538Q174 538 149 544L139 546V374Q158 388 169 396T205 412T256 420Q337 420 393 355T449 201Q449 109 385 44T229 -22Q148 -22 99 32T50 154Q50 178 61 192T84 210T107 214Q132 214 148 197T164 157Z" transform="translate(1278,0)"></path></g><g data-mml-node="mo" transform="translate(1778,0)"><path data-c="D7" d="M630 29Q630 9 609 9Q604 9 587 25T493 118L389 222L284 117Q178 13 175 11Q171 9 168 9Q160 9 154 15T147 29Q147 36 161 51T255 146L359 250L255 354Q174 435 161 449T147 471Q147 480 153 485T168 490Q173 490 175 489Q178 487 284 383L389 278L493 382Q570 459 587 475T609 491Q630 491 630 471Q630 464 620 453T522 355L418 250L522 145Q606 61 618 48T630 29Z"></path></g></g></g></svg></mjx-container> thrust calculation mismatch.</li>
<li data-marpit-fragment="6">Spacecraft entered orbit at 57km instead of 140km, disintegrating in Mars' atmosphere ($125M lost).</li>
</ul>
</li>
<li data-marpit-fragment="7"><strong>QA Lesson:</strong> Interface contract validation and automated unit-checks.</li>
</ul>

<header>The Software Crisis</header>
<h2 id="software-failures-nagoya-air-crash-1994">Software Failures: Nagoya Air Crash (1994)</h2>
<div class="split55">
  <div class="left">
<ul>
<li data-marpit-fragment="1"><strong>Fatal Defect: HMI Mode Confusion &amp; Autopilot Fight</strong>
<ul>
<li data-marpit-fragment="2">Co-pilot accidentally triggered &quot;Go-Around&quot; mode.</li>
<li data-marpit-fragment="3">Autopilot tried to climb by adjusting horizontal stabilizer, while pilots manually pushed nose down to land.</li>
</ul>
</li>
<li data-marpit-fragment="4"><strong>Consequence &amp; Result:</strong>
<ul>
<li data-marpit-fragment="5">Autopilot and pilots fought for control.</li>
<li data-marpit-fragment="6">Horizontal stabilizer reached extreme angle, causing aerodynamic stall and crash (264 fatalities).</li>
</ul>
</li>
<li data-marpit-fragment="7"><strong>QA Lesson:</strong> Human-Machine Interface (HMI) state clarity and control authority arbitration.</li>
</ul>
  </div>
  <div class="right">
    <img src="../../img/ch01/nagoya_air_crash_hmi_conflict.jpg" alt="Nagoya Air Crash HMI Conflict" />
  </div>
</div>

<header>The Software Crisis</header>
<h2 id="software-failures-the-lion-king-pc-game-1994">Software Failures: The Lion King PC Game (1994)</h2>
<ul>
<li data-marpit-fragment="1"><strong>Fatal Defect: Lack of Compatibility Testing</strong>
<ul>
<li data-marpit-fragment="2">Disney released <em>The Lion King</em> game for Christmas 1994.</li>
<li data-marpit-fragment="3">Game was developed on a specific video driver (WinG) but was not tested on the wide variety of consumer PC hardware.</li>
</ul>
</li>
<li data-marpit-fragment="4"><strong>Consequence &amp; Result:</strong>
<ul>
<li data-marpit-fragment="5">Thousands of home PCs crashed into blue screens on Christmas Day.</li>
<li data-marpit-fragment="6">Customer support was overwhelmed, causing a massive PR disaster.</li>
</ul>
</li>
<li data-marpit-fragment="7"><strong>QA Lesson:</strong> Necessity of compatibility and environment diversity testing (which prompted Microsoft to build DirectX).</li>
</ul>
<footer>Software Engineering | Chapter 1: Introduction</footer>
</section>

<header>The Software Crisis</header>
<h2 id="why-early-se-struggled--the-need-for-agile">Why Early SE Struggled &amp; The Need for Agile</h2>
<ul>
<li data-marpit-fragment="1">
<p><strong>Difficulties of Early Plan-Driven SE:</strong></p>
<ul>
<li data-marpit-fragment="2"><strong>Manufacturing Analogy Mismatch:</strong> Software was treated like civil engineering (e.g. building bridges). It assumed requirements are fixed and predictable.</li>
<li data-marpit-fragment="3"><strong>Rigid Sequential Phases:</strong> Testing and integration happened at the very end. Design flaws or bugs were discovered too late, leading to high cost of change.</li>
<li data-marpit-fragment="4"><strong>Low Visibility:</strong> Customers only saw working software at the end of the project lifecycle.</li>
</ul>

<header>The Software Crisis</header>
<h2 id="software-engineering-in-the-2000s">Software Engineering in the 2000s</h2>
<ul>
<li data-marpit-fragment="1"><strong>The Agile Revolution:</strong>
<ul>
<li data-marpit-fragment="2">Emphasizes flexibility, active team collaboration, and customer involvement.</li>
<li data-marpit-fragment="3">Promotes iterative development and responding to change over following rigid plans.</li>
</ul>
</li>
<li data-marpit-fragment="4"><strong>Open Source Software (OSS) &amp; Git:</strong>
<ul>
<li data-marpit-fragment="5">The maturity of open-source frameworks (e.g. Spring, Rails) dramatically accelerated development.</li>
<li data-marpit-fragment="6">Git (2005) and platform ecosystems (GitHub, 2008) democratized global code collaboration and sharing.</li>
</ul>
</li>
<li data-marpit-fragment="7"><strong>Web 2.0 &amp; SaaS Era:</strong>
<ul>
<li data-marpit-fragment="8">Transitioned software delivery from physical media (CDs) to cloud-based Web Applications.</li>
<li data-marpit-fragment="9">Laid the groundwork for Continuous Integration (CI) and modern DevOps practices.</li>
</ul>
</li>
</ul>

<header>The Software Crisis</header>
<h2 id="industry-40-ai--cyber-physical-systems">Industry 4.0: AI &amp; Cyber-Physical Systems</h2>
<ul>
<li data-marpit-fragment="1"><strong>AI-Powered Software Engineering:</strong>
<ul>
<li data-marpit-fragment="2"><strong>LLMs (2022) Emerged:</strong> The launch of ChatGPT catalyzed LLM integration, driving the shift to prompt-based coding.</li>
<li data-marpit-fragment="3">Automates boilerplate generation, reviews code quality, and provides intelligent debugging insights.</li>
<li data-marpit-fragment="4">Shifts developer focus from writing low-level syntax to system design, prompt engineering, and architectural orchestration.</li>
</ul>
</li>
<li data-marpit-fragment="5"><strong>Cyber-Physical Systems (Robotics &amp; IoT):</strong>
<ul>
<li data-marpit-fragment="6">Software acts as the nervous system connecting advanced sensors, hardware robots, and smart factories.</li>
<li data-marpit-fragment="7">Requires real-time computing, edge deployments, and high safety-critical engineering standards.</li>
</ul>
</li>
</ul>
<footer>Software Engineering | Chapter 1: Introduction</footer>

<header>The Software Crisis</header>
<h2 id="why-we-cant-avoid-software-failure">Why We Can't Avoid Software Failure?</h2>
<h3 id="root-causes">Root Causes</h3>
<ul>
<li data-marpit-fragment="1"><strong>Complexity of Software:</strong> Software systems are highly complex, invisible, and non-linear.</li>
<li data-marpit-fragment="2"><strong>Inadequate Methods:</strong> The development methodologies applied fail to scale with complexity.</li>
</ul>
<h3 id="key-goals-of-software-engineering">Key Goals of Software Engineering</h3>
<ul>
<li data-marpit-fragment="3"><strong>Improve Quality</strong> of the software.</li>
<li data-marpit-fragment="4"><strong>Increase Productivity</strong> of developers.</li>
<li data-marpit-fragment="5"><strong>Reduce Development Effort</strong> (lower costs).</li>
<li data-marpit-fragment="6"><strong>Reduce Cycle Time</strong> (faster time to market).</li>
</ul>

<header>Software Definition &amp; Quality</header>

<h2 id="what-is-software">What is Software?</h2>
<blockquote>
<p><strong>IEEE Definition:</strong><br />
Computer <strong>programs</strong>, <strong>procedures</strong>, and possibly associated <strong>documentation</strong> and <strong>data</strong> pertaining to the operation of a computer system.</p>
</blockquote>
<ul>
<li data-marpit-fragment="1"><strong>Beyond Code:</strong> Includes procedures, data, and documentation. Many system failures (e.g., flight incidents) stem from operational/procedural issues.</li>
</ul>
<blockquote>

<header>Software Definition &amp; Quality</header>
<h2 id="software-quality-12">Software Quality (1/2)</h2>
<p>What makes a software system &quot;good&quot;? Consider these definitions:</p>
<ol>
<li>
<p><strong>Conformance to Requirements (Crosby, 1979):</strong></p>
<blockquote>
<p>The degree to which a system, component, or process meets specified requirements.</p>
</blockquote>
<ul>
<li data-marpit-fragment="1"><em>Critique:</em> Requirements are often incomplete. A system meeting the spec might still fail to satisfy the user.</li>
</ul>
</li>
<li>
<p><strong>Fit for Purpose (Juran, 1998):</strong></p>
<blockquote>
<p>The degree to which a system, component, or process meets customer or user needs or expectations.</p>
</blockquote>
<ul>
<li data-marpit-fragment="2"><em>Critique:</em> Is user expectation alone enough? What about non-functional qualities like maintainability?</li>
</ul>
</li>
</ol>
<footer>Software Engineering | Chapter 1: Introduction</footer>
</section>

<h2 id="software-quality-22">Software Quality (2/2)</h2>
<ol start="3">
<li><strong>Professional Standards (Pressman):</strong>
<blockquote>
<p>Conformance to explicitly stated functional and performance requirements, explicitly documented development standards, and implicit characteristics expected of all professionally developed software.</p>

</li>

<ul>
<li data-marpit-fragment="1"><strong>Insight:</strong> Testing skills can be acquired quickly, but building a <strong>quality culture</strong> takes time.</li>
<li data-marpit-fragment="2">Quality Model: <strong>ISO 9126</strong> (Functionality, Reliability, Usability, Efficiency, Maintainability, Portability).</li>
</ul>

<header>Software Definition &amp; Quality</header>
<h2 id="types-of-software-applications-22">Types of Software Applications (2/2)</h2>
<ol start="6">
<li><strong>Game Development:</strong> Console, PC, and mobile games.</li>
<li><strong>AI &amp; Machine Learning:</strong> Virtual assistants (Siri, Alexa), recommendation engines (Netflix), chatbots.</li>
<li><strong>Data Analytics &amp; BI:</strong> Power BI, Tableau, Hadoop, Spark, R.</li>
<li><strong>Cloud-based Applications:</strong> Cloud storage (Google Drive), VM infra (AWS, Azure), databases (Firebase).</li>
<li><strong>Scientific &amp; Engineering:</strong> CAD (AutoCAD), simulation tools (MATLAB).</li>
</ol>

<h2 id="general-issues-affecting-software-12">General Issues Affecting Software (1/2)</h2>
<ul>
<li data-marpit-fragment="1"><strong>Heterogeneity:</strong> Software must run across diverse, distributed networks and hardware environments.</li>
<li data-marpit-fragment="2"><strong>Business &amp; Social Change:</strong> Businesses need rapid development to keep up with changing markets.</li>
<li data-marpit-fragment="3"><strong>Security &amp; Trust:</strong> We must ensure systems are secure against malicious attacks and trustworthy.</li>
<li data-marpit-fragment="4"><strong>Scale:</strong> Software must scale from tiny embedded sensors to massive cloud infrastructures.</li>
</ul>

<header>What is Software Engineering?</header>
<h2 id="what-is-engineering">What is Engineering?</h2>
<blockquote>
<p><strong>Engineering</strong> is the application of scientific, economic, and practical knowledge to design and build structures, machines, devices, and systems.</p>
</blockquote>
<ul>
<li data-marpit-fragment="1"><strong>What is Engineering:</strong>
<ul>
<li data-marpit-fragment="2">Applying rigorous science &amp; math to solve practical problems.</li>
<li data-marpit-fragment="3">Designing under constraints (budget, safety, materials).</li>
</ul>
</li>
<li data-marpit-fragment="4"><strong>What is NOT Engineering:</strong>
<ul>
<li data-marpit-fragment="5"><strong>Pure Science:</strong> Discovery of knowledge without building systems.</li>
<li data-marpit-fragment="6"><strong>Ad-hoc Crafting / Art:</strong> Building by intuition without systematic methods, planning, or safety margins.</li>
</ul>
</li>
</ul>

<header>What is Software Engineering?</header>
<h2 id="what-is-software-engineering">What is Software Engineering?</h2>
<ul>
<li data-marpit-fragment="1"><strong>SE is a branch of Engineering:</strong>
<ul>
<li data-marpit-fragment="2">Just as civil engineering applies physics to build bridges, software engineering applies computer science and mathematical logic to build software systems.</li>
<li data-marpit-fragment="3">It shares the same engineering core: systematic planning, quantitative measurement, risk management, and rigorous quality assurance.</li>
</ul>
</li>
<li data-marpit-fragment="4"><strong>An Engineering Discipline:</strong>
<ul>
<li data-marpit-fragment="5">Concerned with all aspects of software production from early specification to post-deployment maintenance.</li>
</ul>
</li>
<li data-marpit-fragment="6"><strong>Systematic and Organized:</strong>
<ul>
<li data-marpit-fragment="7">Follows a structured, methodical process to minimize errors, optimize collaboration, and deliver on time/budget.</li>
</ul>
</li>
<li data-marpit-fragment="8"><strong>Pragmatic Choices:</strong>
<ul>
<li data-marpit-fragment="9">Uses appropriate tools and techniques depending on the problem, constraints, and resources available.</li>
</ul>
</li>
</ul>
<footer>Software Engineering | Chapter 1: Introduction</footer>

<header>What is Software Engineering?</header>
<h2 id="se-approaches-and-activities">SE Approaches and Activities</h2>
<h3 id="core-development-models">Core Development Models</h3>
<ul>
<li data-marpit-fragment="1"><strong>Waterfall model:</strong> Sequential and plan-driven.</li>
<li data-marpit-fragment="2"><strong>Spiral model:</strong> Risk-driven iterative model.</li>
<li data-marpit-fragment="3"><strong>Agile methods:</strong> Incremental and collaborative.</li>
</ul>
<h3 id="fundamental-activities">Fundamental Activities</h3>
<ul>
<li data-marpit-fragment="4"><strong>Specification:</strong> Defining functions and constraints.</li>
<li data-marpit-fragment="5"><strong>Development:</strong> Designing and programming.</li>
<li data-marpit-fragment="6"><strong>Validation:</strong> Checking against customer needs.</li>
<li data-marpit-fragment="7"><strong>Evolution:</strong> Modifying for changing markets.</li>
</ul>

<header>What is Software Engineering?</header>
<h2 id="the-discipline-of-software-engineering">The Discipline of Software Engineering</h2>
<div class="split64">
  <div class="left">
<p>Professional engineering requires <strong>discipline</strong>:</p>
<ul>
<li data-marpit-fragment="1">Write comments and document code.</li>
<li data-marpit-fragment="2">Specify requirements before design; design before implementation.</li>
<li data-marpit-fragment="3">Manage requirement changes systematically.</li>
<li data-marpit-fragment="4">Design with interfaces, not concrete implementations.</li>
<li data-marpit-fragment="5">Estimate efforts before developing.</li>
<li data-marpit-fragment="6">Manage risks and record design rationales.</li>
</ul>

<header>What is Software Engineering?</header>
<h2 id="se-myths-and-principles">SE Myths and Principles</h2>
<h3 id="common-myths">Common Myths</h3>
<ul>
<li data-marpit-fragment="1"><em>Myth 1:</em> If we fall behind schedule, we can just add more programmers to catch up.</li>
<li data-marpit-fragment="2"><em>Myth 2:</em> Software is easy to change.</li>
<li data-marpit-fragment="3"><em>Myth 3:</em> If we outsource the project, we can just sit back and relax.</li>
</ul>
<h3 id="core-principles">Core Principles</h3>
<ul>
<li data-marpit-fragment="4"><strong>Open-Closed Principle (OCP):</strong> Open for extension, closed for modification.</li>
<li data-marpit-fragment="5"><strong>Anticipation of Change:</strong> Design for future flexibility.</li>
<li data-marpit-fragment="6"><strong>KISS Principle:</strong> Keep It Simple, Stupid.</li>
<li data-marpit-fragment="7"><strong>Continuous Validation:</strong> Perform early and frequent testing.</li>
</ul>

<header>What is Software Engineering?</header>
<h2 id="nielsens-10-usability-heuristics">Nielsen's 10 Usability Heuristics</h2>
<ol>
<li><strong>Visibility of system status</strong></li>

<h2 id="software-engineering-tools-12">Software Engineering Tools (1/2)</h2>
<ul>
<li data-marpit-fragment="1"><strong>Version Control:</strong> Git, SVN (tracks history, enables collaboration).</li>
<li data-marpit-fragment="2"><strong>IDEs:</strong> IntelliJ, VS Code (rich environments for writing/debugging).</li>
<li data-marpit-fragment="3"><strong>Agile Management:</strong> Scrum, Kanban (Jira, Trello for tasks &amp; sprint cycles).</li>
<li data-marpit-fragment="4"><strong>Automated Testing:</strong> JUnit, Jest, Selenium (ensures correctness early).</li>
<li data-marpit-fragment="5"><strong>CI/CD:</strong> Jenkins, GitHub Actions (automates build, test, and release).</li>
<li data-marpit-fragment="6"><strong>Architecture &amp; Design:</strong> Lucidchart, UML tools (models architectures &amp; design patterns).</li>
</ul>

<header>Ethics &amp; Case Studies</header>

<h2 id="acmieee-code-of-ethics">ACM/IEEE Code of Ethics</h2>
<p>ACM/IEEE outline 6 primary ethical pillars for software engineers:</p>
<ol>
<li><strong>Public:</strong> Act consistently with the public interest (safety, health, welfare).</li>
<li><strong>Client and Employer:</strong> Act in the best interests of clients and employers.</li>
<li><strong>Product:</strong> Ensure products meet high professional standards.</li>
<li><strong>Judgment:</strong> Maintain integrity and independence in judgment.</li>
<li><strong>Management:</strong> Promote ethical management practices.</li>
<li><strong>Profession:</strong> Advance the integrity and reputation of the profession.</li>
</ol>
<footer>Software Engineering | Chapter 1: Introduction</footer>
