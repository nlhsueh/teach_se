<svg viewBox="0 0 400 300" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Card -->
  <rect width="400" height="300" rx="12" fill="#ffffff" stroke="none"/>
  
  <!-- Left Side: Traditional Plan-Driven -->
  <g transform="translate(10, 0)">
    <!-- Original Target Path -->
    <path d="M 40,240 L 140,140" stroke="#b0bec5" stroke-width="3" stroke-dasharray="5,5" fill="none" />
    <!-- Mismatch Path -->
    <path d="M 40,240 L 140,140" stroke="#d9534f" stroke-width="4" fill="none" marker-end="url(#arrow-red)" />
    
    <!-- Shifted Target -->
    <circle cx="140" cy="140" r="12" fill="none" stroke="#d9534f" stroke-width="3" />
    <circle cx="140" cy="140" r="4" fill="#d9534f" />
    <text x="140" y="115" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold" fill="#d9534f" text-anchor="middle">Planned Target</text>
    
    <!-- Moving Target Indicator -->
    <path d="M 140,140 L 140,70" stroke="#78909c" stroke-width="2" stroke-dasharray="3,3" fill="none" />
    <circle cx="140" cy="70" r="12" fill="none" stroke="#328cc1" stroke-width="3" />
    <circle cx="140" cy="70" r="4" fill="#328cc1" />
    <text x="140" y="50" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold" fill="#328cc1" text-anchor="middle">Actual Target</text>
    
    <!-- Mismatch Error -->
    <text x="90" y="200" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#777" transform="rotate(-45 90 200)">Rigid Execution</text>
    <!-- Cross -->
    <path d="M 130,130 L 150,150 M 150,130 L 130,150" stroke="#d9534f" stroke-width="3" />
    <text x="90" y="270" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" fill="#0b3c5d" text-anchor="middle">Plan-Driven (Waterfall)</text>
  </g>
  
  <!-- Right Side: Agile Iterative -->
  <g transform="translate(210, 0)">
    <!-- Actual Target -->
    <circle cx="140" cy="70" r="12" fill="none" stroke="#328cc1" stroke-width="3" />
    <circle cx="140" cy="70" r="4" fill="#328cc1" />
    <text x="140" y="50" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold" fill="#328cc1" text-anchor="middle">Actual Target</text>
    
    <!-- Spiral Loop Path to Shifted Target -->
    <path d="M 40,240 C 60,200 90,210 80,180 C 70,150 110,140 110,110 C 110,80 130,80 140,70" stroke="#5cb85c" stroke-width="4" fill="none" marker-end="url(#arrow-green)" />
    
    <!-- Iteration Loops Annotations -->
    <circle cx="65" cy="200" r="8" fill="#5cb85c" />
    <text x="65" y="203" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="white" font-weight="bold" text-anchor="middle">1</text>
    
    <circle cx="95" cy="140" r="8" fill="#5cb85c" />
    <text x="95" y="143" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="white" font-weight="bold" text-anchor="middle">2</text>
    
    <circle cx="125" cy="85" r="8" fill="#5cb85c" />
    <text x="125" y="88" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="white" font-weight="bold" text-anchor="middle">3</text>
    
    <!-- Success Hit Indicator: Checkmark -->
    <path d="M 130,70 L 137,77 L 150,64" stroke="#5cb85c" stroke-width="3" fill="none" />
    
    <text x="90" y="270" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" fill="#0b3c5d" text-anchor="middle">Agile (Iterative)</text>
  </g>
  
  <!-- Marker Definitions -->
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d9534f" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5cb85c" />
    </marker>
  </defs>
</svg>
