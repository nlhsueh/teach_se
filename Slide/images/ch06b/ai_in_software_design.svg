<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" width="680" height="270">
  <rect x="10" y="10" width="660" height="250" rx="10" fill="#f8f9fa" stroke="none" stroke-width="0"/>
  <text x="340" y="34" fill="#0b3c5d" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle">How AI Assists Software Design &amp; Refactoring (Design Copilot)</text>

  <!-- Box 1: Refactoring -->
  <g transform="translate(30, 55)">
    <rect x="0" y="0" width="135" height="185" rx="8" fill="#0b3c5d"/>
    <text x="67" y="25" fill="#ffffff" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">1. SOLID Refactor</text>
    <line x1="10" y1="35" x2="125" y2="35" stroke="#328cc1" stroke-width="1.5"/>
    <text x="67" y="60" fill="#e1f5fe" font-family="Arial" font-size="9" text-anchor="middle">• Split God Classes</text>
    <text x="67" y="75" fill="#e1f5fe" font-family="Arial" font-size="9" text-anchor="middle">  (SRP enforcement)</text>
    <text x="67" y="100" fill="#e1f5fe" font-family="Arial" font-size="9" text-anchor="middle">• Extract Interfaces</text>
    <text x="67" y="115" fill="#e1f5fe" font-family="Arial" font-size="9" text-anchor="middle">  for Dependency Inj.</text>
    <text x="67" y="140" fill="#ffffff" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle">• Reduce Code</text>
    <text x="67" y="155" fill="#ffffff" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle">  Duplication</text>
  </g>

  <!-- Box 2: Code Smells -->
  <g transform="translate(195, 55)">
    <rect x="0" y="0" width="135" height="185" rx="8" fill="#328cc1"/>
    <text x="67" y="25" fill="#ffffff" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">2. Code Smells</text>
    <line x1="10" y1="35" x2="125" y2="35" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
    <text x="67" y="60" fill="#ffffff" font-family="Arial" font-size="9" text-anchor="middle">• Detect Tight</text>
    <text x="67" y="75" fill="#ffffff" font-family="Arial" font-size="9" text-anchor="middle">  Coupling Smells</text>
    <text x="67" y="100" fill="#ffffff" font-family="Arial" font-size="9" text-anchor="middle">• Flag Low Cohesion</text>
    <text x="67" y="115" fill="#ffffff" font-family="Arial" font-size="9" text-anchor="middle">  in monolithic files</text>
    <text x="67" y="140" fill="#ffffff" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle">• Suggest Clean</text>
    <text x="67" y="155" fill="#ffffff" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle">  Abstractions</text>
  </g>

  <!-- Box 3: Design Patterns -->
  <g transform="translate(360, 55)">
    <rect x="0" y="0" width="135" height="185" rx="8" fill="#0b3c5d"/>
    <text x="67" y="25" fill="#ffffff" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">3. GoF Patterns</text>
    <line x1="10" y1="35" x2="125" y2="35" stroke="#328cc1" stroke-width="1.5"/>
    <text x="67" y="60" fill="#e1f5fe" font-family="Arial" font-size="9" text-anchor="middle">• Recommend GoF</text>
    <text x="67" y="75" fill="#e1f5fe" font-family="Arial" font-size="9" text-anchor="middle">  Design Patterns</text>
    <text x="67" y="100" fill="#e1f5fe" font-family="Arial" font-size="9" text-anchor="middle">• Strategy, Factory,</text>
    <text x="67" y="115" fill="#e1f5fe" font-family="Arial" font-size="9" text-anchor="middle">  Observer, Adapter</text>
    <text x="67" y="140" fill="#ffffff" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle">• Boilerplate</text>
    <text x="67" y="155" fill="#ffffff" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle">  Code Gen</text>
  </g>

  <!-- Box 4: Testability &amp; Mocks -->
  <g transform="translate(525, 55)">
    <rect x="0" y="0" width="125" height="185" rx="8" fill="#e8f5e9" stroke="none" stroke-width="0"/>
    <text x="62" y="25" fill="#2e7d32" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">4. Testability</text>
    <line x1="10" y1="35" x2="115" y2="35" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="62" y="60" fill="#333" font-family="Arial" font-size="9" text-anchor="middle">• Generate Mock</text>
    <text x="62" y="75" fill="#333" font-family="Arial" font-size="9" text-anchor="middle">  Implementations</text>
    <text x="62" y="100" fill="#333" font-family="Arial" font-size="9" text-anchor="middle">• Improve Unit</text>
    <text x="62" y="115" fill="#333" font-family="Arial" font-size="9" text-anchor="middle">  Testability</text>
    <text x="62" y="140" fill="#2e7d32" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle">• Developer</text>
    <text x="62" y="155" fill="#2e7d32" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle">  Code Review</text>
  </g>
</svg>