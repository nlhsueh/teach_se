<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" width="680" height="270">
  <rect x="10" y="10" width="660" height="250" rx="10" fill="#f8f9fa" stroke="none" stroke-width="0"/>
  <text x="340" y="34" fill="#0b3c5d" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle">General Design Principle: High Cohesion vs. Low Coupling</text>

  <!-- Left Card: Cohesion -->
  <g transform="translate(35, 55)">
    <rect x="0" y="0" width="280" height="185" rx="8" fill="#e8f5e9" stroke="none" stroke-width="0"/>
    <text x="140" y="28" fill="#2e7d32" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">Cohesion (凝聚度)</text>
    <text x="140" y="45" fill="#666666" font-family="Arial" font-size="10" text-anchor="middle">Internal Focus &amp; Responsibilities</text>
    <line x1="15" y1="53" x2="265" y2="53" stroke="#2e7d32" stroke-width="1.5"/>

    <rect x="20" y="70" width="240" height="40" rx="6" fill="#2e7d32"/>
    <text x="140" y="94" fill="#ffffff" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">GOAL: HIGH COHESION</text>

    <text x="140" y="130" fill="#333333" font-family="Arial" font-size="10" text-anchor="middle">• All methods/data in a module serve</text>
    <text x="140" y="145" fill="#333333" font-family="Arial" font-size="10" text-anchor="middle">  a single, well-defined purpose.</text>
    <text x="140" y="165" fill="#2e7d32" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle">&amp;rarr; High Readability &amp; Maintainability</text>
  </g>

  <!-- Right Card: Coupling -->
  <g transform="translate(365, 55)">
    <rect x="0" y="0" width="280" height="185" rx="8" fill="#e1f5fe" stroke="none" stroke-width="0"/>
    <text x="140" y="28" fill="#0b3c5d" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">Coupling (耦合度)</text>
    <text x="140" y="45" fill="#666666" font-family="Arial" font-size="10" text-anchor="middle">Interdependence Between Modules</text>
    <line x1="15" y1="53" x2="265" y2="53" stroke="#0b3c5d" stroke-width="1.5"/>

    <rect x="20" y="70" width="240" height="40" rx="6" fill="#0b3c5d"/>
    <text x="140" y="94" fill="#ffffff" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">GOAL: LOW COUPLING</text>

    <text x="140" y="130" fill="#333333" font-family="Arial" font-size="10" text-anchor="middle">• Modules communicate via clean</text>
    <text x="140" y="145" fill="#333333" font-family="Arial" font-size="10" text-anchor="middle">  interfaces with minimal dependencies.</text>
    <text x="140" y="165" fill="#0b3c5d" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle">&amp;rarr; Easy Reuse &amp; Independent Testing</text>
  </g>
</svg>