<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300">
  <rect x="10" y="10" width="680" height="280" rx="10" fill="#f8f9fa" stroke="none" stroke-width="0"/>
  <text x="350" y="38" fill="#0b3c5d" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">7 Core Principles of Software Testing (ISTQB)</text>

  <!-- Row 1 -->
  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="145" height="90" rx="6" fill="#0b3c5d"/>
    <text x="72" y="25" fill="#328cc1" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">1. Presence of Defects</text>
    <text x="72" y="45" fill="#ffffff" font-family="Arial" font-size="9" text-anchor="middle">Shows bugs exist;</text>
    <text x="72" y="60" fill="#ffffff" font-family="Arial" font-size="9" text-anchor="middle">cannot prove 100% bug-free.</text>
  </g>

  <g transform="translate(190, 60)">
    <rect x="0" y="0" width="145" height="90" rx="6" fill="#328cc1"/>
    <text x="72" y="25" fill="#ffffff" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">2. Exhaustive Impossible</text>
    <text x="72" y="45" fill="#ffffff" font-family="Arial" font-size="9" text-anchor="middle">Testing all inputs</text>
    <text x="72" y="60" fill="#ffffff" font-family="Arial" font-size="9" text-anchor="middle">is computationally infeasible.</text>
  </g>

  <g transform="translate(350, 60)">
    <rect x="0" y="0" width="145" height="90" rx="6" fill="#0b3c5d"/>
    <text x="72" y="25" fill="#328cc1" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">3. Early Testing / Shift-Left</text>
    <text x="72" y="45" fill="#ffffff" font-family="Arial" font-size="9" text-anchor="middle">Start early in SDLC</text>
    <text x="72" y="60" fill="#ffffff" font-family="Arial" font-size="9" text-anchor="middle">to cut cost up to 100x.</text>
  </g>

  <g transform="translate(510, 60)">
    <rect x="0" y="0" width="150" height="90" rx="6" fill="#328cc1"/>
    <text x="75" y="25" fill="#ffffff" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">4. Defect Clustering</text>
    <text x="75" y="45" fill="#ffffff" font-family="Arial" font-size="9" text-anchor="middle">80% of defects in</text>
    <text x="75" y="60" fill="#ffffff" font-family="Arial" font-size="9" text-anchor="middle">20% of modules (Pareto).</text>
  </g>

  <!-- Row 2 -->
  <g transform="translate(100, 170)">
    <rect x="0" y="0" width="150" height="90" rx="6" fill="#328cc1"/>
    <text x="75" y="25" fill="#ffffff" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">5. Pesticide Paradox</text>
    <text x="75" y="45" fill="#ffffff" font-family="Arial" font-size="9" text-anchor="middle">Same tests stop catching</text>
    <text x="75" y="60" fill="#ffffff" font-family="Arial" font-size="9" text-anchor="middle">new bugs; update suite.</text>
  </g>

  <g transform="translate(275, 170)">
    <rect x="0" y="0" width="150" height="90" rx="6" fill="#0b3c5d"/>
    <text x="75" y="25" fill="#328cc1" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">6. Context Dependent</text>
    <text x="75" y="45" fill="#ffffff" font-family="Arial" font-size="9" text-anchor="middle">E-commerce vs. Medical</text>
    <text x="75" y="60" fill="#ffffff" font-family="Arial" font-size="9" text-anchor="middle">require distinct strategies.</text>
  </g>

  <g transform="translate(450, 170)">
    <rect x="0" y="0" width="150" height="90" rx="6" fill="#328cc1"/>
    <text x="75" y="25" fill="#ffffff" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">7. Absence of Errors Fallacy</text>
    <text x="75" y="45" fill="#ffffff" font-family="Arial" font-size="9" text-anchor="middle">Zero bugs is useless</text>
    <text x="75" y="60" fill="#ffffff" font-family="Arial" font-size="9" text-anchor="middle">if system misses user needs.</text>
  </g>
</svg>