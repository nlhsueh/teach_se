<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" width="700" height="280">
  <rect x="10" y="10" width="680" height="260" rx="10" fill="#f8f9fa" stroke="none" stroke-width="0"/>
  <text x="350" y="38" fill="#0b3c5d" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">5 Key Black-Box Testing Techniques</text>

  <!-- 1. EP -->
  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="200" height="90" rx="6" fill="#0b3c5d"/>
    <text x="100" y="25" fill="#ffffff" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">1. Equivalence Partitioning</text>
    <text x="100" y="48" fill="#e1f5fe" font-family="Arial" font-size="10" text-anchor="middle">Divides input domain into valid &amp;</text>
    <text x="100" y="65" fill="#e1f5fe" font-family="Arial" font-size="10" text-anchor="middle">invalid equivalence classes.</text>
  </g>

  <!-- 2. BVA -->
  <g transform="translate(250, 60)">
    <rect x="0" y="0" width="200" height="90" rx="6" fill="#328cc1"/>
    <text x="100" y="25" fill="#ffffff" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">2. Boundary Value Analysis</text>
    <text x="100" y="48" fill="#ffffff" font-family="Arial" font-size="10" text-anchor="middle">Tests values at partition edges</text>
    <text x="100" y="65" fill="#ffffff" font-family="Arial" font-size="10" text-anchor="middle">(min-1, min, max, max+1).</text>
  </g>

  <!-- 3. Decision Table -->
  <g transform="translate(470, 60)">
    <rect x="0" y="0" width="200" height="90" rx="6" fill="#0b3c5d"/>
    <text x="100" y="25" fill="#ffffff" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">3. Decision Table Testing</text>
    <text x="100" y="48" fill="#e1f5fe" font-family="Arial" font-size="10" text-anchor="middle">Maps combinations of complex</text>
    <text x="100" y="65" fill="#e1f5fe" font-family="Arial" font-size="10" text-anchor="middle">logical conditions to actions.</text>
  </g>

  <!-- 4. State Transition -->
  <g transform="translate(140, 165)">
    <rect x="0" y="0" width="200" height="90" rx="6" fill="#328cc1"/>
    <text x="100" y="25" fill="#ffffff" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">4. State Transition Testing</text>
    <text x="100" y="48" fill="#ffffff" font-family="Arial" font-size="10" text-anchor="middle">Verifies system responses across</text>
    <text x="100" y="65" fill="#ffffff" font-family="Arial" font-size="10" text-anchor="middle">discrete finite state transitions.</text>
  </g>

  <!-- 5. Use Case Testing -->
  <g transform="translate(360, 165)">
    <rect x="0" y="0" width="200" height="90" rx="6" fill="#0b3c5d"/>
    <text x="100" y="25" fill="#ffffff" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">5. Use Case / Scenario</text>
    <text x="100" y="48" fill="#e1f5fe" font-family="Arial" font-size="10" text-anchor="middle">Derives test cases directly from</text>
    <text x="100" y="65" fill="#e1f5fe" font-family="Arial" font-size="10" text-anchor="middle">end-to-end user workflows.</text>
  </g>
</svg>