<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" width="680" height="260">
  <rect x="10" y="10" width="660" height="240" rx="10" fill="#f8f9fa" stroke="none" stroke-width="0"/>
  <text x="340" y="35" fill="#0b3c5d" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle">Multi-Variable Equivalence Partitioning: Swimming Pool Fee</text>

  <!-- Table Header -->
  <rect x="25" y="55" width="130" height="30" fill="#0b3c5d"/>
  <text x="90" y="75" fill="#ffffff" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Partition / Test</text>

  <rect x="160" y="55" width="120" height="30" fill="#328cc1"/>
  <text x="220" y="75" fill="#ffffff" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Age Partition</text>

  <rect x="285" y="55" width="120" height="30" fill="#328cc1"/>
  <text x="345" y="75" fill="#ffffff" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Time Slot</text>

  <rect x="410" y="55" width="110" height="30" fill="#328cc1"/>
  <text x="465" y="75" fill="#ffffff" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Member?</text>

  <rect x="525" y="55" width="130" height="30" fill="#0b3c5d"/>
  <text x="590" y="75" fill="#ffffff" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Expected Fee</text>

  <!-- Row 1 -->
  <rect x="25" y="85" width="130" height="30" fill="#ffffff" stroke="#cccccc"/>
  <text x="90" y="105" fill="#333" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle">Case 1 (Child)</text>

  <rect x="160" y="85" width="120" height="30" fill="#ffffff" stroke="#cccccc"/>
  <text x="220" y="105" fill="#333" font-family="Arial" font-size="10" text-anchor="middle">Age = 8 (&lt;12)</text>

  <rect x="285" y="85" width="120" height="30" fill="#ffffff" stroke="#cccccc"/>
  <text x="345" y="105" fill="#333" font-family="Arial" font-size="10" text-anchor="middle">Off-Peak</text>

  <rect x="410" y="85" width="110" height="30" fill="#ffffff" stroke="#cccccc"/>
  <text x="465" y="105" fill="#2e7d32" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle">Yes (Member)</text>

  <rect x="525" y="85" width="130" height="30" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="590" y="105" fill="#2e7d32" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">$50 (Child Discount)</text>

  <!-- Row 2 -->
  <rect x="25" y="115" width="130" height="30" fill="#ffffff" stroke="#cccccc"/>
  <text x="90" y="135" fill="#333" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle">Case 2 (Adult)</text>

  <rect x="160" y="115" width="120" height="30" fill="#ffffff" stroke="#cccccc"/>
  <text x="220" y="135" fill="#333" font-family="Arial" font-size="10" text-anchor="middle">Age = 30 (12-64)</text>

  <rect x="285" y="115" width="120" height="30" fill="#ffffff" stroke="#cccccc"/>
  <text x="345" y="135" fill="#333" font-family="Arial" font-size="10" text-anchor="middle">Peak (Evening)</text>

  <rect x="410" y="115" width="110" height="30" fill="#ffffff" stroke="#cccccc"/>
  <text x="465" y="135" fill="#c62828" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle">No (Non-Member)</text>

  <rect x="525" y="115" width="130" height="30" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="590" y="135" fill="#2e7d32" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">$150 (Full Price)</text>

  <!-- Row 3 -->
  <rect x="25" y="145" width="130" height="30" fill="#ffffff" stroke="#cccccc"/>
  <text x="90" y="165" fill="#333" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle">Case 3 (Senior)</text>

  <rect x="160" y="145" width="120" height="30" fill="#ffffff" stroke="#cccccc"/>
  <text x="220" y="165" fill="#333" font-family="Arial" font-size="10" text-anchor="middle">Age = 70 (&amp;ge;65)</text>

  <rect x="285" y="145" width="120" height="30" fill="#ffffff" stroke="#cccccc"/>
  <text x="345" y="165" fill="#333" font-family="Arial" font-size="10" text-anchor="middle">Off-Peak</text>

  <rect x="410" y="145" width="110" height="30" fill="#ffffff" stroke="#cccccc"/>
  <text x="465" y="165" fill="#c62828" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle">No (Non-Member)</text>

  <rect x="525" y="145" width="130" height="30" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="590" y="165" fill="#2e7d32" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">$80 (Senior Rate)</text>

  <!-- Row 4 -->
  <rect x="25" y="175" width="130" height="30" fill="#ffffff" stroke="#cccccc"/>
  <text x="90" y="195" fill="#c62828" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle">Case 4 (Invalid)</text>

  <rect x="160" y="175" width="120" height="30" fill="#ffffff" stroke="#cccccc"/>
  <text x="220" y="195" fill="#c62828" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle">Age = -5 (&lt;0)</text>

  <rect x="285" y="175" width="120" height="30" fill="#ffffff" stroke="#cccccc"/>
  <text x="345" y="195" fill="#333" font-family="Arial" font-size="10" text-anchor="middle">Peak</text>

  <rect x="410" y="175" width="110" height="30" fill="#ffffff" stroke="#cccccc"/>
  <text x="465" y="195" fill="#2e7d32" font-family="Arial" font-size="10" text-anchor="middle">Yes</text>

  <rect x="525" y="175" width="130" height="30" fill="#ffebee" stroke="#c62828"/>
  <text x="590" y="195" fill="#c62828" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">ERROR: Invalid Age</text>
</svg>