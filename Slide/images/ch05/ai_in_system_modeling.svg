<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" width="680" height="270">
  <rect x="10" y="10" width="660" height="250" rx="10" fill="#f8f9fa" stroke="none" stroke-width="0"/>
  <text x="340" y="34" fill="#0b3c5d" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle">How AI Assists System Modeling (UML &amp; Diagramming Copilot)</text>

  <!-- Box 1: Text-to-UML -->
  <g transform="translate(30, 55)">
    <rect x="0" y="0" width="135" height="185" rx="8" fill="#0b3c5d"/>
    <text x="67" y="25" fill="#ffffff" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">1. Text-to-UML</text>
    <line x1="10" y1="35" x2="125" y2="35" stroke="#328cc1" stroke-width="1.5"/>
    <text x="67" y="60" fill="#e1f5fe" font-family="Arial" font-size="9" text-anchor="middle">• User Stories to</text>
    <text x="67" y="75" fill="#e1f5fe" font-family="Arial" font-size="9" text-anchor="middle">  PlantUML / Mermaid</text>
    <text x="67" y="100" fill="#e1f5fe" font-family="Arial" font-size="9" text-anchor="middle">• Sequence Diagram</text>
    <text x="67" y="115" fill="#e1f5fe" font-family="Arial" font-size="9" text-anchor="middle">  Generation</text>
    <text x="67" y="140" fill="#ffffff" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle">• Rapid Visual</text>
    <text x="67" y="155" fill="#ffffff" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle">  Prototyping</text>
  </g>

  <!-- Box 2: Domain Extraction -->
  <g transform="translate(195, 55)">
    <rect x="0" y="0" width="135" height="185" rx="8" fill="#328cc1"/>
    <text x="67" y="25" fill="#ffffff" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">2. Domain Model</text>
    <line x1="10" y1="35" x2="125" y2="35" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
    <text x="67" y="60" fill="#ffffff" font-family="Arial" font-size="9" text-anchor="middle">• Extract Entities</text>
    <text x="67" y="75" fill="#ffffff" font-family="Arial" font-size="9" text-anchor="middle">  from Specs (Nouns)</text>
    <text x="67" y="100" fill="#ffffff" font-family="Arial" font-size="9" text-anchor="middle">• Draft Class</text>
    <text x="67" y="115" fill="#ffffff" font-family="Arial" font-size="9" text-anchor="middle">  Attributes/Methods</text>
    <text x="67" y="140" fill="#ffffff" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle">• Association</text>
    <text x="67" y="155" fill="#ffffff" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle">  Relationships</text>
  </g>

  <!-- Box 3: Consistency Checking -->
  <g transform="translate(360, 55)">
    <rect x="0" y="0" width="135" height="185" rx="8" fill="#0b3c5d"/>
    <text x="67" y="25" fill="#ffffff" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">3. Consistency</text>
    <line x1="10" y1="35" x2="125" y2="35" stroke="#328cc1" stroke-width="1.5"/>
    <text x="67" y="60" fill="#e1f5fe" font-family="Arial" font-size="9" text-anchor="middle">• Cross-Diagram</text>
    <text x="67" y="75" fill="#e1f5fe" font-family="Arial" font-size="9" text-anchor="middle">  Validation</text>
    <text x="67" y="100" fill="#e1f5fe" font-family="Arial" font-size="9" text-anchor="middle">• Use Case &lt;-&gt; Class</text>
    <text x="67" y="115" fill="#e1f5fe" font-family="Arial" font-size="9" text-anchor="middle">  Alignment</text>
    <text x="67" y="140" fill="#ffffff" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle">• Detect Missing</text>
    <text x="67" y="155" fill="#ffffff" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle">  States/Transitions</text>
  </g>

  <!-- Box 4: Code-to-Model -->
  <g transform="translate(525, 55)">
    <rect x="0" y="0" width="125" height="185" rx="8" fill="#e8f5e9" stroke="none" stroke-width="0"/>
    <text x="62" y="25" fill="#2e7d32" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">4. Reverse Eng</text>
    <line x1="10" y1="35" x2="115" y2="35" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="62" y="60" fill="#333" font-family="Arial" font-size="9" text-anchor="middle">• Code-to-UML</text>
    <text x="62" y="75" fill="#333" font-family="Arial" font-size="9" text-anchor="middle">  Class Diagrams</text>
    <text x="62" y="100" fill="#333" font-family="Arial" font-size="9" text-anchor="middle">• Legacy Code</text>
    <text x="62" y="115" fill="#333" font-family="Arial" font-size="9" text-anchor="middle">  Understanding</text>
    <text x="62" y="140" fill="#2e7d32" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle">• Architect</text>
    <text x="62" y="155" fill="#2e7d32" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle">  Human Review</text>
  </g>
</svg>