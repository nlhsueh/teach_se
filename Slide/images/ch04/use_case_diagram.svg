<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 350" width="650" height="350">
  <!-- System Boundary -->
  <rect x="180" y="20" width="300" height="310" rx="8" fill="#f8f9fa" stroke="none" stroke-width="0"/>
  <text x="330" y="45" fill="#0b3c5d" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Mentcare System</text>

  <!-- Actors -->
  <!-- Receptionist -->
  <g transform="translate(40, 60)">
    <circle cx="20" cy="15" r="10" fill="none" stroke="#0b3c5d" stroke-width="2"/>
    <line x1="20" y1="25" x2="20" y2="55" stroke="#0b3c5d" stroke-width="2"/>
    <line x1="5" y1="35" x2="35" y2="35" stroke="#0b3c5d" stroke-width="2"/>
    <line x1="20" y1="55" x2="5" y2="75" stroke="#0b3c5d" stroke-width="2"/>
    <line x1="20" y1="55" x2="35" y2="75" stroke="#0b3c5d" stroke-width="2"/>
    <text x="20" y="95" fill="#0b3c5d" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Receptionist</text>
  </g>

  <!-- Doctor -->
  <g transform="translate(40, 200)">
    <circle cx="20" cy="15" r="10" fill="none" stroke="#0b3c5d" stroke-width="2"/>
    <line x1="20" y1="25" x2="20" y2="55" stroke="#0b3c5d" stroke-width="2"/>
    <line x1="5" y1="35" x2="35" y2="35" stroke="#0b3c5d" stroke-width="2"/>
    <line x1="20" y1="55" x2="5" y2="75" stroke="#0b3c5d" stroke-width="2"/>
    <line x1="20" y1="55" x2="35" y2="75" stroke="#0b3c5d" stroke-width="2"/>
    <text x="20" y="95" fill="#0b3c5d" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Doctor</text>
  </g>

  <!-- Manager -->
  <g transform="translate(560, 60)">
    <circle cx="20" cy="15" r="10" fill="none" stroke="#0b3c5d" stroke-width="2"/>
    <line x1="20" y1="25" x2="20" y2="55" stroke="#0b3c5d" stroke-width="2"/>
    <line x1="5" y1="35" x2="35" y2="35" stroke="#0b3c5d" stroke-width="2"/>
    <line x1="20" y1="55" x2="5" y2="75" stroke="#0b3c5d" stroke-width="2"/>
    <line x1="20" y1="55" x2="35" y2="75" stroke="#0b3c5d" stroke-width="2"/>
    <text x="20" y="95" fill="#0b3c5d" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Manager</text>
  </g>

  <!-- Use Cases -->
  <!-- Register patient -->
  <ellipse cx="330" cy="80" rx="70" ry="20" fill="#328cc1" opacity="0.2" stroke="#328cc1" stroke-width="2"/>
  <text x="330" y="84" fill="#0b3c5d" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Register Patient</text>

  <!-- View Record -->
  <ellipse cx="330" cy="150" rx="70" ry="20" fill="#328cc1" opacity="0.2" stroke="#328cc1" stroke-width="2"/>
  <text x="330" y="154" fill="#0b3c5d" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">View Patient Record</text>

  <!-- Prescribe Medication -->
  <ellipse cx="330" cy="220" rx="75" ry="20" fill="#328cc1" opacity="0.2" stroke="#328cc1" stroke-width="2"/>
  <text x="330" y="224" fill="#0b3c5d" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Prescribe Medication</text>

  <!-- Generate Report -->
  <ellipse cx="330" cy="285" rx="70" ry="20" fill="#328cc1" opacity="0.2" stroke="#328cc1" stroke-width="2"/>
  <text x="330" y="289" fill="#0b3c5d" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Generate Report</text>

  <!-- Associations -->
  <line x1="75" y1="95" x2="260" y2="80" stroke="#0b3c5d" stroke-width="1.5"/>
  <line x1="75" y1="235" x2="260" y2="150" stroke="#0b3c5d" stroke-width="1.5"/>
  <line x1="75" y1="235" x2="255" y2="220" stroke="#0b3c5d" stroke-width="1.5"/>
  <line x1="560" y1="95" x2="400" y2="285" stroke="#0b3c5d" stroke-width="1.5"/>
</svg>