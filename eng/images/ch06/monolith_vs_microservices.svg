<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" width="100%" height="100%">
  <!-- Monolithic Box (Left) -->
  <g transform="translate(40, 20)">
    <rect x="0" y="0" width="260" height="240" rx="10" fill="#f0f4f8" stroke="none" stroke-width="0"/>
    <text x="130" y="35" fill="#0b3c5d" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle">Monolithic Architecture</text>
    
    <rect x="25" y="55" width="210" height="40" rx="5" fill="#0b3c5d"/>
    <text x="130" y="80" fill="#ffffff" font-family="Arial" font-size="12" text-anchor="middle">UI / Presentation Layer</text>

    <rect x="25" y="105" width="210" height="40" rx="5" fill="#328cc1"/>
    <text x="130" y="130" fill="#ffffff" font-family="Arial" font-size="12" text-anchor="middle">Business Logic Layer</text>

    <rect x="25" y="155" width="210" height="40" rx="5" fill="#0b3c5d"/>
    <text x="130" y="180" fill="#ffffff" font-family="Arial" font-size="12" text-anchor="middle">Data Access Layer</text>

    <text x="130" y="225" fill="#666" font-family="Arial" font-size="11" text-anchor="middle">Single Unified Codebase &amp; DB</text>
  </g>

  <!-- VS Divider -->
  <text x="350" y="145" fill="#328cc1" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">VS</text>

  <!-- Microservices (Right) -->
  <g transform="translate(400, 20)">
    <rect x="0" y="0" width="260" height="240" rx="10" fill="#f0f4f8" stroke="none" stroke-width="0"/>
    <text x="130" y="35" fill="#328cc1" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle">Microservices Architecture</text>

    <!-- Service A -->
    <rect x="20" y="60" width="100" height="65" rx="5" fill="#328cc1"/>
    <text x="70" y="88" fill="#ffffff" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">User Service</text>
    <text x="70" y="108" fill="#e1f5fe" font-family="Arial" font-size="9" text-anchor="middle">[ DB 1 ]</text>

    <!-- Service B -->
    <rect x="140" y="60" width="100" height="65" rx="5" fill="#0b3c5d"/>
    <text x="190" y="88" fill="#ffffff" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Order Service</text>
    <text x="190" y="108" fill="#e1f5fe" font-family="Arial" font-size="9" text-anchor="middle">[ DB 2 ]</text>

    <!-- Service C -->
    <rect x="20" y="140" width="100" height="65" rx="5" fill="#0b3c5d"/>
    <text x="70" y="168" fill="#ffffff" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Pay Service</text>
    <text x="70" y="188" fill="#e1f5fe" font-family="Arial" font-size="9" text-anchor="middle">[ DB 3 ]</text>

    <!-- Service D -->
    <rect x="140" y="140" width="100" height="65" rx="5" fill="#328cc1"/>
    <text x="190" y="168" fill="#ffffff" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Notify Service</text>
    <text x="190" y="188" fill="#e1f5fe" font-family="Arial" font-size="9" text-anchor="middle">[ DB 4 ]</text>

    <text x="130" y="225" fill="#666" font-family="Arial" font-size="11" text-anchor="middle">Independent Services &amp; DBs</text>
  </g>
</svg>