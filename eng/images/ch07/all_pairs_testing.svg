<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" width="100%" height="100%">
  <rect x="10" y="10" width="660" height="240" rx="10" fill="#f8f9fa" stroke="none" stroke-width="0"/>
  <text x="340" y="35" fill="#0b3c5d" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle">Combinatorial Explosion vs. All-Pairs (Pairwise) Testing</text>

  <!-- Full Cartesian Product (Left) -->
  <g transform="translate(35, 60)">
    <rect x="0" y="0" width="280" height="170" rx="8" fill="#ffebee" stroke="none" stroke-width="0"/>
    <text x="140" y="30" fill="#c62828" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">Full Combinatorial (Cartesian)</text>
    <line x1="15" y1="42" x2="265" y2="42" stroke="#c62828" stroke-width="1"/>
    
    <text x="140" y="70" fill="#333333" font-family="Arial" font-size="11" text-anchor="middle">Tests all possible combinations across</text>
    <text x="140" y="90" fill="#333333" font-family="Arial" font-size="11" text-anchor="middle">all N variables (N_1 x N_2 x ... x N_k).</text>
    <text x="140" y="115" fill="#c62828" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Exponential Explosion: O(N^k)</text>
    <text x="140" y="145" fill="#666666" font-family="Arial" font-size="10" text-anchor="middle">e.g., 10 variables w/ 3 values = 59,049 tests!</text>
  </g>

  <!-- VS Arrow -->
  <text x="340" y="150" fill="#328cc1" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">VS</text>

  <!-- All-Pairs / Pairwise (Right) -->
  <g transform="translate(365, 60)">
    <rect x="0" y="0" width="280" height="170" rx="8" fill="#e8f5e9" stroke="none" stroke-width="0"/>
    <text x="140" y="30" fill="#2e7d32" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">All-Pairs (Pairwise Testing)</text>
    <line x1="15" y1="42" x2="265" y2="42" stroke="#2e7d32" stroke-width="1"/>

    <text x="140" y="70" fill="#333333" font-family="Arial" font-size="11" text-anchor="middle">Ensures EVERY PAIR of variables is</text>
    <text x="140" y="90" fill="#333333" font-family="Arial" font-size="11" text-anchor="middle">tested together at least once.</text>
    <text x="140" y="115" fill="#2e7d32" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Drastic Reduction: O(N^2)</text>
    <text x="140" y="145" fill="#2e7d32" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle">e.g., 59,049 tests reduced to ~15-20 tests!</text>
  </g>
</svg>