<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <!-- Outer Frame -->
  <rect x="10" y="10" width="580" height="280" rx="10" fill="#f8f9fa" stroke="none" stroke-width="0"/>
  <text x="300" y="38" fill="#0b3c5d" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">The Software Testing Pyramid</text>

  <!-- Pyramid Layers -->
  <!-- Level 4: Acceptance / UI (Top) -->
  <polygon points="300,55 240,110 360,110" fill="#e57373" stroke="#c62828" stroke-width="2"/>
  <text x="300" y="95" fill="#ffffff" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Acceptance / UI</text>
  <text x="300" y="106" fill="#ffffff" font-family="Arial" font-size="9" text-anchor="middle">(Slowest, Highest Cost)</text>

  <!-- Level 3: System Testing -->
  <polygon points="240,112 180,170 420,170 360,112" fill="#ffb74d" stroke="#ef6c00" stroke-width="2"/>
  <text x="300" y="145" fill="#ffffff" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">System / Integration Testing</text>
  <text x="300" y="160" fill="#ffffff" font-family="Arial" font-size="10" text-anchor="middle">(End-to-End Workflow &amp; Interfaces)</text>

  <!-- Level 2: Component Testing -->
  <polygon points="180,172 120,230 480,230 420,172" fill="#64b5f6" stroke="#1565c0" stroke-width="2"/>
  <text x="300" y="205" fill="#ffffff" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">Component Testing</text>
  <text x="300" y="220" fill="#ffffff" font-family="Arial" font-size="10" text-anchor="middle">(Subsystem &amp; Composite Classes)</text>

  <!-- Level 1: Unit Testing (Base) -->
  <polygon points="120,232 60,285 540,285 480,232" fill="#81c784" stroke="#2e7d32" stroke-width="2"/>
  <text x="300" y="260" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Unit Testing</text>
  <text x="300" y="275" fill="#ffffff" font-family="Arial" font-size="10" text-anchor="middle">(Fastest, Isolated Functions/Methods, Highest Volume)</text>
</svg>