<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" width="100%" height="100%">
  <rect x="10" y="10" width="680" height="260" rx="10" fill="#f8f9fa" stroke="none" stroke-width="0"/>
  <text x="350" y="36" fill="#0b3c5d" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Spectrum of Software Testing Types</text>

  <!-- Column 1: Functional Testing -->
  <g transform="translate(30, 55)">
    <rect x="0" y="0" width="200" height="200" rx="8" fill="#0b3c5d"/>
    <text x="100" y="28" fill="#ffffff" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">Functional Testing</text>
    <text x="100" y="45" fill="#328cc1" font-family="Arial" font-size="10" text-anchor="middle">"What the system does"</text>
    <line x1="15" y1="53" x2="185" y2="53" stroke="#328cc1" stroke-width="1.5"/>

    <text x="100" y="80" fill="#ffffff" font-family="Arial" font-size="11" text-anchor="middle">• Unit &amp; Component Test</text>
    <text x="100" y="105" fill="#ffffff" font-family="Arial" font-size="11" text-anchor="middle">• Integration &amp; System Test</text>
    <text x="100" y="130" fill="#ffffff" font-family="Arial" font-size="11" text-anchor="middle">• User Acceptance (UAT)</text>
    <text x="100" y="155" fill="#ffffff" font-family="Arial" font-size="11" text-anchor="middle">• Smoke &amp; Sanity Test</text>
  </g>

  <!-- Column 2: Specialized / Maintenance -->
  <g transform="translate(250, 55)">
    <rect x="0" y="0" width="200" height="200" rx="8" fill="#328cc1"/>
    <text x="100" y="28" fill="#ffffff" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">Maintenance &amp; Robustness</text>
    <text x="100" y="45" fill="#0b3c5d" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle">"Safety &amp; Evolution"</text>
    <line x1="15" y1="53" x2="185" y2="53" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>

    <text x="100" y="80" fill="#ffffff" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">• Regression Testing</text>
    <text x="100" y="98" fill="#e1f5fe" font-family="Arial" font-size="9" text-anchor="middle">(Prevents breaking existing code)</text>

    <text x="100" y="125" fill="#ffffff" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">• Fuzz Testing (Fuzzing)</text>
    <text x="100" y="143" fill="#e1f5fe" font-family="Arial" font-size="9" text-anchor="middle">(Random malformed inputs)</text>

    <text x="100" y="170" fill="#ffffff" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">• Mutation Testing</text>
  </g>

  <!-- Column 3: Non-Functional Testing -->
  <g transform="translate(470, 55)">
    <rect x="0" y="0" width="200" height="200" rx="8" fill="#0b3c5d"/>
    <text x="100" y="28" fill="#ffffff" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">Non-Functional Testing</text>
    <text x="100" y="45" fill="#328cc1" font-family="Arial" font-size="10" text-anchor="middle">"How well it performs"</text>
    <line x1="15" y1="53" x2="185" y2="53" stroke="#328cc1" stroke-width="1.5"/>

    <text x="100" y="80" fill="#ffffff" font-family="Arial" font-size="11" text-anchor="middle">• Load &amp; Stress Testing</text>
    <text x="100" y="105" fill="#ffffff" font-family="Arial" font-size="11" text-anchor="middle">• Security &amp; Pen Testing</text>
    <text x="100" y="130" fill="#ffffff" font-family="Arial" font-size="11" text-anchor="middle">• Usability &amp; UX Testing</text>
    <text x="100" y="155" fill="#ffffff" font-family="Arial" font-size="11" text-anchor="middle">• Compatibility &amp; OS</text>
  </g>
</svg>