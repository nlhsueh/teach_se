<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" width="100%" height="100%">
  <rect x="10" y="10" width="680" height="260" rx="10" fill="#f8f9fa" stroke="none" stroke-width="0"/>
  <text x="350" y="36" fill="#0b3c5d" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Black-Box Boundary Value Testing Taxonomy</text>

  <!-- Table Header -->
  <rect x="30" y="55" width="200" height="35" fill="#0b3c5d"/>
  <text x="130" y="77" fill="#ffffff" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Testing Type / Assumption</text>

  <rect x="235" y="55" width="210" height="35" fill="#328cc1"/>
  <text x="340" y="77" fill="#ffffff" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Normal Boundary (min, max)</text>

  <rect x="450" y="55" width="220" height="35" fill="#0b3c5d"/>
  <text x="560" y="77" fill="#ffffff" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Robust Boundary (min-, max+)</text>

  <!-- Row 1: Independent (Single Fault Assumption) -->
  <rect x="30" y="95" width="200" height="75" fill="#ffffff" stroke="#cccccc"/>
  <text x="130" y="125" fill="#0b3c5d" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Independent Testing</text>
  <text x="130" y="145" fill="#666666" font-family="Arial" font-size="10" text-anchor="middle">(Single Fault Assumption)</text>

  <rect x="235" y="95" width="210" height="75" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="340" y="125" fill="#2e7d32" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">4n + 1</text>
  <text x="340" y="148" fill="#333333" font-family="Arial" font-size="10" text-anchor="middle">min, min+, norm, max-, max</text>

  <rect x="450" y="95" width="220" height="75" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="560" y="125" fill="#2e7d32" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">6n + 1</text>
  <text x="560" y="148" fill="#333333" font-family="Arial" font-size="10" text-anchor="middle">Adds out-of-bounds (min-, max+)</text>

  <!-- Row 2: Non-Independent (Worst-Case / Interacting Variables) -->
  <rect x="30" y="175" width="200" height="75" fill="#ffffff" stroke="#cccccc"/>
  <text x="130" y="205" fill="#c62828" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Non-Independent</text>
  <text x="130" y="225" fill="#666666" font-family="Arial" font-size="10" text-anchor="middle">(Worst-Case / Cartesian Product)</text>

  <rect x="235" y="175" width="210" height="75" fill="#ffebee" stroke="#c62828"/>
  <text x="340" y="205" fill="#c62828" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">5^n</text>
  <text x="340" y="228" fill="#333333" font-family="Arial" font-size="10" text-anchor="middle">Combinatorial cross-product (5^3 = 125)</text>

  <rect x="450" y="175" width="220" height="75" fill="#ffebee" stroke="#c62828"/>
  <text x="560" y="205" fill="#c62828" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">7^n</text>
  <text x="560" y="228" fill="#333333" font-family="Arial" font-size="10" text-anchor="middle">Robust cross-product (7^3 = 343)</text>
</svg>