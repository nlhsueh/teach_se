<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="100%" height="100%">
  <rect x="10" y="10" width="660" height="280" rx="10" fill="#f8f9fa" stroke="none" stroke-width="0"/>
  <text x="340" y="38" fill="#0b3c5d" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">White-Box Code Coverage Subsumption Hierarchy</text>

  <!-- Level 6: Path Coverage (Top) -->
  <polygon points="340,52 230,90 450,90" fill="#c62828" stroke="#b71c1c" stroke-width="1.5"/>
  <text x="340" y="78" fill="#ffffff" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Path Coverage (PC)</text>

  <!-- Level 5: MCC -->
  <polygon points="230,92 190,130 490,130 450,92" fill="#e65100" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="340" y="115" fill="#ffffff" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Multiple Condition Combination (MCC)</text>

  <!-- Level 4: MC/DC -->
  <polygon points="190,132 150,170 530,170 490,132" fill="#f57c00" stroke="#e65100" stroke-width="1.5"/>
  <text x="340" y="155" fill="#ffffff" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">MC/DC (Modified Condition / Decision Coverage)</text>

  <!-- Level 3: BCC -->
  <polygon points="150,172 110,210 570,210 530,172" fill="#1976d2" stroke="#0d47a1" stroke-width="1.5"/>
  <text x="340" y="195" fill="#ffffff" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Branch &amp; Condition Coverage (BCC)</text>

  <!-- Level 2: Branch Coverage -->
  <polygon points="110,212 70,250 610,250 570,212" fill="#388e3c" stroke="#1b5e20" stroke-width="1.5"/>
  <text x="340" y="235" fill="#ffffff" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Branch / Decision Coverage (BC / DC)</text>

  <!-- Level 1: Statement Coverage (Base) -->
  <polygon points="70,252 30,285 650,285 610,252" fill="#66bb6a" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="340" y="273" fill="#ffffff" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Statement Coverage (SC) &mdash; Baseline Requirement</text>
</svg>