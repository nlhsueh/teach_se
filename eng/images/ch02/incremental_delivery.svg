<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0b3c5d" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2e7d32" />
    </marker>
  </defs>

  <!-- Title Banner -->
  <text x="490" y="30" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="bold" fill="#0b3c5d" text-anchor="middle">The Incremental Delivery Process</text>

  <!-- ROW 1: Phase 1 - System Specification & Architecture -->
  <g transform="translate(40, 50)">
    <rect x="0" y="0" width="270" height="95" rx="8" fill="#0b3c5d"/>
    <text x="135" y="35" font-family="Arial" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1. Define Outline</text>
    <text x="135" y="60" font-family="Arial" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Requirements</text>
    <text x="135" y="80" font-family="Arial" font-size="11" fill="#328cc1" text-anchor="middle">Core user goals &amp; scope</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 310 97 L 342 97" stroke="#0b3c5d" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(350, 50)">
    <rect x="0" y="0" width="270" height="95" rx="8" fill="#328cc1"/>
    <text x="135" y="35" font-family="Arial" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2. Assign Requirements</text>
    <text x="135" y="60" font-family="Arial" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">to Increments</text>
    <text x="135" y="80" font-family="Arial" font-size="11" fill="#e1f5fe" text-anchor="middle">Prioritize delivery features</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 620 97 L 652 97" stroke="#0b3c5d" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(660, 50)">
    <rect x="0" y="0" width="270" height="95" rx="8" fill="#0b3c5d"/>
    <text x="135" y="35" font-family="Arial" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">3. Design System</text>
    <text x="135" y="60" font-family="Arial" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Architecture</text>
    <text x="135" y="80" font-family="Arial" font-size="11" fill="#328cc1" text-anchor="middle">Stable system framework</text>
  </g>

  <!-- Arrow 3 -> Loop Container -->
  <path d="M 795 145 L 795 180" stroke="#0b3c5d" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ROW 2: Phase 2 - Incremental Development & Release Loop Container -->
  <rect x="25" y="185" width="930" height="215" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" stroke-dasharray="6,6"/>
  <text x="490" y="210" font-family="Arial" font-size="15" font-weight="bold" fill="#2e7d32" text-anchor="middle">INCREMENTAL DEVELOPMENT &amp; RELEASE LOOP (REPEATED PER INCREMENT)</text>

  <!-- Step 4 -->
  <g transform="translate(45, 230)">
    <rect x="0" y="0" width="165" height="85" rx="8" fill="#328cc1"/>
    <text x="82.5" y="33" font-family="Arial" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4. Develop</text>
    <text x="82.5" y="55" font-family="Arial" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Increment</text>
    <text x="82.5" y="73" font-family="Arial" font-size="10" fill="#e1f5fe" text-anchor="middle">Build feature step</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <path d="M 210 272 L 227 272" stroke="#0b3c5d" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 5 -->
  <g transform="translate(232, 230)">
    <rect x="0" y="0" width="165" height="85" rx="8" fill="#328cc1"/>
    <text x="82.5" y="33" font-family="Arial" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">5. Validate</text>
    <text x="82.5" y="55" font-family="Arial" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Increment</text>
    <text x="82.5" y="73" font-family="Arial" font-size="10" fill="#e1f5fe" text-anchor="middle">Unit &amp; feature test</text>
  </g>

  <!-- Arrow 5 -> 6 -->
  <path d="M 397 272 L 414 272" stroke="#0b3c5d" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 6 -->
  <g transform="translate(419, 230)">
    <rect x="0" y="0" width="165" height="85" rx="8" fill="#328cc1"/>
    <text x="82.5" y="33" font-family="Arial" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">6. Integrate</text>
    <text x="82.5" y="55" font-family="Arial" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Increment</text>
    <text x="82.5" y="73" font-family="Arial" font-size="10" fill="#e1f5fe" text-anchor="middle">Merge with codebase</text>
  </g>

  <!-- Arrow 6 -> 7 -->
  <path d="M 584 272 L 601 272" stroke="#0b3c5d" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 7 -->
  <g transform="translate(606, 230)">
    <rect x="0" y="0" width="165" height="85" rx="8" fill="#328cc1"/>
    <text x="82.5" y="33" font-family="Arial" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">7. Validate</text>
    <text x="82.5" y="55" font-family="Arial" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">System</text>
    <text x="82.5" y="73" font-family="Arial" font-size="10" fill="#e1f5fe" text-anchor="middle">Regression test</text>
  </g>

  <!-- Arrow 7 -> 8 -->
  <path d="M 771 272 L 788 272" stroke="#0b3c5d" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 8 -->
  <g transform="translate(793, 230)">
    <rect x="0" y="0" width="150" height="85" rx="8" fill="#2e7d32"/>
    <text x="75" y="33" font-family="Arial" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">8. Deploy to</text>
    <text x="75" y="55" font-family="Arial" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Customers</text>
    <text x="75" y="73" font-family="Arial" font-size="10" fill="#e8f5e9" text-anchor="middle">Usable release!</text>
  </g>

  <!-- Feedback Loop Arrow: Step 8 -> Step 4 (System Incomplete) -->
  <path d="M 868 315 L 868 360 C 868 375 850 375 830 375 L 127.5 375 C 107.5 375 127.5 360 127.5 315" fill="none" stroke="#2e7d32" stroke-width="2.5" stroke-dasharray="4,4" marker-end="url(#arrow-green)"/>
  <rect x="420" y="362" width="160" height="22" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="1"/>
  <text x="500" y="377" font-family="Arial" font-size="11" font-weight="bold" fill="#2e7d32" text-anchor="middle">System Incomplete (Loop Back)</text>

  <!-- ROW 3: Phase 3 - Final System Completion -->
  <!-- Arrow 8 -> 9 (System Complete) -->
  <path d="M 868 315 L 868 430" stroke="#0b3c5d" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="800" y="405" width="120" height="20" rx="3" fill="#ffffff" stroke="#0b3c5d" stroke-width="1"/>
  <text x="860" y="419" font-family="Arial" font-size="10" font-weight="bold" fill="#0b3c5d" text-anchor="middle">System Complete</text>

  <g transform="translate(660, 440)">
    <rect x="0" y="0" width="280" height="50" rx="8" fill="#0b3c5d"/>
    <text x="140" y="31" font-family="Arial" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">9. Final Production System</text>
  </g>
</svg>