<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <!-- Definitions for markers/arrows -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#328cc1"/>
    </marker>
  </defs>
  
  <!-- Step 1 Box -->
  <rect x="50" y="100" width="200" height="80" rx="10" fill="#0b3c5d" stroke="none" stroke-width="0"/>
  <text x="150" y="135" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Define System</text>
  <text x="150" y="158" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Requirements</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M 250 140 L 290 140" fill="none" stroke="#328cc1" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 2 Box -->
  <rect x="300" y="100" width="200" height="80" rx="10" fill="#328cc1" stroke="none" stroke-width="0"/>
  <text x="400" y="135" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Assess Existing</text>
  <text x="400" y="158" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">System</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M 500 140 L 540 140" fill="none" stroke="#328cc1" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 3 Box -->
  <rect x="550" y="100" width="200" height="80" rx="10" fill="#0b3c5d" stroke="none" stroke-width="0"/>
  <text x="650" y="135" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Propose System</text>
  <text x="650" y="158" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Modification</text>

  <!-- Return loop path (3 -> 1) -->
  <path d="M 650 180 C 650 250, 150 250, 150 180" fill="none" stroke="#328cc1" stroke-dasharray="5,5" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="400" y="240" fill="#328cc1" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Iterative Modification Loop</text>
</svg>
