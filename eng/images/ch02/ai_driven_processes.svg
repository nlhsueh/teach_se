<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" width="100%" height="100%">
  <rect x="10" y="10" width="680" height="260" rx="10" fill="#f8f9fa" stroke="none" stroke-width="0"/>
  <text x="350" y="34" fill="#0b3c5d" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Spectrum of AI-Driven Software Development Processes</text>

  <!-- Approach 1: Vibe Coding -->
  <g transform="translate(30, 55)">
    <rect x="0" y="0" width="200" height="190" rx="8" fill="#328cc1"/>
    <text x="100" y="28" fill="#ffffff" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">1. Vibe Coding</text>
    <text x="100" y="45" fill="#0b3c5d" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle">(Prompt-First Prototyping)</text>
    <line x1="15" y1="53" x2="185" y2="53" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>

    <text x="100" y="78" fill="#ffffff" font-family="Arial" font-size="10" text-anchor="middle">• Natural Language Prompts</text>
    <text x="100" y="98" fill="#ffffff" font-family="Arial" font-size="10" text-anchor="middle">• AI Generates Full Code</text>
    <text x="100" y="118" fill="#ffffff" font-family="Arial" font-size="10" text-anchor="middle">• Iterative "Vibe" Refinement</text>

    <rect x="15" y="140" width="170" height="35" rx="4" fill="#0b3c5d"/>
    <text x="100" y="157" fill="#ffffff" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle">Best For: Hackathons &amp;</text>
    <text x="100" y="169" fill="#ffffff" font-family="Arial" font-size="9" text-anchor="middle">Rapid MVP Prototypes</text>
  </g>

  <!-- Approach 2: Spec-Driven AI -->
  <g transform="translate(250, 55)">
    <rect x="0" y="0" width="200" height="190" rx="8" fill="#0b3c5d"/>
    <text x="100" y="28" fill="#ffffff" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">2. Spec-Driven AI</text>
    <text x="100" y="45" fill="#328cc1" font-family="Arial" font-size="10" text-anchor="middle">(Specification-Guided)</text>
    <line x1="15" y1="53" x2="185" y2="53" stroke="#328cc1" stroke-width="1.5"/>

    <text x="100" y="78" fill="#ffffff" font-family="Arial" font-size="10" text-anchor="middle">• Structured Markdown Specs</text>
    <text x="100" y="98" fill="#ffffff" font-family="Arial" font-size="10" text-anchor="middle">• AI Follows Architecture</text>
    <text x="100" y="118" fill="#ffffff" font-family="Arial" font-size="10" text-anchor="middle">• Automated Test Verification</text>

    <rect x="15" y="140" width="170" height="35" rx="4" fill="#328cc1"/>
    <text x="100" y="157" fill="#ffffff" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle">Best For: Production Apps &amp;</text>
    <text x="100" y="169" fill="#ffffff" font-family="Arial" font-size="9" text-anchor="middle">Complex System Features</text>
  </g>

  <!-- Approach 3: Agentic Pair Programming -->
  <g transform="translate(470, 55)">
    <rect x="0" y="0" width="200" height="190" rx="8" fill="#e8f5e9" stroke="none" stroke-width="0"/>
    <text x="100" y="28" fill="#2e7d32" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">3. Agentic Workflows</text>
    <text x="100" y="45" fill="#333333" font-family="Arial" font-size="10" text-anchor="middle">(Human Architect + AI Agent)</text>
    <line x1="15" y1="53" x2="185" y2="53" stroke="#2e7d32" stroke-width="1.5"/>

    <text x="100" y="78" fill="#333333" font-family="Arial" font-size="10" text-anchor="middle">• Human: Architect &amp; Reviewer</text>
    <text x="100" y="98" fill="#333333" font-family="Arial" font-size="10" text-anchor="middle">• AI Agent: Multi-file Coder</text>
    <text x="100" y="118" fill="#333333" font-family="Arial" font-size="10" text-anchor="middle">• Continuous Feedback Loop</text>

    <rect x="15" y="140" width="170" height="35" rx="4" fill="#2e7d32"/>
    <text x="100" y="157" fill="#ffffff" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle">Best For: Enterprise SDLC &amp;</text>
    <text x="100" y="169" fill="#ffffff" font-family="Arial" font-size="9" text-anchor="middle">10x Engineering Velocity</text>
  </g>
</svg>