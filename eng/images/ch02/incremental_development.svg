<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#328cc1"/>
    </marker>
  </defs>

  <!-- Release 1 Screen -->
  <g transform="translate(40, 40)">
    <!-- Monitor outline -->
    <rect x="0" y="0" width="180" height="110" rx="6" fill="#f0f4f8" stroke="none" stroke-width="0"/>
    <rect x="0" y="0" width="180" height="15" rx="3" fill="#0b3c5d"/>
    <!-- Stand -->
    <path d="M 70 110 L 110 110 L 120 130 L 60 130 Z" fill="#0b3c5d"/>
    <!-- Web Content: Landing page -->
    <text x="90" y="45" font-family="Arial" font-size="11" font-weight="bold" fill="#0b3c5d" text-anchor="middle">Landing Page</text>
    <rect x="25" y="60" width="130" height="8" rx="2" fill="#328cc1" opacity="0.3"/>
    <rect x="25" y="75" width="80" height="8" rx="2" fill="#328cc1" opacity="0.6"/>
    <!-- Label -->
    <rect x="15" y="145" width="150" height="45" rx="5" fill="#e1f5fe" stroke="none" stroke-width="0"/>
    <text x="90" y="162" font-family="Arial" font-size="11" font-weight="bold" fill="#0b3c5d" text-anchor="middle">Increment 1 (Release)</text>
    <text x="90" y="180" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">Core Info &amp; Contact Form</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 245 95 L 285 95" fill="none" stroke="#328cc1" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Release 2 Screen -->
  <g transform="translate(310, 40)">
    <!-- Monitor outline -->
    <rect x="0" y="0" width="180" height="110" rx="6" fill="#f0f4f8" stroke="none" stroke-width="0"/>
    <rect x="0" y="0" width="180" height="15" rx="3" fill="#0b3c5d"/>
    <!-- Stand -->
    <path d="M 70 110 L 110 110 L 120 130 L 60 130 Z" fill="#0b3c5d"/>
    <!-- Web Content: Catalog -->
    <text x="90" y="40" font-family="Arial" font-size="10" font-weight="bold" fill="#0b3c5d" text-anchor="middle">Product Catalog</text>
    <!-- Catalog Grid -->
    <rect x="20" y="55" width="40" height="30" rx="2" fill="#328cc1" opacity="0.5"/>
    <rect x="70" y="55" width="40" height="30" rx="2" fill="#328cc1" opacity="0.5"/>
    <rect x="120" y="55" width="40" height="30" rx="2" fill="#328cc1" opacity="0.5"/>
    <!-- Label -->
    <rect x="15" y="145" width="150" height="45" rx="5" fill="#e1f5fe" stroke="none" stroke-width="0"/>
    <text x="90" y="162" font-family="Arial" font-size="11" font-weight="bold" fill="#0b3c5d" text-anchor="middle">Increment 2 (Release)</text>
    <text x="90" y="180" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">Browse &amp; Search Products</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 515 95 L 555 95" fill="none" stroke="#328cc1" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Release 3 Screen -->
  <g transform="translate(580, 40)">
    <!-- Monitor outline -->
    <rect x="0" y="0" width="180" height="110" rx="6" fill="#f0f4f8" stroke="none" stroke-width="0"/>
    <rect x="0" y="0" width="180" height="15" rx="3" fill="#0b3c5d"/>
    <!-- Stand -->
    <path d="M 70 110 L 110 110 L 120 130 L 60 130 Z" fill="#0b3c5d"/>
    <!-- Web Content: Cart -->
    <text x="90" y="40" font-family="Arial" font-size="10" font-weight="bold" fill="#0b3c5d" text-anchor="middle">Shopping Cart &amp; Pay</text>
    <!-- Cart item row -->
    <rect x="20" y="55" width="140" height="12" rx="2" fill="#328cc1" opacity="0.3"/>
    <!-- Pay button -->
    <rect x="55" y="75" width="70" height="15" rx="3" fill="#328cc1"/>
    <text x="90" y="86" font-family="Arial" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">Pay Now</text>
    <!-- Label -->
    <rect x="15" y="145" width="150" height="45" rx="5" fill="#e1f5fe" stroke="none" stroke-width="0"/>
    <text x="90" y="162" font-family="Arial" font-size="11" font-weight="bold" fill="#0b3c5d" text-anchor="middle">Increment 3 (Release)</text>
    <text x="90" y="180" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">Cart Checkout &amp; Pay</text>
  </g>
</svg>
