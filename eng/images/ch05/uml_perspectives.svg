<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 280" width="100%" height="100%">
  <!-- 4 Perspectives Cards -->
  <!-- 1. External / Context -->
  <g transform="translate(20, 30)">
    <rect x="0" y="0" width="135" height="210" rx="8" fill="#0b3c5d"/>
    <text x="67" y="35" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">External</text>
    <text x="67" y="55" fill="#328cc1" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">(Context)</text>
    <line x1="15" y1="70" x2="120" y2="70" stroke="#328cc1" stroke-width="1"/>
    <text x="67" y="100" fill="#ffffff" font-family="Arial" font-size="11" text-anchor="middle">• System Boundaries</text>
    <text x="67" y="125" fill="#ffffff" font-family="Arial" font-size="11" text-anchor="middle">• Environment</text>
    <text x="67" y="150" fill="#ffffff" font-family="Arial" font-size="11" text-anchor="middle">• External Systems</text>
  </g>

  <!-- 2. Interaction -->
  <g transform="translate(175, 30)">
    <rect x="0" y="0" width="135" height="210" rx="8" fill="#328cc1"/>
    <text x="67" y="45" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Interaction</text>
    <line x1="15" y1="70" x2="120" y2="70" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
    <text x="67" y="100" fill="#ffffff" font-family="Arial" font-size="11" text-anchor="middle">• User-to-System</text>
    <text x="67" y="125" fill="#ffffff" font-family="Arial" font-size="11" text-anchor="middle">• Component-to-</text>
    <text x="67" y="140" fill="#ffffff" font-family="Arial" font-size="11" text-anchor="middle">Component</text>
    <text x="67" y="165" fill="#ffffff" font-family="Arial" font-size="11" text-anchor="middle">• Use Case / Seq.</text>
  </g>

  <!-- 3. Structural -->
  <g transform="translate(330, 30)">
    <rect x="0" y="0" width="135" height="210" rx="8" fill="#0b3c5d"/>
    <text x="67" y="45" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Structural</text>
    <line x1="15" y1="70" x2="120" y2="70" stroke="#328cc1" stroke-width="1"/>
    <text x="67" y="100" fill="#ffffff" font-family="Arial" font-size="11" text-anchor="middle">• Class Diagrams</text>
    <text x="67" y="125" fill="#ffffff" font-family="Arial" font-size="11" text-anchor="middle">• Data Models</text>
    <text x="67" y="150" fill="#ffffff" font-family="Arial" font-size="11" text-anchor="middle">• Associations &amp;</text>
    <text x="67" y="165" fill="#ffffff" font-family="Arial" font-size="11" text-anchor="middle">Aggregation</text>
  </g>

  <!-- 4. Behavioral -->
  <g transform="translate(485, 30)">
    <rect x="0" y="0" width="135" height="210" rx="8" fill="#328cc1"/>
    <text x="67" y="45" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Behavioral</text>
    <line x1="15" y1="70" x2="120" y2="70" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
    <text x="67" y="100" fill="#ffffff" font-family="Arial" font-size="11" text-anchor="middle">• Dynamic Response</text>
    <text x="67" y="125" fill="#ffffff" font-family="Arial" font-size="11" text-anchor="middle">• Events &amp; Stimuli</text>
    <text x="67" y="150" fill="#ffffff" font-family="Arial" font-size="11" text-anchor="middle">• State Diagrams</text>
  </g>
</svg>