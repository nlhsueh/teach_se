<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="120" height="120">
  <!-- Redesigned professional cost savings logo -->
  <!-- Background shield representing protection -->
  <path d="M12 2L3 5v6c0 5.5 3.8 10.7 9 12 5.2-1.3 9-6.5 9-12V5l-9-3z" fill="#0b3c5d" opacity="0.1"/>
  <path d="M12 2L3 5v6c0 5.5 3.8 10.7 9 12 5.2-1.3 9-6.5 9-12V5l-9-3z" fill="none" stroke="#0b3c5d" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Stack of Coins -->
  <ellipse cx="12" cy="15" rx="4" ry="2" fill="#328cc1" opacity="0.8"/>
  <ellipse cx="12" cy="15" rx="4" ry="2" fill="none" stroke="#0b3c5d" stroke-width="1.5"/>
  <path d="M8 15v2c0 1.1 1.8 2 4 2s4-.9 4-2v-2" fill="none" stroke="#0b3c5d" stroke-width="1.5"/>
  <!-- Dollar Sign Card/Bill floating or on top -->
  <rect x="8" y="7" width="8" height="5" rx="1" fill="#328cc1" stroke="none" stroke-width="0"/>
  <text x="12" y="11" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="5" font-weight="bold" text-anchor="middle">$</text>
  <!-- Arrow pointing down representing cost reduction -->
  <path d="M18 6l-3 3h6z" fill="#328cc1"/>
  <line x1="18" y1="2" x2="18" y2="6" stroke="#328cc1" stroke-width="2" stroke-linecap="round"/>
</svg>
