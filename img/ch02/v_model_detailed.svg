<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <!-- Background matching slide backgroundColor #f5f5f5 -->
  <rect x="0" y="0" width="960" height="540" fill="#f5f5f5"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" fill="#0b3c5d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">The V-Model: Dual-Track Verification &amp; Validation</text>
  <text x="480" y="62" fill="#64748b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" text-anchor="middle">Extending Waterfall: Symmetrical test planning during specification, executed during integration</text>

  <!-- Left Header Banner: Verification (Decomposition) -->
  <rect x="50" y="80" width="380" height="30" rx="6" fill="#0b3c5d"/>
  <text x="240" y="100" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">VERIFICATION: Early Test Planning &amp; Design (Left Arm)</text>

  <!-- Right Header Banner: Validation (Testing & Integration) -->
  <rect x="530" y="80" width="380" height="30" rx="6" fill="#16a34a"/>
  <text x="720" y="100" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">VALIDATION: Test Execution &amp; Integration (Right Arm)</text>

  <!-- HORIZONTAL TRACEABILITY ARROWS (Connecting Left and Right) -->
  <!-- Level 1: Requirements <-> Acceptance Testing -->
  <path d="M 270 170 L 690 170" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="690,170 680,165 680,175" fill="#64748b"/>
  <polygon points="270,170 280,165 280,175" fill="#64748b"/>
  <rect x="400" y="158" width="160" height="24" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="480" y="174" fill="#0f172a" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Acceptance Test Plan</text>

  <!-- Level 2: Architecture <-> System Testing -->
  <path d="M 330 265 L 630 265" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="630,265 620,260 620,270" fill="#64748b"/>
  <polygon points="330,265 340,260 340,270" fill="#64748b"/>
  <rect x="405" y="253" width="150" height="24" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="480" y="269" fill="#0f172a" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">System Test Plan</text>

  <!-- Level 3: Detailed Design <-> Component Testing -->
  <path d="M 390 360 L 570 360" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="570,360 560,355 560,365" fill="#64748b"/>
  <polygon points="390,360 400,355 400,365" fill="#64748b"/>
  <rect x="410" y="348" width="140" height="24" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="480" y="364" fill="#0f172a" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Unit Test Cases</text>

  <!-- LEFT ARM (Descending) -->

  <!-- Left Step 1: Requirements -->
  <g transform="translate(50, 125)">
    <rect x="0" y="0" width="220" height="90" rx="8" fill="#ffffff" stroke="#0b3c5d" stroke-width="2"/>
    <rect x="0" y="0" width="220" height="26" rx="8" fill="#0b3c5d"/>
    <rect x="0" y="18" width="220" height="8" fill="#0b3c5d"/>
    <text x="110" y="18" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">1. User Requirements</text>
    <text x="110" y="44" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" text-anchor="middle">Customer Needs &amp; Constraints</text>
    <text x="110" y="60" fill="#64748b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9.5" text-anchor="middle">Defines "What" the system does</text>
    <rect x="15" y="68" width="190" height="16" rx="3" fill="#e0f2fe"/>
    <text x="110" y="80" fill="#0369a1" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">📄 SRS &amp; Acceptance Criteria</text>
  </g>

  <!-- Left Down Arrow 1 to 2 -->
  <path d="M 160 215 L 205 240" fill="none" stroke="#0b3c5d" stroke-width="3"/>
  <polygon points="212,244 199,242 204,233" fill="#0b3c5d"/>

  <!-- Left Step 2: System Architecture -->
  <g transform="translate(120, 220)">
    <rect x="0" y="0" width="210" height="90" rx="8" fill="#ffffff" stroke="#0b3c5d" stroke-width="2"/>
    <rect x="0" y="0" width="210" height="26" rx="8" fill="#0b3c5d"/>
    <rect x="0" y="18" width="210" height="8" fill="#0b3c5d"/>
    <text x="105" y="18" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">2. System Architecture</text>
    <text x="105" y="44" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" text-anchor="middle">Subsystems &amp; Interface Specs</text>
    <text x="105" y="60" fill="#64748b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9.5" text-anchor="middle">High-level architectural design</text>
    <rect x="15" y="68" width="180" height="16" rx="3" fill="#e0f2fe"/>
    <text x="105" y="80" fill="#0369a1" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">📐 System Design &amp; API Specs</text>
  </g>

  <!-- Left Down Arrow 2 to 3 -->
  <path d="M 225 310 L 270 335" fill="none" stroke="#0b3c5d" stroke-width="3"/>
  <polygon points="277,339 264,337 269,328" fill="#0b3c5d"/>

  <!-- Left Step 3: Detailed Design -->
  <g transform="translate(190, 315)">
    <rect x="0" y="0" width="200" height="90" rx="8" fill="#ffffff" stroke="#0b3c5d" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="26" rx="8" fill="#0b3c5d"/>
    <rect x="0" y="18" width="200" height="8" fill="#0b3c5d"/>
    <text x="100" y="18" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">3. Detailed Design</text>
    <text x="100" y="44" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" text-anchor="middle">Class Diagrams, Logic, DB</text>
    <text x="100" y="60" fill="#64748b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9.5" text-anchor="middle">Low-level module specifications</text>
    <rect x="15" y="68" width="170" height="16" rx="3" fill="#e0f2fe"/>
    <text x="100" y="80" fill="#0369a1" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">🧩 Component Specifications</text>
  </g>

  <!-- Left Down Arrow 3 to Center -->
  <path d="M 290 405 L 365 440" fill="none" stroke="#0b3c5d" stroke-width="3"/>
  <polygon points="372,443 359,442 364,432" fill="#0b3c5d"/>

  <!-- VERTEX: Coding / Implementation -->
  <g transform="translate(370, 425)">
    <rect x="0" y="0" width="220" height="80" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="3"/>
    <rect x="0" y="0" width="220" height="26" rx="10" fill="#f59e0b"/>
    <rect x="0" y="16" width="220" height="10" fill="#f59e0b"/>
    <text x="110" y="18" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">4. Implementation (Coding)</text>
    <text x="110" y="44" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" text-anchor="middle">Source Code Writing &amp; Compiling</text>
    <text x="110" y="64" fill="#b45309" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">💻 The Vertex: Transition Point</text>
  </g>

  <!-- Right Up Arrow Center to 5 -->
  <path d="M 590 440 L 665 405" fill="none" stroke="#16a34a" stroke-width="3"/>
  <polygon points="672,402 667,412 662,403" fill="#16a34a"/>

  <!-- RIGHT ARM (Ascending) -->

  <!-- Right Step 5: Unit Testing -->
  <g transform="translate(570, 315)">
    <rect x="0" y="0" width="200" height="90" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="26" rx="8" fill="#16a34a"/>
    <rect x="0" y="18" width="200" height="8" fill="#16a34a"/>
    <text x="100" y="18" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">5. Unit Testing</text>
    <text x="100" y="44" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" text-anchor="middle">Isolated Component Testing</text>
    <text x="100" y="60" fill="#64748b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9.5" text-anchor="middle">Verifies against Detailed Design</text>
    <rect x="15" y="68" width="170" height="16" rx="3" fill="#dcfce7"/>
    <text x="100" y="80" fill="#15803d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">🧪 Unit Passes &amp; Code Coverage</text>
  </g>

  <!-- Right Up Arrow 5 to 6 -->
  <path d="M 670 315 L 715 290" fill="none" stroke="#16a34a" stroke-width="3"/>
  <polygon points="722,286 717,296 712,287" fill="#16a34a"/>

  <!-- Right Step 6: Integration & System Testing -->
  <g transform="translate(630, 220)">
    <rect x="0" y="0" width="210" height="90" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <rect x="0" y="0" width="210" height="26" rx="8" fill="#16a34a"/>
    <rect x="0" y="18" width="210" height="8" fill="#16a34a"/>
    <text x="105" y="18" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">6. Integration Testing</text>
    <text x="105" y="44" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" text-anchor="middle">Subsystem &amp; Interface Testing</text>
    <text x="105" y="60" fill="#64748b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9.5" text-anchor="middle">Verifies against System Design</text>
    <rect x="15" y="68" width="180" height="16" rx="3" fill="#dcfce7"/>
    <text x="105" y="80" fill="#15803d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">🔗 API &amp; Protocol Verification</text>
  </g>

  <!-- Right Up Arrow 6 to 7 -->
  <path d="M 735 220 L 780 195" fill="none" stroke="#16a34a" stroke-width="3"/>
  <polygon points="787,191 782,201 777,192" fill="#16a34a"/>

  <!-- Right Step 7: Acceptance Testing -->
  <g transform="translate(690, 125)">
    <rect x="0" y="0" width="220" height="90" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <rect x="0" y="0" width="220" height="26" rx="8" fill="#16a34a"/>
    <rect x="0" y="18" width="220" height="8" fill="#16a34a"/>
    <text x="110" y="18" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">7. Acceptance Testing</text>
    <text x="110" y="44" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" text-anchor="middle">User Validation &amp; Alpha/Beta</text>
    <text x="110" y="60" fill="#64748b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9.5" text-anchor="middle">Validates against User Requirements</text>
    <rect x="15" y="68" width="190" height="16" rx="3" fill="#dcfce7"/>
    <text x="110" y="80" fill="#15803d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">🚀 Verified Shippable Release</text>
  </g>

  <!-- Bottom Insight Footer -->
  <rect x="50" y="510" width="860" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="480" y="525" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">
    <tspan fill="#0b3c5d">Core Innovation:</tspan> Test plans are drafted on the left while writing specifications, eliminating late testing surprises!
  </text>
</svg>
