<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <!-- Background matching slide backgroundColor #f5f5f5 -->
  <rect x="0" y="0" width="960" height="540" fill="#f5f5f5"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" fill="#0b3c5d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Incremental vs. Iterative: The Mona Lisa Analogy</text>
  <text x="480" y="52" fill="#64748b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="middle">Jeff Patton's classic analogy illustrating staged piece-by-piece completion vs. progressive layered refinement</text>

  <!-- ================= TOP SECTION: INCREMENTAL ================= -->
  <g transform="translate(40, 68)">
    <!-- Section Container -->
    <rect x="0" y="0" width="880" height="205" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="880" height="26" rx="8" fill="#0284c7"/>
    <rect x="0" y="16" width="880" height="10" fill="#0284c7"/>
    <text x="20" y="18" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold">INCREMENTAL APPROACH: Staged Piece-by-Piece Assembly</text>
    <text x="860" y="18" fill="#e0f2fe" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" text-anchor="end">Building 100% of part 1, then part 2...</text>

    <!-- Canvas 1: Only Head -->
    <g transform="translate(35, 38)">
      <!-- Canvas Frame -->
      <rect x="0" y="0" width="180" height="120" rx="4" fill="#fafafa" stroke="#94a3b8" stroke-width="1.5"/>
      <rect x="6" y="6" width="168" height="108" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
      
      <!-- Painted Head ONLY -->
      <path d="M 65 32 Q 90 12 115 32 Q 120 50 115 68 Q 90 78 65 68 Q 60 50 65 32 Z" fill="#2d1e18"/>
      <!-- Face -->
      <ellipse cx="90" cy="46" rx="18" ry="22" fill="#fed7aa"/>
      <!-- Eyes & Smile -->
      <ellipse cx="83" cy="43" rx="2" ry="1.5" fill="#451a03"/>
      <ellipse cx="97" cy="43" rx="2" ry="1.5" fill="#451a03"/>
      <path d="M 85 54 Q 90 58 95 54" fill="none" stroke="#78350f" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Veil -->
      <path d="M 70 30 Q 90 20 110 30 Q 115 60 108 72 Q 90 65 72 72 Z" fill="#1c1917" opacity="0.6"/>

      <!-- Blank rest of canvas callout -->
      <text x="90" y="96" fill="#94a3b8" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">[Blank Canvas: No Body / Scene]</text>

      <!-- Label -->
      <rect x="15" y="128" width="150" height="22" rx="4" fill="#e0f2fe"/>
      <text x="90" y="143" fill="#0369a1" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Step 1: Finished Head (100%)</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path d="M 235 98 L 265 98" fill="none" stroke="#0284c7" stroke-width="2.5"/>
    <polygon points="270,98 260,93 260,103" fill="#0284c7"/>

    <!-- Canvas 2: Head + Torso -->
    <g transform="translate(290, 38)">
      <rect x="0" y="0" width="180" height="120" rx="4" fill="#fafafa" stroke="#94a3b8" stroke-width="1.5"/>
      <rect x="6" y="6" width="168" height="108" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
      
      <!-- Head -->
      <path d="M 65 32 Q 90 12 115 32 Q 120 50 115 68 Q 90 78 65 68 Q 60 50 65 32 Z" fill="#2d1e18"/>
      <ellipse cx="90" cy="46" rx="18" ry="22" fill="#fed7aa"/>
      <ellipse cx="83" cy="43" rx="2" ry="1.5" fill="#451a03"/>
      <ellipse cx="97" cy="43" rx="2" ry="1.5" fill="#451a03"/>
      <path d="M 85 54 Q 90 58 95 54" fill="none" stroke="#78350f" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 70 30 Q 90 20 110 30 Q 115 60 108 72 Q 90 65 72 72 Z" fill="#1c1917" opacity="0.6"/>

      <!-- Torso & Dress (Painted) -->
      <path d="M 60 68 L 120 68 L 140 114 L 40 114 Z" fill="#3f3f46"/>
      <!-- Crossed Hands -->
      <ellipse cx="90" cy="106" rx="24" ry="7" fill="#fed7aa"/>

      <!-- Blank background callout -->
      <text x="145" y="45" fill="#94a3b8" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="bold">[No scene]</text>

      <!-- Label -->
      <rect x="15" y="128" width="150" height="22" rx="4" fill="#e0f2fe"/>
      <text x="90" y="143" fill="#0369a1" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Step 2: Head + Torso</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <path d="M 490 98 L 520 98" fill="none" stroke="#0284c7" stroke-width="2.5"/>
    <polygon points="525,98 515,93 515,103" fill="#0284c7"/>

    <!-- Canvas 3: Complete Mona Lisa -->
    <g transform="translate(545, 38)">
      <rect x="0" y="0" width="180" height="120" rx="4" fill="#fafafa" stroke="#0284c7" stroke-width="2"/>
      
      <!-- Full background landscape -->
      <rect x="6" y="6" width="168" height="50" fill="#93c5fd"/>
      <path d="M 6 45 Q 50 30 90 42 Q 130 25 174 48 L 174 114 L 6 114 Z" fill="#84cc16" opacity="0.7"/>
      <path d="M 6 56 Q 60 46 110 54 L 174 56 L 174 114 L 6 114 Z" fill="#65a30d"/>

      <!-- Head -->
      <path d="M 65 32 Q 90 12 115 32 Q 120 50 115 68 Q 90 78 65 68 Q 60 50 65 32 Z" fill="#2d1e18"/>
      <ellipse cx="90" cy="46" rx="18" ry="22" fill="#fed7aa"/>
      <ellipse cx="83" cy="43" rx="2" ry="1.5" fill="#451a03"/>
      <ellipse cx="97" cy="43" rx="2" ry="1.5" fill="#451a03"/>
      <path d="M 85 54 Q 90 58 95 54" fill="none" stroke="#78350f" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 70 30 Q 90 20 110 30 Q 115 60 108 72 Q 90 65 72 72 Z" fill="#1c1917" opacity="0.6"/>

      <!-- Torso & Hands -->
      <path d="M 60 68 L 120 68 L 140 114 L 40 114 Z" fill="#3f3f46"/>
      <ellipse cx="90" cy="106" rx="24" ry="7" fill="#fed7aa"/>

      <!-- Label -->
      <rect x="15" y="128" width="150" height="22" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="90" y="143" fill="#15803d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Step 3: Complete Painting</text>
    </g>

    <!-- Side Analysis Callout -->
    <g transform="translate(745, 42)">
      <rect x="0" y="0" width="120" height="135" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="60" y="20" fill="#0b3c5d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">Key Insight</text>
      <text x="10" y="42" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9.5">• Finished in chunks</text>
      <text x="10" y="60" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9.5">• Head alone has</text>
      <text x="14" y="74" fill="#ef4444" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="bold">zero holistic value</text>
      <text x="10" y="94" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9.5">• Customer can't judge</text>
      <text x="10" y="108" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9.5">composition early</text>
      <text x="10" y="124" fill="#dc2626" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="bold">⚠️ High late-stage risk</text>
    </g>

    <!-- Bottom summary line -->
    <text x="440" y="192" fill="#64748b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" text-anchor="middle">Each step produces a 100% finished slice, but the customer cannot evaluate the overall system until the final piece is delivered.</text>
  </g>

  <!-- ================= BOTTOM SECTION: ITERATIVE ================= -->
  <g transform="translate(40, 288)">
    <!-- Section Container -->
    <rect x="0" y="0" width="880" height="235" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="880" height="26" rx="8" fill="#d97706"/>
    <rect x="0" y="16" width="880" height="10" fill="#d97706"/>
    <text x="20" y="18" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold">ITERATIVE APPROACH: Progressive Refinement &amp; Polish</text>
    <text x="860" y="18" fill="#fef3c7" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" text-anchor="end">Starting with full rough sketch, then refining layers across cycles</text>

    <!-- Canvas 1: Rough Sketch -->
    <g transform="translate(35, 38)">
      <rect x="0" y="0" width="180" height="120" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
      
      <!-- Pencil Sketch of ENTIRE composition -->
      <path d="M 6 52 Q 60 42 110 50 L 174 54" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,2"/>
      <!-- Head outline -->
      <ellipse cx="90" cy="46" rx="18" ry="22" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,2"/>
      <path d="M 65 32 Q 90 15 115 32 Q 120 50 115 68" fill="none" stroke="#64748b" stroke-width="1.2"/>
      <!-- Eyes & Smile sketch -->
      <line x1="81" y1="43" x2="85" y2="43" stroke="#64748b" stroke-width="1.2"/>
      <line x1="95" y1="43" x2="99" y2="43" stroke="#64748b" stroke-width="1.2"/>
      <path d="M 85 54 Q 90 57 95 54" fill="none" stroke="#64748b" stroke-width="1.2"/>
      <!-- Torso sketch -->
      <path d="M 62 68 L 118 68 L 138 114 L 42 114 Z" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,2"/>
      <ellipse cx="90" cy="106" rx="24" ry="7" fill="none" stroke="#64748b" stroke-width="1.2"/>

      <!-- Feedback note -->
      <text x="90" y="86" fill="#64748b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-style="italic" text-anchor="middle">[Entire composition visible]</text>

      <!-- Label -->
      <rect x="15" y="128" width="150" height="22" rx="4" fill="#fef3c7"/>
      <text x="90" y="143" fill="#b45309" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Cycle 1: Rough Sketch (MVP)</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path d="M 235 98 L 265 98" fill="none" stroke="#d97706" stroke-width="2.5"/>
    <polygon points="270,98 260,93 260,103" fill="#d97706"/>

    <!-- Canvas 2: Color Underpainting -->
    <g transform="translate(290, 38)">
      <rect x="0" y="0" width="180" height="120" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
      
      <!-- Underpainting wash (soft tones) -->
      <rect x="6" y="6" width="168" height="48" fill="#bae6fd" opacity="0.5"/>
      <path d="M 6 45 Q 50 32 90 42 Q 130 28 174 48 L 174 114 L 6 114 Z" fill="#bef264" opacity="0.4"/>
      
      <!-- Head with flat color -->
      <path d="M 65 32 Q 90 12 115 32 Q 120 50 115 68 Q 90 78 65 68 Z" fill="#78716c"/>
      <ellipse cx="90" cy="46" rx="18" ry="22" fill="#fed7aa" opacity="0.8"/>
      <ellipse cx="83" cy="43" rx="1.5" ry="1.2" fill="#451a03"/>
      <ellipse cx="97" cy="43" rx="1.5" ry="1.2" fill="#451a03"/>
      <path d="M 85 54 Q 90 57 95 54" fill="none" stroke="#78350f" stroke-width="1.2"/>
      <!-- Torso with base color -->
      <path d="M 60 68 L 120 68 L 140 114 L 40 114 Z" fill="#71717a"/>
      <ellipse cx="90" cy="106" rx="24" ry="7" fill="#fed7aa" opacity="0.8"/>

      <!-- Label -->
      <rect x="15" y="128" width="150" height="22" rx="4" fill="#fef3c7"/>
      <text x="90" y="143" fill="#b45309" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Cycle 2: Color Underpainting</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <path d="M 490 98 L 520 98" fill="none" stroke="#d97706" stroke-width="2.5"/>
    <polygon points="525,98 515,93 515,103" fill="#d97706"/>

    <!-- Canvas 3: Polished Masterpiece -->
    <g transform="translate(545, 38)">
      <rect x="0" y="0" width="180" height="120" rx="4" fill="#fafafa" stroke="#16a34a" stroke-width="2"/>
      
      <!-- Full background landscape rich -->
      <rect x="6" y="6" width="168" height="50" fill="#93c5fd"/>
      <path d="M 6 45 Q 50 30 90 42 Q 130 25 174 48 L 174 114 L 6 114 Z" fill="#84cc16" opacity="0.8"/>
      <path d="M 6 56 Q 60 46 110 54 L 174 56 L 174 114 L 6 114 Z" fill="#65a30d"/>

      <!-- Head detailed -->
      <path d="M 65 32 Q 90 12 115 32 Q 120 50 115 68 Q 90 78 65 68 Q 60 50 65 32 Z" fill="#2d1e18"/>
      <ellipse cx="90" cy="46" rx="18" ry="22" fill="#fed7aa"/>
      <ellipse cx="83" cy="43" rx="2" ry="1.5" fill="#451a03"/>
      <ellipse cx="97" cy="43" rx="2" ry="1.5" fill="#451a03"/>
      <path d="M 85 54 Q 90 58 95 54" fill="none" stroke="#78350f" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 70 30 Q 90 20 110 30 Q 115 60 108 72 Q 90 65 72 72 Z" fill="#1c1917" opacity="0.6"/>

      <!-- Torso & Hands rich -->
      <path d="M 60 68 L 120 68 L 140 114 L 40 114 Z" fill="#3f3f46"/>
      <ellipse cx="90" cy="106" rx="24" ry="7" fill="#fed7aa"/>

      <!-- Label -->
      <rect x="15" y="128" width="150" height="22" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="90" y="143" fill="#15803d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Cycle 3: Final Masterpiece</text>
    </g>

    <!-- Side Analysis Callout -->
    <g transform="translate(745, 42)">
      <rect x="0" y="0" width="120" height="135" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="60" y="20" fill="#0b3c5d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">Key Insight</text>
      <text x="10" y="42" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9.5">• Full system visible</text>
      <text x="14" y="56" fill="#16a34a" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="bold">from Day One (MVP)</text>
      <text x="10" y="76" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9.5">• Customer validates</text>
      <text x="10" y="90" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9.5">posture &amp; smile early</text>
      <text x="10" y="110" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9.5">• Refines depth &amp; polish</text>
      <text x="10" y="124" fill="#15803d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="bold">✅ Low late-stage risk</text>
    </g>

    <!-- Bottom takeaway banner -->
    <rect x="25" y="180" width="830" height="42" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="440" y="198" fill="#b45309" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Core Rule: Incremental adds parts; Iterative refines quality.</text>
    <text x="440" y="214" fill="#475569" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" text-anchor="middle">In modern software engineering, we combine both: release an MVP early, then iteratively polish while incrementally adding modules!</text>
  </g>
</svg>
