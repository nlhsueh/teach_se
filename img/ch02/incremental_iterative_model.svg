<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <!-- Background matching slide backgroundColor #f5f5f5 -->
  <rect x="0" y="0" width="960" height="540" fill="#f5f5f5"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" fill="#0b3c5d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Incremental &amp; Iterative Development Process</text>
  <text x="480" y="62" fill="#64748b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" text-anchor="middle">Decomposing system into prioritized increments, developed and refined across successive cycles</text>

  <!-- Top Banner: Overall System Requirements & Backlog -->
  <g transform="translate(60, 80)">
    <rect x="0" y="0" width="840" height="42" rx="8" fill="#ffffff" stroke="#0b3c5d" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="42" rx="8" fill="#0b3c5d"/>
    <rect x="190" y="0" width="10" height="42" fill="#0b3c5d"/>
    <text x="100" y="26" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Overall System Scope</text>
    
    <!-- Partitioned feature blocks -->
    <rect x="220" y="8" width="180" height="26" rx="4" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="310" y="25" fill="#0369a1" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Priority 1: Core Foundation</text>

    <rect x="420" y="8" width="190" height="26" rx="4" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="515" y="25" fill="#b45309" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Priority 2: Business Logic</text>

    <rect x="630" y="8" width="190" height="26" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="725" y="25" fill="#475569" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Priority 3+: Advanced Enhancements</text>
  </g>

  <!-- Downward partition arrows -->
  <path d="M 200 122 L 200 150" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="4,3"/>
  <polygon points="200,155 195,145 205,145" fill="#0284c7"/>

  <path d="M 480 122 L 480 150" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="4,3"/>
  <polygon points="480,155 475,145 485,145" fill="#d97706"/>

  <path d="M 760 122 L 760 150" fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="4,3"/>
  <polygon points="760,155 755,145 765,145" fill="#475569"/>

  <!-- THREE INCREMENT CONTAINERS -->

  <!-- INCREMENT 1 -->
  <g transform="translate(60, 160)">
    <rect x="0" y="0" width="260" height="255" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <rect x="0" y="0" width="260" height="34" rx="10" fill="#0284c7"/>
    <rect x="0" y="22" width="260" height="12" fill="#0284c7"/>
    <text x="130" y="23" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">INCREMENT 1 (Release 1)</text>

    <!-- Mini SDLC Stages -->
    <rect x="25" y="46" width="210" height="28" rx="5" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
    <text x="130" y="64" fill="#0369a1" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">1. Requirements &amp; Architecture</text>

    <rect x="25" y="82" width="210" height="28" rx="5" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
    <text x="130" y="100" fill="#0369a1" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">2. Detailed Design &amp; Coding</text>

    <rect x="25" y="118" width="210" height="28" rx="5" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
    <text x="130" y="136" fill="#0369a1" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">3. Verification &amp; Unit Testing</text>

    <!-- Output Deliverable -->
    <rect x="20" y="158" width="220" height="42" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="130" y="177" fill="#047857" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">🚀 Working Software (MVP)</text>
    <text x="130" y="193" fill="#059669" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9.5" text-anchor="middle">Core Platform &amp; Essential Services</text>

    <!-- Customer Evaluation tag -->
    <rect x="20" y="208" width="220" height="34" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="130" y="224" fill="#1e40af" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">👤 Operational User Evaluation</text>
    <text x="130" y="236" fill="#64748b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8.5" text-anchor="middle">Early validation of critical assumptions</text>
  </g>

  <!-- Arrow Increment 1 -> 2 (Integration & Progression) -->
  <path d="M 320 287 L 348 287" fill="none" stroke="#0b3c5d" stroke-width="3"/>
  <polygon points="354,287 344,281 344,293" fill="#0b3c5d"/>

  <!-- INCREMENT 2 -->
  <g transform="translate(350, 160)">
    <rect x="0" y="0" width="260" height="255" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <rect x="0" y="0" width="260" height="34" rx="10" fill="#d97706"/>
    <rect x="0" y="22" width="260" height="12" fill="#d97706"/>
    <text x="130" y="23" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">INCREMENT 2 (Release 2)</text>

    <!-- Mini SDLC Stages -->
    <rect x="25" y="46" width="210" height="28" rx="5" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="130" y="64" fill="#b45309" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">1. Requirements Revision &amp; Design</text>

    <rect x="25" y="82" width="210" height="28" rx="5" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="130" y="100" fill="#b45309" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">2. Code New Modules &amp; Refine Inc 1</text>

    <rect x="25" y="118" width="210" height="28" rx="5" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="130" y="136" fill="#b45309" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">3. Regression &amp; Integration Test</text>

    <!-- Output Deliverable -->
    <rect x="20" y="158" width="220" height="42" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="130" y="177" fill="#047857" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">🚀 Working Software (v2.0)</text>
    <text x="130" y="193" fill="#059669" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9.5" text-anchor="middle">Inc 1 (Refined) + Inc 2 (New Modules)</text>

    <!-- Customer Evaluation tag -->
    <rect x="20" y="208" width="220" height="34" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="130" y="224" fill="#1e40af" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">👤 User &amp; Market Feedback Loop</text>
    <text x="130" y="236" fill="#64748b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8.5" text-anchor="middle">Incorporating learned user behavior</text>
  </g>

  <!-- Arrow Increment 2 -> 3 (Integration & Progression) -->
  <path d="M 610 287 L 638 287" fill="none" stroke="#0b3c5d" stroke-width="3"/>
  <polygon points="644,287 634,281 634,293" fill="#0b3c5d"/>

  <!-- INCREMENT 3 -->
  <g transform="translate(640, 160)">
    <rect x="0" y="0" width="260" height="255" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <rect x="0" y="0" width="260" height="34" rx="10" fill="#16a34a"/>
    <rect x="0" y="22" width="260" height="12" fill="#16a34a"/>
    <text x="130" y="23" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">INCREMENT 3 (Release 3)</text>

    <!-- Mini SDLC Stages -->
    <rect x="25" y="46" width="210" height="28" rx="5" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="130" y="64" fill="#15803d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">1. Final Scope Stabilization</text>

    <rect x="25" y="82" width="210" height="28" rx="5" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="130" y="100" fill="#15803d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">2. Advanced Features &amp; Polishing</text>

    <rect x="25" y="118" width="210" height="28" rx="5" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="130" y="136" fill="#15803d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">3. Full System &amp; Performance Test</text>

    <!-- Output Deliverable -->
    <rect x="20" y="158" width="220" height="42" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="130" y="177" fill="#047857" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">🚀 Mature System Release (v3.0)</text>
    <text x="130" y="193" fill="#059669" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9.5" text-anchor="middle">Full Functional Scope Operational</text>

    <!-- Customer Evaluation tag -->
    <rect x="20" y="208" width="220" height="34" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="130" y="224" fill="#1e40af" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">👤 Continuous Evolution / Ops</text>
    <text x="130" y="236" fill="#64748b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8.5" text-anchor="middle">Production maintenance &amp; monitoring</text>
  </g>

  <!-- Continuous Feedback Loop (Curving back from releases to requirements) -->
  <path d="M 270 380 Q 330 435 480 435 Q 630 435 770 380" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="6,4"/>
  <polygon points="480,435 470,430 470,440" fill="#ef4444"/>
  <rect x="340" y="423" width="280" height="24" rx="4" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
  <text x="480" y="439" fill="#dc2626" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">🔄 Empirical Feedback Steers Subsequent Increments</text>

  <!-- Bottom Differentiating Concept Bar -->
  <g transform="translate(60, 470)">
    <rect x="0" y="0" width="410" height="48" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="20" y="20" fill="#0369a1" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="bold">Incremental: Functional Staging</text>
    <text x="20" y="38" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5">Delivering functional subsets piece-by-piece to provide early user value.</text>

    <rect x="430" y="0" width="410" height="48" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="450" y="20" fill="#b45309" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="bold">Iterative: Progressive Refinement</text>
    <text x="450" y="38" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5">Revising and improving existing features based on continuous user feedback.</text>
  </g>
</svg>
