<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="480" rx="16" fill="#f8fafc"/>
  
  <!-- Header -->
  <text x="480" y="42" fill="#0b3c5d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">DevOps Continuous Integration &amp; Continuous Delivery (CI/CD) Pipeline</text>
  <text x="480" y="68" fill="#64748b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" text-anchor="middle">Automating the path from code commit to production operations with rapid feedback loops</text>

  <!-- Continuous Integration (CI) Box -->
  <rect x="40" y="95" width="410" height="230" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,4"/>
  <rect x="55" y="82" width="220" height="26" rx="6" fill="#3b82f6"/>
  <text x="165" y="100" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">CONTINUOUS INTEGRATION (CI)</text>

  <!-- CI Step 1: Code -->
  <g transform="translate(60, 130)">
    <rect x="0" y="0" width="105" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="105" height="32" rx="8" fill="#0b3c5d"/>
    <rect x="0" y="24" width="105" height="8" fill="#0b3c5d"/>
    <text x="52" y="21" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">1. Plan &amp; Code</text>
    <text x="52" y="58" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" text-anchor="middle">• Git Branching</text>
    <text x="52" y="78" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" text-anchor="middle">• Peer Review</text>
    <text x="52" y="98" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" text-anchor="middle">• Commit Code</text>
    <rect x="12" y="116" width="81" height="22" rx="4" fill="#e2e8f0"/>
    <text x="52" y="131" fill="#475569" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Developer</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 175 205 L 195 205" fill="none" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <!-- CI Step 2: Build -->
  <g transform="translate(200, 130)">
    <rect x="0" y="0" width="105" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="105" height="32" rx="8" fill="#0b3c5d"/>
    <rect x="0" y="24" width="105" height="8" fill="#0b3c5d"/>
    <text x="52" y="21" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">2. Auto Build</text>
    <text x="52" y="58" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" text-anchor="middle">• Compile Code</text>
    <text x="52" y="78" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" text-anchor="middle">• Dependencies</text>
    <text x="52" y="98" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" text-anchor="middle">• Static Linter</text>
    <rect x="12" y="116" width="81" height="22" rx="4" fill="#dbeafe"/>
    <text x="52" y="131" fill="#1d4ed8" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Fast Build</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 315 205 L 335 205" fill="none" stroke="#3b82f6" stroke-width="3"/>

  <!-- CI Step 3: Test -->
  <g transform="translate(340, 130)">
    <rect x="0" y="0" width="100" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="100" height="32" rx="8" fill="#0b3c5d"/>
    <rect x="0" y="24" width="100" height="8" fill="#0b3c5d"/>
    <text x="50" y="21" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">3. Auto Test</text>
    <text x="50" y="58" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" text-anchor="middle">• Unit Tests</text>
    <text x="50" y="78" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" text-anchor="middle">• Integration</text>
    <text x="50" y="98" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" text-anchor="middle">• Coverage &gt; 80%</text>
    <rect x="10" y="116" width="80" height="22" rx="4" fill="#dcfce7"/>
    <text x="50" y="131" fill="#15803d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Pass / Fail</text>
  </g>

  <!-- Arrow CI to CD -->
  <path d="M 455 205 L 485 205" fill="none" stroke="#0b3c5d" stroke-width="4"/>
  <polygon points="495,205 483,198 483,212" fill="#0b3c5d"/>

  <!-- Continuous Delivery / Deployment (CD) Box -->
  <rect x="505" y="95" width="415" height="230" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,4"/>
  <rect x="520" y="82" width="290" height="26" rx="6" fill="#16a34a"/>
  <text x="665" y="100" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">CONTINUOUS DELIVERY / DEPLOYMENT (CD)</text>

  <!-- CD Step 4: Package & Release -->
  <g transform="translate(525, 130)">
    <rect x="0" y="0" width="105" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="105" height="32" rx="8" fill="#328cc1"/>
    <rect x="0" y="24" width="105" height="8" fill="#328cc1"/>
    <text x="52" y="21" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">4. Release</text>
    <text x="52" y="58" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" text-anchor="middle">• Docker Image</text>
    <text x="52" y="78" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" text-anchor="middle">• Version Tag</text>
    <text x="52" y="98" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" text-anchor="middle">• Artifact Repo</text>
    <rect x="12" y="116" width="81" height="22" rx="4" fill="#fef3c7"/>
    <text x="52" y="131" fill="#b45309" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Shippable</text>
  </g>

  <!-- Arrow 4 -->
  <path d="M 640 205 L 660 205" fill="none" stroke="#16a34a" stroke-width="3"/>

  <!-- CD Step 5: Deploy -->
  <g transform="translate(665, 130)">
    <rect x="0" y="0" width="110" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="110" height="32" rx="8" fill="#328cc1"/>
    <rect x="0" y="24" width="110" height="8" fill="#328cc1"/>
    <text x="55" y="21" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">5. Deploy</text>
    <text x="55" y="58" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" text-anchor="middle">• Staging Env</text>
    <text x="55" y="78" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" text-anchor="middle">• Canary / Blue-Grn</text>
    <text x="55" y="98" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" text-anchor="middle">• Zero Downtime</text>
    <rect x="12" y="116" width="86" height="22" rx="4" fill="#dcfce7"/>
    <text x="55" y="131" fill="#15803d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Production</text>
  </g>

  <!-- Arrow 5 -->
  <path d="M 785 205 L 805 205" fill="none" stroke="#16a34a" stroke-width="3"/>

  <!-- CD Step 6: Monitor & Operate -->
  <g transform="translate(810, 130)">
    <rect x="0" y="0" width="95" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="95" height="32" rx="8" fill="#328cc1"/>
    <rect x="0" y="24" width="95" height="8" fill="#328cc1"/>
    <text x="47" y="21" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">6. Operate</text>
    <text x="47" y="58" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" text-anchor="middle">• APM Logs</text>
    <text x="47" y="78" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" text-anchor="middle">• Health Checks</text>
    <text x="47" y="98" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" text-anchor="middle">• Real User Telemetry</text>
    <rect x="10" y="116" width="75" height="22" rx="4" fill="#ede9fe"/>
    <text x="47" y="131" fill="#6d28d9" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Monitor</text>
  </g>

  <!-- Continuous Feedback Loop Arrow -->
  <path d="M 855 290 L 855 380 L 110 380 L 110 290" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="8,5"/>
  <polygon points="110,285 104,298 116,298" fill="#64748b"/>
  
  <rect x="360" y="365" width="240" height="30" rx="6" fill="#64748b"/>
  <text x="480" y="385" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Continuous Feedback Loop (Logs, Issues, Telemetry)</text>

  <!-- Key Distinction Banner at bottom -->
  <g transform="translate(60, 415)">
    <rect x="0" y="0" width="400" height="45" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="15" y="20" fill="#1e40af" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold">Continuous Delivery:</text>
    <text x="15" y="36" fill="#475569" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11">Code is always releasable; manual trigger to deploy.</text>
  </g>

  <g transform="translate(500, 415)">
    <rect x="0" y="0" width="400" height="45" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <text x="15" y="20" fill="#166534" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold">Continuous Deployment:</text>
    <text x="15" y="36" fill="#475569" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11">Fully automated pipeline: every passing build goes directly to production.</text>
  </g>
</svg>
