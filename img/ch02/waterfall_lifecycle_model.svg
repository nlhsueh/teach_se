<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <!-- Background matching slide backgroundColor #f5f5f5 -->
  <rect x="0" y="0" width="960" height="540" fill="#f5f5f5"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" fill="#0b3c5d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">The Classic Waterfall Process Model: Stage-Gates &amp; Realities</text>
  <text x="480" y="62" fill="#64748b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" text-anchor="middle">Linear-sequential life cycle governed by formal document handoffs, stage-gate reviews, and late feedback</text>

  <!-- Customer Visibility Gap (Top Banner) -->
  <rect x="235" y="82" width="510" height="34" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="490" y="104" fill="#b91c1c" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">⚠️ Customer Visibility Gap: Customer cannot see or evaluate working software during these phases!</text>

  <!-- Customer Engagement Points -->
  <rect x="40" y="82" width="170" height="34" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="125" y="104" fill="#15803d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">👤 Customer Involved (Specs)</text>

  <rect x="765" y="82" width="165" height="34" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="847" y="104" fill="#15803d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">👤 First Usable Delivery</text>

  <!-- Definitions / Phase Nodes (Steps 1 to 5) -->

  <!-- STEP 1: Requirements -->
  <g transform="translate(45, 135)">
    <rect x="0" y="0" width="180" height="95" rx="8" fill="#ffffff" stroke="#0b3c5d" stroke-width="2"/>
    <rect x="0" y="0" width="180" height="28" rx="8" fill="#0b3c5d"/>
    <rect x="0" y="20" width="180" height="8" fill="#0b3c5d"/>
    <text x="90" y="19" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">1. Requirements Analysis</text>
    <text x="90" y="46" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" text-anchor="middle">Elicitation &amp; Definition</text>
    <text x="90" y="62" fill="#64748b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" text-anchor="middle">What the system must do</text>
    <rect x="15" y="72" width="150" height="17" rx="3" fill="#e0f2fe"/>
    <text x="90" y="84" fill="#0369a1" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">📄 Deliverable: Signed SRS</text>
  </g>

  <!-- Downward Flow 1 to 2 -->
  <path d="M 135 230 L 135 255 L 225 255 L 225 240 L 225 255" fill="none" stroke="#328cc1" stroke-width="2.5"/>
  <!-- Stage Gate Badge 1 -->
  <g transform="translate(145, 238)">
    <rect x="0" y="0" width="75" height="18" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="37" y="13" fill="#b45309" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Sign-off Gate</text>
  </g>
  <polygon points="225,275 220,265 230,265" fill="#328cc1"/>

  <!-- STEP 2: Design -->
  <g transform="translate(225, 205)">
    <rect x="0" y="0" width="180" height="95" rx="8" fill="#ffffff" stroke="#0b3c5d" stroke-width="2"/>
    <rect x="0" y="0" width="180" height="28" rx="8" fill="#0b3c5d"/>
    <rect x="0" y="20" width="180" height="8" fill="#0b3c5d"/>
    <text x="90" y="19" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">2. System &amp; SW Design</text>
    <text x="90" y="46" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" text-anchor="middle">Architecture &amp; Interfaces</text>
    <text x="90" y="62" fill="#64748b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" text-anchor="middle">How the system is structured</text>
    <rect x="15" y="72" width="150" height="17" rx="3" fill="#e0f2fe"/>
    <text x="90" y="84" fill="#0369a1" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">📐 Deliverable: Design Spec</text>
  </g>

  <!-- Downward Flow 2 to 3 -->
  <path d="M 315 300 L 315 325 L 405 325" fill="none" stroke="#328cc1" stroke-width="2.5"/>
  <!-- Stage Gate Badge 2 -->
  <g transform="translate(325, 308)">
    <rect x="0" y="0" width="75" height="18" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="37" y="13" fill="#b45309" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Sign-off Gate</text>
  </g>
  <polygon points="405,345 400,335 410,335" fill="#328cc1"/>

  <!-- STEP 3: Implementation -->
  <g transform="translate(405, 275)">
    <rect x="0" y="0" width="180" height="95" rx="8" fill="#ffffff" stroke="#0b3c5d" stroke-width="2"/>
    <rect x="0" y="0" width="180" height="28" rx="8" fill="#0b3c5d"/>
    <rect x="0" y="20" width="180" height="8" fill="#0b3c5d"/>
    <text x="90" y="19" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">3. Implementation</text>
    <text x="90" y="46" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" text-anchor="middle">Coding &amp; Unit Testing</text>
    <text x="90" y="62" fill="#64748b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" text-anchor="middle">Translating design to code</text>
    <rect x="15" y="72" width="150" height="17" rx="3" fill="#e0f2fe"/>
    <text x="90" y="84" fill="#0369a1" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">💻 Deliverable: Unit Modules</text>
  </g>

  <!-- Downward Flow 3 to 4 -->
  <path d="M 495 370 L 495 395 L 585 395" fill="none" stroke="#328cc1" stroke-width="2.5"/>
  <!-- Stage Gate Badge 3 -->
  <g transform="translate(505, 378)">
    <rect x="0" y="0" width="75" height="18" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="37" y="13" fill="#b45309" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Sign-off Gate</text>
  </g>
  <polygon points="585,415 580,405 590,405" fill="#328cc1"/>

  <!-- STEP 4: Integration & Testing -->
  <g transform="translate(585, 345)">
    <rect x="0" y="0" width="180" height="95" rx="8" fill="#ffffff" stroke="#0b3c5d" stroke-width="2"/>
    <rect x="0" y="0" width="180" height="28" rx="8" fill="#0b3c5d"/>
    <rect x="0" y="20" width="180" height="8" fill="#0b3c5d"/>
    <text x="90" y="19" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">4. Integration &amp; Testing</text>
    <text x="90" y="46" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" text-anchor="middle">V&amp;V and System Testing</text>
    <text x="90" y="62" fill="#64748b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" text-anchor="middle">Verifying against SRS</text>
    <rect x="15" y="72" width="150" height="17" rx="3" fill="#e0f2fe"/>
    <text x="90" y="84" fill="#0369a1" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">🧪 Deliverable: Test Report</text>
  </g>

  <!-- Downward Flow 4 to 5 -->
  <path d="M 675 440 L 675 465 L 765 465" fill="none" stroke="#328cc1" stroke-width="2.5"/>
  <!-- Stage Gate Badge 4 -->
  <g transform="translate(685, 448)">
    <rect x="0" y="0" width="75" height="18" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="37" y="13" fill="#b45309" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Sign-off Gate</text>
  </g>
  <polygon points="765,485 760,475 770,475" fill="#328cc1"/>

  <!-- STEP 5: Operation & Maintenance -->
  <g transform="translate(765, 415)">
    <rect x="0" y="0" width="165" height="95" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <rect x="0" y="0" width="165" height="28" rx="8" fill="#16a34a"/>
    <rect x="0" y="20" width="165" height="8" fill="#16a34a"/>
    <text x="82" y="19" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">5. Maintenance</text>
    <text x="82" y="46" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" text-anchor="middle">Deployment &amp; Patches</text>
    <text x="82" y="62" fill="#64748b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" text-anchor="middle">Longest phase (&gt;60% cost)</text>
    <rect x="12" y="72" width="141" height="17" rx="3" fill="#dcfce7"/>
    <text x="82" y="84" fill="#15803d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">🚀 Working Software Released</text>
  </g>

  <!-- UNPLANNED BACKTRACKING ARROWS (Addressing Q2: Can we go back?) -->
  <!-- Backtracking from Testing to Design -->
  <path d="M 630 345 C 570 230, 420 230, 375 230" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,4"/>
  <polygon points="368,230 378,225 378,235" fill="#ef4444"/>

  <!-- Backtracking from Testing to Requirements -->
  <path d="M 660 345 C 580 150, 300 150, 195 150" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,4"/>
  <polygon points="188,150 198,145 198,155" fill="#ef4444"/>

  <!-- Backtracking Callout Box -->
  <g transform="translate(340, 140)">
    <rect x="0" y="0" width="280" height="42" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="140" y="17" fill="#b91c1c" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">⚠️ Unplanned Backtracking Loop ("Backtracking Tax")</text>
    <text x="140" y="32" fill="#7f1d1d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9.5" text-anchor="middle">Defects found in Phase 4 force costly document &amp; code rewrites!</text>
  </g>

  <!-- Summary Footer Note (Q1 & Definition) -->
  <g transform="translate(45, 518)">
    <text x="0" y="12" fill="#475569" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5">
      <tspan font-weight="bold" fill="#0b3c5d">Core Rule (Q1):</tspan> Phases communicate strictly via formal signed documents.  
      <tspan font-weight="bold" fill="#b91c1c">Limitation (Q2 &amp; Q3):</tspan> Backtracking incurs huge costs ($50×–100×); working software is unseen until testing.
    </text>
  </g>
</svg>
