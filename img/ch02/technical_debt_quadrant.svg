<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Clean Background -->
  <rect x="0" y="0" width="960" height="540" fill="#f8fafc"/>

  <!-- Main Title -->
  <text x="480" y="44" fill="#0f172a" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="800" text-anchor="middle">
    The Technical Debt Quadrant
  </text>
  <text x="480" y="70" fill="#64748b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" text-anchor="middle">
    Martin Fowler's classification of architectural trade-offs along two dimensions
  </text>

  <!-- Horizontal Axis Header (DELIBERATE vs INADVERTENT) -->
  <g transform="translate(130, 92)">
    <!-- Deliberate column header -->
    <rect x="0" y="0" width="375" height="34" rx="6" fill="#e2e8f0"/>
    <text x="187" y="22" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
      DELIBERATE (Conscious Choice)
    </text>

    <!-- Inadvertent column header -->
    <rect x="400" y="0" width="375" height="34" rx="6" fill="#e2e8f0"/>
    <text x="587" y="22" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
      INADVERTENT (Accidental / Unaware)
    </text>
  </g>

  <!-- Vertical Axis Header (PRUDENT vs RECKLESS) -->
  <g transform="translate(50, 136)">
    <!-- PRUDENT label -->
    <rect x="0" y="0" width="65" height="175" rx="6" fill="#e2e8f0"/>
    <text x="32" y="88" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" transform="rotate(-90, 32, 88)">
      PRUDENT
    </text>

    <!-- RECKLESS label -->
    <rect x="0" y="195" width="65" height="175" rx="6" fill="#e2e8f0"/>
    <text x="32" y="282" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" transform="rotate(-90, 32, 282)">
      RECKLESS
    </text>
  </g>

  <!-- ================= QUADRANT CARDS ================= -->

  <!-- Top-Left: Deliberate & Prudent -->
  <g transform="translate(130, 136)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="375" height="175" rx="10" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
    
    <!-- Top banner badge -->
    <rect x="0" y="0" width="375" height="38" rx="10" fill="#dcfce7"/>
    <rect x="0" y="24" width="375" height="14" fill="#dcfce7"/>
    <text x="20" y="24" fill="#15803d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700">
      Deliberate &amp; Prudent
    </text>
    <rect x="260" y="8" width="100" height="22" rx="11" fill="#22c55e"/>
    <text x="310" y="23" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">
      Strategic Loan
    </text>

    <!-- Core Quote -->
    <text x="20" y="72" fill="#14532d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" font-style="italic">
      "We must ship now and deal with
    </text>
    <text x="20" y="94" fill="#14532d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" font-style="italic">
      the consequences later."
    </text>

    <!-- Key Takeaway -->
    <text x="20" y="132" fill="#475569" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13">
      • Deliberate business decision to reach market.
    </text>
    <text x="20" y="152" fill="#16a34a" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600">
      ✓ Healthy if tracked and repaid in next sprint.
    </text>
  </g>

  <!-- Top-Right: Inadvertent & Prudent -->
  <g transform="translate(530, 136)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="375" height="175" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    
    <!-- Top banner badge -->
    <rect x="0" y="0" width="375" height="38" rx="10" fill="#dbeafe"/>
    <rect x="0" y="24" width="375" height="14" fill="#dbeafe"/>
    <text x="20" y="24" fill="#1d4ed8" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700">
      Inadvertent &amp; Prudent
    </text>
    <rect x="250" y="8" width="110" height="22" rx="11" fill="#3b82f6"/>
    <text x="305" y="23" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">
      Learning Curve
    </text>

    <!-- Core Quote -->
    <text x="20" y="72" fill="#1e3a8a" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" font-style="italic">
      "Now we know how we should
    </text>
    <text x="20" y="94" fill="#1e3a8a" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" font-style="italic">
      have designed it."
    </text>

    <!-- Key Takeaway -->
    <text x="20" y="132" fill="#475569" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13">
      • Domain insights discovered through shipping.
    </text>
    <text x="20" y="152" fill="#2563eb" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600">
      ✓ Natural evolution — fixed via continuous refactoring.
    </text>
  </g>

  <!-- Bottom-Left: Deliberate & Reckless -->
  <g transform="translate(130, 331)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="375" height="175" rx="10" fill="#ffffff" stroke="#f97316" stroke-width="2"/>
    
    <!-- Top banner badge -->
    <rect x="0" y="0" width="375" height="38" rx="10" fill="#ffedd5"/>
    <rect x="0" y="24" width="375" height="14" fill="#ffedd5"/>
    <text x="20" y="24" fill="#c2410c" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700">
      Deliberate &amp; Reckless
    </text>
    <rect x="250" y="8" width="110" height="22" rx="11" fill="#f97316"/>
    <text x="305" y="23" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">
      Toxic Shortcuts
    </text>

    <!-- Core Quote -->
    <text x="20" y="72" fill="#7c2d12" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" font-style="italic">
      "We don't have time for design
    </text>
    <text x="20" y="94" fill="#7c2d12" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" font-style="italic">
      or automated tests!"
    </text>

    <!-- Key Takeaway -->
    <text x="20" y="132" fill="#475569" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13">
      • Rushing features out without basic engineering discipline.
    </text>
    <text x="20" y="152" fill="#ea580c" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600">
      ⚠️ High Hazard — leads directly to "Flaccid Scrum".
    </text>
  </g>

  <!-- Bottom-Right: Inadvertent & Reckless -->
  <g transform="translate(530, 331)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="375" height="175" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
    
    <!-- Top banner badge -->
    <rect x="0" y="0" width="375" height="38" rx="10" fill="#fee2e2"/>
    <rect x="0" y="24" width="375" height="14" fill="#fee2e2"/>
    <text x="20" y="24" fill="#b91c1c" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700">
      Inadvertent &amp; Reckless
    </text>
    <rect x="250" y="8" width="110" height="22" rx="11" fill="#ef4444"/>
    <text x="305" y="23" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">
      Blind Ignorance
    </text>

    <!-- Core Quote -->
    <text x="20" y="72" fill="#7f1d1d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" font-style="italic">
      "What is Layering?
    </text>
    <text x="20" y="94" fill="#7f1d1d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" font-style="italic">
      Just copy-paste the code."
    </text>

    <!-- Key Takeaway -->
    <text x="20" y="132" fill="#475569" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13">
      • Team lacks software engineering foundations.
    </text>
    <text x="20" y="152" fill="#dc2626" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600">
      ❌ Fatal — requires heavy training or total rewrite.
    </text>
  </g>

  <!-- Bottom Takeaway -->
  <text x="480" y="525" fill="#64748b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-style="italic" text-anchor="middle">
    Key Insight: Technical debt is acceptable only when deliberate and prudent with a committed repayment plan.
  </text>
</svg>
