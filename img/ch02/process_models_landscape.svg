<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 580" width="540" height="580">
  <defs>
    <linearGradient id="spectrumGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="35%" stop-color="#d97706"/>
      <stop offset="70%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="cardShadow" x="-3%" y="-4%" width="106%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="540" height="580" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="270" y="32" fill="#0f172a" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Process Models Spectrum</text>
  <text x="270" y="50" fill="#64748b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11.5" text-anchor="middle">From Predictive Governance to Continuous Adaptability</text>

  <g transform="translate(30, 64)">
    <rect x="0" y="6" width="480" height="8" rx="4" fill="url(#spectrumGrad)"/>
    <circle cx="10" cy="10" r="4" fill="#0284c7"/>
    <circle cx="470" cy="10" r="4" fill="#7c3aed"/>
    <polygon points="480,10 472,6 472,14" fill="#7c3aed"/>
    <text x="0" y="-1" fill="#0284c7" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700">PREDICTIVE / PLAN-DRIVEN</text>
    <text x="480" y="-1" fill="#7c3aed" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" text-anchor="end">ADAPTIVE / CONTINUOUS</text>
  </g>

  <g transform="translate(30, 96)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="480" height="100" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="100" rx="3" fill="#0284c7"/>
    <rect x="18" y="12" width="28" height="28" rx="6" fill="#0284c7"/>
    <text x="32" y="30" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">1</text>
    <text x="56" y="25" fill="#0369a1" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700">Plan-Driven / Sequential</text>
    <text x="56" y="40" fill="#0284c7" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="600">MODELS: Waterfall, V-Model</text>
    <line x1="18" y1="48" x2="462" y2="48" stroke="#e0f2fe" stroke-width="1"/>
    <text x="24" y="65" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5">• Linear sequential phases gated by formal milestone sign-offs.</text>
    <text x="24" y="81" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5">• High upfront certainty, strict V&amp;V traceability; late customer feedback.</text>
    <rect x="360" y="12" width="102" height="20" rx="4" fill="#e0f2fe"/>
    <text x="411" y="26" fill="#0369a1" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Predictive Scope</text>
  </g>

  <g transform="translate(30, 210)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="480" height="100" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="100" rx="3" fill="#d97706"/>
    <rect x="18" y="12" width="28" height="28" rx="6" fill="#d97706"/>
    <text x="32" y="30" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">2</text>
    <text x="56" y="25" fill="#b45309" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700">Evolutionary &amp; Risk-Driven</text>
    <text x="56" y="40" fill="#d97706" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="600">MODELS: Boehm's Spiral, Prototyping</text>
    <line x1="18" y1="48" x2="462" y2="48" stroke="#fef3c7" stroke-width="1"/>
    <text x="24" y="65" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5">• Cyclic spirals guided by explicit risk assessment at each turn.</text>
    <text x="24" y="81" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5">• Rapid mockups clarify high-risk, ambiguous user requirements.</text>
    <rect x="360" y="12" width="102" height="20" rx="4" fill="#fef3c7"/>
    <text x="411" y="26" fill="#b45309" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Risk Containment</text>
  </g>

  <g transform="translate(30, 324)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="480" height="100" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="100" rx="3" fill="#16a34a"/>
    <rect x="18" y="12" width="28" height="28" rx="6" fill="#16a34a"/>
    <text x="32" y="30" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">3</text>
    <text x="56" y="25" fill="#15803d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700">Iterative &amp; Incremental (Agile)</text>
    <text x="56" y="40" fill="#16a34a" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="600">MODELS: Incremental, Scrum, XP, MVP</text>
    <line x1="18" y1="48" x2="462" y2="48" stroke="#dcfce7" stroke-width="1"/>
    <text x="24" y="65" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5">• Delivers vertical functional slices in short, timeboxed sprints.</text>
    <text x="24" y="81" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5">• Rapid customer feedback; continuous refinement of past increments.</text>
    <rect x="360" y="12" width="102" height="20" rx="4" fill="#dcfce7"/>
    <text x="411" y="26" fill="#15803d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Adaptive Sprints</text>
  </g>

  <g transform="translate(30, 438)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="480" height="100" rx="10" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="100" rx="3" fill="#7c3aed"/>
    <rect x="18" y="12" width="28" height="28" rx="6" fill="#7c3aed"/>
    <text x="32" y="30" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">4</text>
    <text x="56" y="25" fill="#6d28d9" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700">Continuous &amp; Spec-Driven AI</text>
    <text x="56" y="40" fill="#7c3aed" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="600">PARADIGMS: DevOps, CI/CD, Spec-Driven AI</text>
    <line x1="18" y1="48" x2="462" y2="48" stroke="#f3e8ff" stroke-width="1"/>
    <text x="24" y="65" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5">• Automated commit-to-production pipelines (tests, security, deploy).</text>
    <text x="24" y="81" fill="#334155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5">• Human specifies constraints; AI coding agents implement &amp; verify.</text>
    <rect x="360" y="12" width="102" height="20" rx="4" fill="#f3e8ff"/>
    <text x="411" y="26" fill="#6d28d9" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Continuous Flow</text>
  </g>

  <text x="270" y="562" fill="#64748b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="500" text-anchor="middle">No single model fits all projects: choose based on requirement stability and risk exposure.</text>
</svg>