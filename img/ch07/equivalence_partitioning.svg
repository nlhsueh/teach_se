<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 250" width="650" height="250">
  <!-- Container -->
  <rect x="10" y="10" width="630" height="230" rx="10" fill="#f8f9fa" stroke="none" stroke-width="0"/>
  <text x="325" y="38" fill="#0b3c5d" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle">Equivalence Partitioning &amp; Boundary Value Analysis</text>

  <!-- Number Line Bar -->
  <!-- Invalid Low -->
  <rect x="40" y="80" width="160" height="60" rx="5" fill="#e57373" opacity="0.8"/>
  <text x="120" y="110" fill="#ffffff" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Invalid Partition (&lt; 1)</text>
  <text x="120" y="128" fill="#ffffff" font-family="Arial" font-size="11" text-anchor="middle">e.g., -5, 0</text>

  <!-- Valid Partition -->
  <rect x="210" y="80" width="220" height="60" rx="5" fill="#81c784" opacity="0.8"/>
  <text x="320" y="110" fill="#ffffff" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">Valid Partition (1 - 100)</text>
  <text x="320" y="128" fill="#ffffff" font-family="Arial" font-size="11" text-anchor="middle">e.g., 50 (Representative Value)</text>

  <!-- Invalid High -->
  <rect x="440" y="80" width="160" height="60" rx="5" fill="#e57373" opacity="0.8"/>
  <text x="520" y="110" fill="#ffffff" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Invalid Partition (&gt; 100)</text>
  <text x="520" y="128" fill="#ffffff" font-family="Arial" font-size="11" text-anchor="middle">e.g., 105, 500</text>

  <!-- Boundary Points (BVA) -->
  <g transform="translate(0, 160)">
    <!-- Boundary 1 -->
    <circle cx="205" cy="15" r="8" fill="#d32f2f"/>
    <line x1="205" y1="0" x2="205" y2="-20" stroke="#d32f2f" stroke-width="2"/>
    <text x="205" y="38" fill="#d32f2f" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">0, 1 (Boundary)</text>

    <!-- Boundary 2 -->
    <circle cx="435" cy="15" r="8" fill="#d32f2f"/>
    <line x1="435" y1="0" x2="435" y2="-20" stroke="#d32f2f" stroke-width="2"/>
    <text x="435" y="38" fill="#d32f2f" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">100, 101 (Boundary)</text>
  </g>
</svg>