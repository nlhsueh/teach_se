<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 280" width="650" height="280">
  <!-- Black Box (Left) -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="280" height="240" rx="10" fill="#0b3c5d"/>
    <text x="140" y="35" fill="#ffffff" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Black-Box Testing</text>
    <text x="140" y="55" fill="#328cc1" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">(Specification-Based)</text>
    <line x1="20" y1="65" x2="260" y2="65" stroke="#328cc1" stroke-width="1.5"/>

    <!-- Black Box Core -->
    <rect x="80" y="85" width="120" height="70" rx="5" fill="#111111" stroke="none" stroke-width="0"/>
    <text x="140" y="125" fill="#ffffff" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">SYSTEM (Opaque)</text>

    <!-- Inputs &amp; Outputs -->
    <path d="M 20 120 L 70 120" stroke="#328cc1" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="45" y="110" fill="#ffffff" font-family="Arial" font-size="10" text-anchor="middle">Input</text>

    <path d="M 210 120 L 260 120" stroke="#328cc1" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="235" y="110" fill="#ffffff" font-family="Arial" font-size="10" text-anchor="middle">Output</text>

    <text x="140" y="185" fill="#e1f5fe" font-family="Arial" font-size="11" text-anchor="middle">• No internal code knowledge</text>
    <text x="140" y="205" fill="#e1f5fe" font-family="Arial" font-size="11" text-anchor="middle">• Tests functional requirements &amp; specs</text>
    <text x="140" y="225" fill="#e1f5fe" font-family="Arial" font-size="11" text-anchor="middle">• Equivalence partitioning &amp; boundary values</text>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#328cc1"/>
    </marker>
  </defs>

  <!-- White Box (Right) -->
  <g transform="translate(340, 20)">
    <rect x="0" y="0" width="280" height="240" rx="10" fill="#328cc1"/>
    <text x="140" y="35" fill="#ffffff" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">White-Box Testing</text>
    <text x="140" y="55" fill="#0b3c5d" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">(Structural / Glass-Box)</text>
    <line x1="20" y1="65" x2="260" y2="65" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>

    <!-- Glass Box Core -->
    <rect x="80" y="85" width="120" height="70" rx="5" fill="#ffffff" stroke="none" stroke-width="0"/>
    <text x="140" y="108" fill="#0b3c5d" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle">CODE STRUCTURE</text>
    <path d="M 95 130 L 120 145 L 165 120 L 185 145" fill="none" stroke="#0b3c5d" stroke-width="2" stroke-dasharray="3,3"/>

    <!-- Inputs &amp; Outputs -->
    <path d="M 20 120 L 70 120" stroke="#ffffff" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 210 120 L 260 120" stroke="#ffffff" stroke-width="3" marker-end="url(#arrow)"/>

    <text x="140" y="185" fill="#ffffff" font-family="Arial" font-size="11" text-anchor="middle">• Full visibility into source code</text>
    <text x="140" y="205" fill="#ffffff" font-family="Arial" font-size="11" text-anchor="middle">• Tests internal logic, branches &amp; loops</text>
    <text x="140" y="225" fill="#ffffff" font-family="Arial" font-size="11" text-anchor="middle">• Statement, branch &amp; path coverage</text>
  </g>
</svg>