<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" width="680" height="270">
  <rect x="10" y="10" width="660" height="250" rx="10" fill="#f8f9fa" stroke="none" stroke-width="0"/>
  <text x="340" y="34" fill="#0b3c5d" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle">How AI Assists Architectural Design (Architect Copilot)</text>

  <!-- Box 1: Pattern Recommendation -->
  <g transform="translate(30, 55)">
    <rect x="0" y="0" width="135" height="185" rx="8" fill="#0b3c5d"/>
    <text x="67" y="25" fill="#ffffff" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">1. Pattern Recom</text>
    <line x1="10" y1="35" x2="125" y2="35" stroke="#328cc1" stroke-width="1.5"/>
    <text x="67" y="60" fill="#e1f5fe" font-family="Arial" font-size="9" text-anchor="middle">• Recommends</text>
    <text x="67" y="75" fill="#e1f5fe" font-family="Arial" font-size="9" text-anchor="middle">  Layered/Microservices</text>
    <text x="67" y="100" fill="#e1f5fe" font-family="Arial" font-size="9" text-anchor="middle">• Evaluates Scalability</text>
    <text x="67" y="115" fill="#e1f5fe" font-family="Arial" font-size="9" text-anchor="middle">  &amp; Modularity</text>
    <text x="67" y="140" fill="#ffffff" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle">• Style Trade-off</text>
    <text x="67" y="155" fill="#ffffff" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle">  Selection</text>
  </g>

  <!-- Box 2: Trade-off Analysis -->
  <g transform="translate(195, 55)">
    <rect x="0" y="0" width="135" height="185" rx="8" fill="#328cc1"/>
    <text x="67" y="25" fill="#ffffff" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">2. ATAM Analysis</text>
    <line x1="10" y1="35" x2="125" y2="35" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
    <text x="67" y="60" fill="#ffffff" font-family="Arial" font-size="9" text-anchor="middle">• Analyzes NFR</text>
    <text x="67" y="75" fill="#ffffff" font-family="Arial" font-size="9" text-anchor="middle">  Goal Conflicts</text>
    <text x="67" y="100" fill="#ffffff" font-family="Arial" font-size="9" text-anchor="middle">• Security vs.</text>
    <text x="67" y="115" fill="#ffffff" font-family="Arial" font-size="9" text-anchor="middle">  Performance</text>
    <text x="67" y="140" fill="#ffffff" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle">• CAP Theorem</text>
    <text x="67" y="155" fill="#ffffff" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle">  Evaluation</text>
  </g>

  <!-- Box 3: Interface Specs -->
  <g transform="translate(360, 55)">
    <rect x="0" y="0" width="135" height="185" rx="8" fill="#0b3c5d"/>
    <text x="67" y="25" fill="#ffffff" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">3. API &amp; Contracts</text>
    <line x1="10" y1="35" x2="125" y2="35" stroke="#328cc1" stroke-width="1.5"/>
    <text x="67" y="60" fill="#e1f5fe" font-family="Arial" font-size="9" text-anchor="middle">• Generates OpenAPI</text>
    <text x="67" y="75" fill="#e1f5fe" font-family="Arial" font-size="9" text-anchor="middle">  / gRPC Protobuf</text>
    <text x="67" y="100" fill="#e1f5fe" font-family="Arial" font-size="9" text-anchor="middle">• Decoupled Interface</text>
    <text x="67" y="115" fill="#e1f5fe" font-family="Arial" font-size="9" text-anchor="middle">  Contracts</text>
    <text x="67" y="140" fill="#ffffff" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle">• Schema-First</text>
    <text x="67" y="155" fill="#ffffff" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle">  Development</text>
  </g>

  <!-- Box 4: Threat Modeling -->
  <g transform="translate(525, 55)">
    <rect x="0" y="0" width="125" height="185" rx="8" fill="#e8f5e9" stroke="none" stroke-width="0"/>
    <text x="62" y="25" fill="#2e7d32" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">4. Threat Model</text>
    <line x1="10" y1="35" x2="115" y2="35" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="62" y="60" fill="#333" font-family="Arial" font-size="9" text-anchor="middle">• STRIDE Security</text>
    <text x="62" y="75" fill="#333" font-family="Arial" font-size="9" text-anchor="middle">  Boundary Check</text>
    <text x="62" y="100" fill="#333" font-family="Arial" font-size="9" text-anchor="middle">• Single Point of</text>
    <text x="62" y="115" fill="#333" font-family="Arial" font-size="9" text-anchor="middle">  Failure Detection</text>
    <text x="62" y="140" fill="#2e7d32" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle">• Lead Architect</text>
    <text x="62" y="155" fill="#2e7d32" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle">  Final Decision</text>
  </g>
</svg>