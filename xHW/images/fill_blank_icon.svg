<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="120" height="120">
  <!-- Modern flat vector icon for "fill in the blank" -->
  <!-- Document paper base in light gray/blue -->
  <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 14H7v-2h10v2zm0-4H7v-2h10v2zm0-4H7V7h10v2z" fill="#0b3c5d" opacity="0.15"/>
  <!-- Paper board outline -->
  <rect x="4" y="2" width="16" height="20" rx="2" fill="none" stroke="#0b3c5d" stroke-width="2"/>
  <!-- Lines with blanks -->
  <line x1="7" y1="7" x2="17" y2="7" stroke="#0b3c5d" stroke-width="2" stroke-linecap="round"/>
  <!-- Line 2: has a blank box or dashed line in the middle -->
  <line x1="7" y1="12" x2="11" y2="12" stroke="#0b3c5d" stroke-width="2" stroke-linecap="round"/>
  <line x1="12" y1="12" x2="14" y2="12" stroke="#328cc1" stroke-dasharray="2,2" stroke-width="2" stroke-linecap="round"/>
  <line x1="15" y1="12" x2="17" y2="12" stroke="#0b3c5d" stroke-width="2" stroke-linecap="round"/>
  <!-- Line 3: has a blank box/underlines -->
  <line x1="7" y1="17" x2="9" y2="17" stroke="#0b3c5d" stroke-width="2" stroke-linecap="round"/>
  <line x1="10" y1="17" x2="17" y2="17" stroke="#328cc1" stroke-dasharray="2,2" stroke-width="2" stroke-linecap="round"/>
  <!-- A modern blue pencil writing on the second line -->
  <path d="M21.2 13.5l-1.7-1.7c-.4-.4-1-.4-1.4 0l-7.5 7.5c-.1.1-.2.3-.2.4l-.4 2c-.1.3.1.6.4.5l2-.4c.2-.0.3-.1.4-.2l7.5-7.5c.4-.4.4-1.1 0-1.6z" fill="#328cc1"/>
</svg>
