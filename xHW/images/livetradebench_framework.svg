<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 320" width="100%" height="100%">
  <!-- Background Container -->
  <rect x="10" y="10" width="730" height="300" rx="10" fill="#f8f9fa" stroke="#0b3c5d" stroke-width="2"/>
  <text x="375" y="38" fill="#0b3c5d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">LiveTradeBench Architecture &amp; Execution Pipeline</text>

  <!-- Observation Space -->
  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="200" height="220" rx="8" fill="#0b3c5d"/>
    <text x="100" y="30" fill="#ffffff" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">Observation Space (o_t)</text>
    <line x1="15" y1="42" x2="185" y2="42" stroke="#328cc1" stroke-width="1.5"/>
    
    <rect x="15" y="55" width="170" height="40" rx="5" fill="#328cc1"/>
    <text x="100" y="80" fill="#ffffff" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Current Positions (q_t)</text>
    
    <rect x="15" y="108" width="170" height="40" rx="5" fill="#328cc1"/>
    <text x="100" y="133" fill="#ffffff" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Market Prices (p_t)</text>
    
    <rect x="15" y="161" width="170" height="40" rx="5" fill="#328cc1"/>
    <text x="100" y="186" fill="#ffffff" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Live News Stream (c_t)</text>
  </g>

  <!-- Arrow to LLM Agent -->
  <path d="M 240 170 L 280 170" fill="none" stroke="#328cc1" stroke-width="3" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#328cc1"/>
    </marker>
  </defs>

  <!-- LLM Agent Box -->
  <g transform="translate(290, 80)">
    <rect x="0" y="0" width="170" height="180" rx="8" fill="#328cc1"/>
    <text x="85" y="35" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">LLM Agent</text>
    <text x="85" y="55" fill="#ffffff" font-family="Arial" font-size="10" text-anchor="middle">(21 Evaluated LLMs)</text>
    <line x1="15" y1="70" x2="155" y2="70" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
    
    <text x="85" y="100" fill="#ffffff" font-family="Arial" font-size="11" text-anchor="middle">• Prompt Formatting</text>
    <text x="85" y="125" fill="#ffffff" font-family="Arial" font-size="11" text-anchor="middle">• Reasoning / CoT</text>
    <text x="85" y="150" fill="#ffffff" font-family="Arial" font-size="11" text-anchor="middle">• JSON Allocations</text>
  </g>

  <!-- Arrow to Portfolio Execution -->
  <path d="M 470 170 L 510 170" fill="none" stroke="#328cc1" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Action Space & Execution -->
  <g transform="translate(520, 60)">
    <rect x="0" y="0" width="200" height="220" rx="8" fill="#0b3c5d"/>
    <text x="100" y="30" fill="#ffffff" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">Action Space (a_t)</text>
    <line x1="15" y1="42" x2="185" y2="42" stroke="#328cc1" stroke-width="1.5"/>

    <rect x="15" y="55" width="170" height="40" rx="5" fill="#328cc1"/>
    <text x="100" y="80" fill="#ffffff" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">% Asset Weights (∑=1.0)</text>

    <rect x="15" y="108" width="170" height="40" rx="5" fill="#328cc1"/>
    <text x="100" y="133" fill="#ffffff" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Executable Buy/Sell/Hold</text>

    <rect x="15" y="161" width="170" height="40" rx="5" fill="#328cc1"/>
    <text x="100" y="186" fill="#ffffff" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Portfolio Rebalance</text>
  </g>
</svg>